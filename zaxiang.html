<style>
/* 杂想暂时只对管理员开放：正文默认隐藏，账号状态明确后再决定是否放开 */
#zx-gate{max-width:520px;margin:64px auto;padding:26px 24px 22px;background:#fffdf7;border:1px solid #e0d4bd;border-radius:14px;text-align:center;box-shadow:0 10px 26px rgba(60,44,18,.07)}
#zx-gate h2{margin:0 0 8px;font-size:20px;letter-spacing:.02em}
#zx-gate p{margin:0 0 10px;font-family:var(--sans);font-size:14px;line-height:1.8;color:#6b5b44}
#zx-gate .zx-lock-actions{display:flex;gap:10px;justify-content:center;margin:18px 0 12px}
#zx-gate .zx-lock-btn{font:600 14px/1 var(--sans);cursor:pointer;border:1px solid #b08d57;border-radius:999px;padding:11px 22px;background:#8a6a2f;color:#fff8e9;text-decoration:none}
#zx-gate .zx-lock-btn:hover{background:#75571f}
#zx-gate .zx-lock-btn.ghost{background:transparent;color:#7a5c22}
#zx-gate .zx-lock-btn.ghost:hover{background:rgba(176,141,87,.12)}
#zx-gate .zx-lock-hint{font-size:12px;color:#9a8a72;margin-bottom:0}
#zx-gate[hidden],#zx-main[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="assets/style.css">
</head>

<body data-nav="杂想">

<div class="container">

    <div id="site-header"></div>



    <main class="zx" id="zx-main">
    <section id="zx-gate" aria-labelledby="zx-lock-title">
        <h2 id="zx-lock-title">需要管理员账号</h2>
        <p id="zx-lock-note">杂想暂时只对管理员开放。请先用管理员账号登录。</p>
        <p class="zx-lock-actions">
            <button type="button" class="zx-lock-btn" id="zx-lock-login">管理员登录</button>
            <a class="zx-lock-btn ghost" href="index.html">回首页</a>
        </p>
        <p class="zx-lock-hint">登录后仍停在这里，说明这个账号不是管理员。</p>
        <noscript><p class="zx-lock-hint">需要开启 JavaScript 才能登录。</p></noscript>
    </section>
        <div id="zx-content" hidden></div>
    </main>

</div>

<script src="assets/layout.js"></script>

<script>
/* 杂想仅对管理员开放：正文与资源在通过校验后才按需取，页面源码里不含正文。 */
(function () {
    'use strict';
    var content = document.getElementById('zx-content');
    var gate = document.getElementById('zx-gate');
    var note = document.getElementById('zx-lock-note');
    var btn = document.getElementById('zx-lock-login');
    if (!content || !gate) { return; }

    var settled = false, tries = 0, loading = false;

    function unlock() {
        settled = true;
        gate.hidden = true;
        content.hidden = false;
        document.body.classList.add('zbx-admin');
    }
    function block(text) {
        settled = true;
        content.hidden = true;
        gate.hidden = false;
        document.body.classList.remove('zbx-admin');
        if (note && text) { note.textContent = text; }
    }
    function loadScript(src, done) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = done;
        s.onerror = done;
        document.head.appendChild(s);
    }
    function load() {
        if (content.dataset.loaded === '1') { unlock(); return; }
        if (loading) { return; }
        loading = true;
        if (note) { note.textContent = '正在载入杂想…'; }
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'assets/zaxiang.css';
        document.head.appendChild(link);
        fetch('assets/zx-content.html', { credentials: 'same-origin' })
            .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.text(); })
            .then(function (html) {
                content.innerHTML = html;
                loadScript('assets/zx-bank.js', function () {
                    loadScript('assets/zx-ai.js', function () {
                        loadScript('assets/zaxiang-game.js', function () {
                            content.dataset.loaded = '1';
                            loading = false;
                            unlock();
                        });
                    });
                });
            })
            .catch(function () { loading = false; block('内容加载失败，请刷新重试。'); });
    }
    function check() {
        var acc = window.ZBX_ACCOUNT;
        if (!acc || typeof acc.ready !== 'function' || !acc.ready()) { return false; }
        if (acc.isAdmin()) { load(); return true; }
        block(acc.user()
            ? '当前账号「' + acc.nick() + '」不是管理员。换管理员账号登录后再看。'
            : '杂想暂时只对管理员开放。请先用管理员账号登录。');
        return true;
    }
    if (btn) {
        btn.addEventListener('click', function () {
            if (window.ZBX_ACCOUNT && window.ZBX_ACCOUNT.openPanel) {
                window.ZBX_ACCOUNT.openPanel('login');
            }
        });
    }
    document.addEventListener('zbx:account', function () { check(); });
    (function loop() {
        if (check() || settled) { return; }
        if (++tries > 120) { block('账号状态读取失败：检查网络后刷新重试。'); return; }
        setTimeout(loop, 125);
    })();
})();
</script>

</body>
</html>
