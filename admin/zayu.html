<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>杂豫内容管理 · 连珠杂箱</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="zayu-admin.css">
</head>
<body data-base="../">

<div class="admin-head">
  <a href="index.html"><b>连珠杂箱</b> · 管理后台</a>
  <div class="an-links">
    <a href="index.html">访问统计</a>
    <a href="duiju.html">赛果录入</a>
    <a href="ops.html">运维</a>
    <a href="zayu.html" class="on">杂豫内容</a>
    <a href="../zayu.html" target="_blank" rel="noopener">看站点 ↗</a>
  </div>
  <div class="site-user-slot" data-zbx-user="global" aria-label="账号"></div>
</div>

<div class="wrap">

  <div id="gate">
    <h1>杂豫内容管理</h1>
    <p id="gate-msg">请用管理员账号登录后继续。</p>
    <button type="button" class="btn primary" data-act="login">管理员登录</button>
  </div>

  <div id="panel" hidden>
    <div class="pagehead">
      <h1>杂豫内容管理</h1>
      <p class="sub">比赛、台次、棋谱、人物、个人主页、等级分——都用表单和棋盘直接改，不用写代码。改完刷新站点即生效。</p>
    </div>

    <div id="msg" role="status" aria-live="polite"></div>

    <div class="toolbar">
      <button type="button" class="btn" data-act="refresh">重新读取</button>
      <button type="button" class="btn primary" data-act="recalc">更新等级分</button>
    </div>
    <div class="tipbox">打开即可编辑：内容已在云端，选中左侧任意一条，改完点「保存修改」，访客刷新站点就能看到最新内容。棋手个人主页共 <b>595</b> 位，可用左侧搜索框按姓名快速找到。</div>

    <div class="stat" id="stat"></div>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-kind="competition">比赛与台次</button>
      <button type="button" data-kind="qipu">棋谱</button>
      <button type="button" data-kind="person">人物介绍</button>
      <button type="button" data-kind="person_page">棋手个人主页</button>
      <button type="button" data-kind="rating">等级分</button>
    </div>

    <div class="workspace">
      <div class="sidebar">
        <h2 id="list-title">文档列表</h2>
        <input type="text" id="search" class="search" placeholder="搜索…">
        <div class="doclist" id="doclist"></div>
        <div class="addbar">
          <input type="text" id="new-id" placeholder="新内容 ID">
          <button type="button" class="btn sm primary" data-act="add">＋ 新建</button>
        </div>
      </div>
      <div class="pane" id="pane"></div>
    </div>

  </div>
</div>

<script src="../assets/cloud.js"></script>
<script src="../assets/account.js"></script>
<script src="zayu-admin.js"></script>
</body>
</html>
