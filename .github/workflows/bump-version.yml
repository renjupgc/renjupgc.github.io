name: Bump Version

# 每次推 main 抬一次小版本（y）：0.28.1 -> 0.28.2 -> …
# 提交说明的标题里写 [x] 表示这次是大改动：抬 x、y 归零（0.29.0）。最前面的 0 不动。
# VERSION 是唯一来源，页脚读它显示版本号。
#
# 用 GITHUB_TOKEN 推的提交不会再次触发工作流（GitHub 的默认行为），所以自己不会套自己；
# 机器提交的标题再带一个标记，双保险（只认标题，正文里聊到不算）。

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump VERSION
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os, re

          msg = os.environ.get('COMMIT_MSG', '') or ''
          subject = msg.split('\n')[0]
          out = open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8')

          if '[skip version]' in subject:
              print('标题带 [skip version]，这次不动版本号')
              out.write('changed=false\n')
              raise SystemExit(0)

          raw = open('VERSION', encoding='utf-8').read().strip()
          m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', raw)
          if not m:
              raise SystemExit('VERSION 内容不是 0.x.y：%r' % raw)
          major, x, y = (int(g) for g in m.groups())

          if '[x]' in subject:
              x, y = x + 1, 0          # 大改动：抬 x，y 归零
          else:
              y += 1                   # 小改动：抬 y

          new = '%d.%d.%d' % (major, x, y)
          with open('VERSION', 'w', encoding='utf-8', newline='') as f:
              f.write(new + '\n')
          out.write('changed=true\n')
          print('%s -> %s' % (raw, new))
          PY

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(version): $(cat VERSION)"
          git push
