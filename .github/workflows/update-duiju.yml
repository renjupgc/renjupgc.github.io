name: Update Duiju API

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tid:
        description: "赛事 id，如 2026-shanhai"
        required: false
        default: "2026-shanhai"
      round:
        description: "轮次"
        required: false
        default: "1"
      results:
        description: "赛果，如 1=B,2=W,5=-（- 为清空）"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths:
      - "data/shanhai/**"
      - "data/duiju.db"
      - "tools/manage_duiju.py"
      - ".github/workflows/update-duiju.yml"

permissions:
  contents: write

concurrency:
  group: update-duiju-api
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install whr

      - name: Apply results from the admin page
        if: github.event_name == 'workflow_dispatch' && inputs.results != ''
        run: python tools/manage_duiju.py apply --tid "${{ inputs.tid }}" --round "${{ inputs.round }}" --results "${{ inputs.results }}"

      - name: Sync duiju.db from round JSON and export api/duiju
        run: python tools/manage_duiju.py sync

      - name: Commit updated DB and API if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duiju.db api/duiju
          if git diff --cached --quiet; then
            echo "No changes in duiju.db or api/duiju."
          else
            git commit -m "chore(duiju): sync DB and export api/duiju"
            git push
          fi
