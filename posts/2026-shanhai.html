<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>@font-face{
  font-family:"ShuHei";
  font-style:normal;
  font-weight:400 900;
  font-display:swap;
  src:local("Alimama ShuHeiTi Bold"),local("Alimama ShuHeiTi"),local("AlimamaShuHeiTi-Bold"),local("阿里妈妈数黑体"),
      url("../fonts/AlimamaShuHeiTi-Bold.woff2") format("woff2"),
      url("https://cdn.jsdelivr.net/npm/@fontpkg/alimama-shu-hei-ti/AlimamaShuHeiTi-Bold.woff2") format("woff2");
}
* { font-family: "ShuHei", "Alimama ShuHeiTi", "AlimamaShuHeiTi-Bold", "阿里妈妈数黑体", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important; }

:root{
  --paper:#f2f0e9;
  --card:#fffefb;
  --ink:#15201c;
  --ink3:#7c877f;
  --line:#e4dfd2;
  --line2:#eeeadf;
  --green:#0d4736;
  --mint:#e5f0ea;
  --mint2:#f2f8f5;
  --pos-bg:#ddefe5;
  --neg-bg:#e7e5db;
  --neg-ink:#6d776f;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  /* 展示字体：阿里妈妈数黑体子集，中文与数字统一 */
  --dis:"ShuHei","PingFang SC","Microsoft YaHei",var(--sans);
  --num:var(--dis);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-synthesis:none}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:28px 20px 40px;
}
.sheet{max-width:1020px;margin:0 auto}

.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;
  box-shadow:0 16px 40px -30px rgba(12,50,40,.5);
}
.card::before{
  content:"";display:block;height:4px;
  background:linear-gradient(90deg,#0d4736 0%,#2f7f63 42%,#cf8f45 100%);
}

/* 标题 */
.hd{padding:19px 22px 17px;border-bottom:1px solid var(--line)}
.hd h1{
  margin:0;font-size:25px;font-weight:700;line-height:1.34;letter-spacing:.005em;
  color:var(--ink);white-space:normal;
}
.hd h1 em{font-style:normal;color:var(--green)}
.hd h1 .yr{
  font-family:var(--num);font-weight:700;letter-spacing:.01em;
  font-size:1.06em;
}
.hd-sub{
  margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  font-size:13px;color:var(--ink3);
}
.hd-sub .rd{
  font-size:13px;font-weight:600;line-height:1.7;
  color:var(--green);background:var(--mint);
  border-radius:999px;padding:1px 9px;
}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{
  background:var(--mint);vertical-align:bottom;
  font:400 13px/1 var(--dis);letter-spacing:.13em;color:#2c5b49;
  padding:12px 10px;white-space:nowrap;border-bottom:1px solid #d3e5db;
}
thead th.t-no{width:56px;text-align:center}
thead th.t-bn{text-align:left;padding-left:20px}
thead th.t-wn{text-align:right;padding-right:20px}
thead th.t-prob{width:248px;padding:11px 22px 12px}

/* 表头：与单元格同构，上为「胜率分布」，下为三项名称 */
.ph-nums{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:baseline}
.ph-nums i{font-style:normal;font:400 13px/1 var(--dis);letter-spacing:.07em;color:#2c5b49}
.ph-nums i:nth-child(1){text-align:left}
.ph-nums i:nth-child(2){text-align:center}
.ph-nums i:nth-child(3){text-align:right}

tbody tr{border-bottom:1px solid var(--line2);transition:background .15s}
tbody tr:nth-child(even){background:#fafdfb}
tbody tr:hover{background:var(--mint2)}
tbody tr:last-child{border-bottom:0}
td{padding:10px;vertical-align:middle}

td.c-no{text-align:center;width:56px;
  font:400 14.5px/1 var(--num);letter-spacing:.02em;color:var(--ink3);
  font-variant-numeric:tabular-nums}
td.c-bn{text-align:left;padding-left:20px;white-space:nowrap}
td.c-wn{text-align:right;padding-right:20px;white-space:nowrap}
.pn{font:400 17.5px/1 var(--dis);letter-spacing:.01em;color:var(--ink)}
.pid{
  display:inline-block;min-width:26px;text-align:center;
  font:400 13px/1 var(--num);letter-spacing:.02em;
  color:#8d978f;background:#f1f0e8;
  border-radius:5px;padding:4px 5px 3px;margin:0 10px;vertical-align:2px;
}
td.c-bn .pid{margin-left:0}
td.c-wn .pid{margin-right:0}

/* 概率块：条在上，三个数在下 */
td.c-prob{width:248px;padding:11px 22px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#f0eee5;gap:1.5px}
.bar i{display:block;height:100%}
.bar .s-b{background:linear-gradient(180deg,#1a5f49,#0d4736)}
.bar .s-d{background:linear-gradient(180deg,#e6b273,#cf8f45)}
.bar .s-w{background:linear-gradient(180deg,#cfdbd4,#b6c8bf)}

.nums{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:8px}
.n{display:flex;flex-direction:column;gap:5px;min-width:0}
.n:nth-child(1){justify-self:start;align-items:flex-start}
.n:nth-child(2){justify-self:center;align-items:center}
.n:nth-child(3){justify-self:end;align-items:flex-end}
.n em{display:none;font-style:normal;font:400 10px/1 var(--dis);letter-spacing:.1em;color:#a3aca5}

.v{
  display:inline-block;text-align:center;white-space:nowrap;
  font:400 17px/1 var(--num);letter-spacing:.01em;
  color:var(--ink3);padding:6px 7px 5px;border-radius:8px;
  transition:background .15s;
}
.v i{font-style:normal;font-size:.66em;font-weight:400;opacity:.66;margin-left:1.5px}

.v.top{font-weight:400}
.v.top.pos{background:var(--pos-bg);color:var(--green)}
.v.top.neg{background:var(--neg-bg);color:var(--neg-ink);
  box-shadow:inset 0 0 0 1px rgba(21,32,28,.05)}
.v.top.neg i{opacity:.55}

/* 深色 */
@media (prefers-color-scheme:dark){
  body{background:#121614;color:#e9efe9}
  .card{background:#181d1a;border-color:#26332c}
  .hd{border-color:#26332c}
  .hd h1{color:#eef4ef}
  .hd h1 em{color:#8fc7ae}
  .hd-sub{color:#7f8d85}
  .hd-sub .rd{background:#1e2a24;color:#93d3b6}
  thead th{background:#1e2a24;color:#8fc7ae;border-color:#2b3a32}
  .ph-nums i{color:#8fc7ae}
  tbody tr{border-color:#232d28}
  tbody tr:nth-child(even){background:#1a201c}
  tbody tr:hover{background:#1f2a24}
  .pn{color:#e9efe9}
  .pid{background:#232d28;color:#85928a}
  td.c-no{color:#7f8d85}
  .bar{background:#1b231f}
  .bar .s-w{background:linear-gradient(180deg,#43594e,#375046)}
  .bar .s-d{background:linear-gradient(180deg,#c9945a,#a9773f)}
  .n em{color:#6d7a72}
  .v.top.pos{background:#1b3a2e;color:#93d3b6;box-shadow:inset 0 0 0 1px #2b5443}
  .v.top.neg{background:#262a26;color:#9aa39c;box-shadow:inset 0 0 0 1px #343a34}
}

/* 窄屏：行变卡片 */
@media (max-width:820px){
  body{padding:12px 12px 28px}
  .sheet{max-width:none}
  .hd{padding:15px 15px 13px}
  .hd h1{font-size:18px;line-height:1.42}
  .hd-sub{margin-top:7px;font-size:12.5px;gap:6px 10px}
  .hd-sub .rd{font-size:12.5px;padding:1px 8px}
  .mlink{font-size:12.5px}
  .rd-nav{width:100%;margin-left:0}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tbody tr{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:
      "no bh wn"
      "pb pb pb";
    align-items:center;gap:11px 10px;padding:13px 15px 14px;
    border-bottom:1px solid var(--line2);
  }
  tbody tr:nth-child(even){background:#fafdfb}
  td{padding:0!important;border:0;width:auto!important;height:auto!important;white-space:normal}

  td.c-no{grid-area:no;text-align:left}
  td.c-bn{grid-area:bh;text-align:left}
  td.c-wn{grid-area:wn;text-align:right}
  td.c-prob{grid-area:pb;padding:0!important}

  td.c-bn .pid{margin:0 6px 0 0;vertical-align:1px}
  td.c-wn .pid{margin:0 0 0 6px;vertical-align:1px}
  .pn{font-size:17px}

  .bar{height:8px}
  .nums{margin-top:9px}
  .n em{display:block;margin-bottom:1px}
  .v{font-size:17px;padding:5px 8px 4px}
}

@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;border:0;border-radius:0}
  tbody tr{break-inside:avoid}
  .sheet{max-width:none}
}

.pscore{display:inline-block;padding:1px 6px;margin:0 4px;font-size:12px;color:var(--ink3);background:var(--line2);border-radius:10px;vertical-align:middle;}
/* 选轮导航 */
.rd-nav{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.rd-nav a{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink3);text-decoration:none;font-size:12.5px;line-height:1.7}
.rd-nav a.on{background:var(--green);border-color:var(--green);color:#fff}
.mlink{margin-left:10px;color:var(--green);text-decoration:none;font-size:13px;
  border-bottom:1px solid var(--line);padding-bottom:1px}

/* 赛果标签：库里 result 有值才出现 */
.m-res{text-align:center;margin-bottom:7px}
.res-tag{display:inline-block;font:400 12px/1 var(--num);letter-spacing:.05em;padding:2.5px 10px;border-radius:12px}
.res-b{background:#ddefe5;color:#0d4736}
.res-w{background:#e8edf5;color:#1e3a5f}
.res-d{background:#f5edd6;color:#7a5a10}

/* 未预测 / 载入中 / 出错 */
.nopred{display:block;text-align:center;font:400 13px/1 var(--dis);letter-spacing:.09em;color:#a8b1a9;padding:9px 0}
.ph td{padding:26px 24px;text-align:left;font:400 13.5px/1.8 var(--sans);color:var(--ink3)}
.ph td .msg{display:block;color:var(--ink);font:400 15px/1.6 var(--dis)}
.ph td code{font-family:var(--mono);font-size:12px;color:var(--green);background:var(--mint2);border-radius:4px;padding:1px 5px}

@media (prefers-color-scheme:dark){
  .rd-nav a{border-color:#2a322e;color:#9aa79f}
  .rd-nav a.on{background:#2c5b49;border-color:#2c5b49;color:#fff}
  .mlink{color:#7fd0ae}
  .res-b{background:#1b3a2e;color:#93d3b6}
  .res-w{background:#1f2937;color:#9db6d4}
  .res-d{background:#332b1a;color:#d3b474}
  .ph td{color:#7f8d85}
  .ph td .msg{color:#e9efe9}
  .nopred{color:#6d7a72}
}

@media (max-width:820px){
  .hd-sub{gap:6px 10px}
  tbody tr.ph{display:block;padding:0}
  tbody tr.ph td{display:block}
}
</style>
</head>
<body>
<div class="sheet">
  <div class="card">
    <div class="hd">
      <h1 id="ttl"><em>「山海杯」</em><span class="yr">2026</span> 年全国五子棋业余棋王争霸赛线下总决赛</h1>
      <div class="hd-sub" id="sub">
        <span id="grp">公开组</span>
        <span class="rd" id="rnd">第 1 轮</span>
        <a class="mlink" id="dlink" href="2026-shanhai-details.html">名次表 ↗</a>
        <a class="mlink" href="2026-shanhai-metrics.html">模型评估 ↗</a>
        <nav class="rd-nav" id="rdnav"></nav>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th class="t-no">台号</th>
          <th class="t-bn">假先方</th>
          <th class="t-prob">
            <span class="ph-nums"><i>假先胜率</i><i>和棋率</i><i>假后胜率</i></span>
          </th>
          <th class="t-wn">假后方</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr class="ph"><td colspan="4">正在读取</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
(function () {
  'use strict';

  var SLUG = 'shanhai';
  var API = '../api/duiju/' + SLUG + '/';
  var INDEX = '../api/duiju/index.json';

  var fromPath = (/r(\d+)\.html$/.exec(location.pathname) || [])[1];
  var fromQuery = new URLSearchParams(location.search).get('r');
  var ROUND = parseInt(fromQuery || fromPath || '1', 10);
  if (!(ROUND > 0)) ROUND = 1;
  var dlink = document.querySelector('a[href="2026-shanhai-details.html"]');
  if (dlink) dlink.href = '2026-shanhai-details.html?r=' + ROUND;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pct(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function score(v) {
    if (v == null) return '—';
    return (Math.round(v * 100) / 100).toString() + '分';
  }
  function roundNo(x) { return typeof x === 'number' ? x : x.round; }

  function decorate(name, year) {
    var s = esc(name);
    s = s.replace(/「([^」"]{1,24})」/, '<em>「$1」</em>');
    if (year) s = s.replace(String(year) + ' 年', '<span class="yr">' + year + '</span> 年');
    return s;
  }

  function navCell(label, v, cls) {
    return '<span class="n"><em>' + label + '</em><span class="v' + cls + '">' +
      pct(v) + '<i>%</i></span></span>';
  }

  function probCell(g) {
    var p = g.prediction || {};
    if (p.black == null || p.draw == null || p.white == null) {
      return '<td class="c-prob"><span class="nopred">未预测</span></td>';
    }
    var pb = p.black, pd = p.draw, pw = p.white;
    var total = pb + pd + pw || 1;
    var top = Math.max(pb, pd, pw);
    // 最高的一项没到 50%：这盘没有明显优势，底色改用灰的，不再用绿色强调
    var muted = top < 50;
    var tag = '';
    if (g.result === 'B') tag = '<div class="m-res"><span class="res-tag res-b">1 : 0</span></div>';
    else if (g.result === 'W') tag = '<div class="m-res"><span class="res-tag res-w">0 : 1</span></div>';
    else if (g.result === 'D') tag = '<div class="m-res"><span class="res-tag res-d">0.5 : 0.5</span></div>';
    return '<td class="c-prob">' + tag +
      '<span class="bar" title="假先 ' + pct(pb) + '% · 和 ' + pct(pd) + '% · 假后 ' + pct(pw) + '%">' +
      '<i class="s-b" style="width:' + (pb / total * 100).toFixed(2) + '%"></i>' +
      '<i class="s-d" style="width:' + (pd / total * 100).toFixed(2) + '%"></i>' +
      '<i class="s-w" style="width:' + (pw / total * 100).toFixed(2) + '%"></i></span>' +
      '<span class="nums">' +
      navCell('假先', pb, pb === top ? (muted ? ' top neg' : ' top pos') : '') +
      navCell('和棋', pd, pd === top ? (muted ? ' top neg' : ' top') : '') +
      navCell('假后', pw, pw === top ? (muted ? ' top neg' : ' top pos') : '') +
      '</span></td>';
  }

  function row(g) {
    var b = g.black || {}, w = g.white || {};
    return '<tr>' +
      '<td class="c-no">' + (g.table == null ? '' : g.table) + '</td>' +
      '<td class="c-bn"><span class="pid">' + (b.no == null ? '' : b.no) + '</span>' +
        '<span class="pn" title="' + esc(b.name) + '">' + esc(b.name) + '</span>' +
        '<span class="pscore">' + score(b.score) + '</span></td>' +
      probCell(g) +
      '<td class="c-wn"><span class="pscore">' + score(w.score) + '</span>' +
        '<span class="pn" title="' + esc(w.name) + '">' + esc(w.name) + '</span>' +
        '<span class="pid">' + (w.no == null ? '' : w.no) + '</span></td>' +
      '</tr>';
  }

  function nav(rounds, cur) {
    var el = document.getElementById('rdnav');
    var list = (rounds || []).map(roundNo).filter(function (x) { return x > 0; });
    list = list.filter(function (x, i) { return list.indexOf(x) === i; });
    list.sort(function (a, b) { return a - b; });
    if (list.length === 0) { el.innerHTML = ''; return; }
    if (list.length < 2 && list.indexOf(cur) !== -1) { el.innerHTML = ''; return; }
    el.innerHTML = list.map(function (r) {
      return '<a href="?r=' + r + '"' + (r === cur ? ' class="on"' : '') + '>第 ' + r + ' 轮</a>';
    }).join('');
  }

  function render(d) {
    var t = d.tournament || {};
    var r = d.round;
    var short = (String(t.name || '').match(/「([^」]+)」/) || [])[1] || '山海杯';

    document.title = short + ' · 第 ' + r + ' 轮对阵概率预测表';
    document.getElementById('ttl').innerHTML = decorate(t.name || short, t.year);
    document.getElementById('grp').textContent = t.group || '';
    document.getElementById('rnd').textContent = '第 ' + r + ' 轮';
    nav(d.rounds, r);
    var dl = document.getElementById("dlink");
    if (dl) dl.href = "2026-shanhai-details.html?r=" + r;

    var games = (d.games || []).slice().sort(function (a, b) { return a.table - b.table; });
    document.getElementById('rows').innerHTML = games.length
      ? games.map(row).join('')
      : '<tr class="ph"><td colspan="4">这一轮还没有对局。</td></tr>';
  }

  function fail(title, hint, rounds) {
    document.getElementById('rows').innerHTML =
      '<tr class="ph"><td colspan="4"><span class="msg">' + title + '</span>' + hint + '</td></tr>';
    nav(rounds, ROUND);
  }

  function get(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      return res.json();
    });
  }

  get(API + 'r' + ROUND + '.json').then(render).catch(function (err) {
    if (err && err.status === 404) {
      get(INDEX).then(function (idx) {
        var list = idx.tournaments || [];
        var t = list.filter(function (x) { return x.slug === SLUG; })[0] || list[0];
        var rounds = t ? (t.rounds || []).map(roundNo) : [];
        if (t) {
          var short = (String(t.name || '').match(/「([^」]+)」/) || [])[1] || '山海杯';
          document.title = short + ' · 第 ' + ROUND + ' 轮（未录入）';
          document.getElementById('ttl').innerHTML = decorate(t.name || short, t.year);
          document.getElementById('grp').textContent = t.group || '';
          document.getElementById('rnd').textContent = '第 ' + ROUND + ' 轮';
        }
        fail('第 ' + ROUND + ' 轮还没有录入。',
             rounds.length
               ? '库里现有：' + rounds.map(function (x) { return '第 ' + x + ' 轮'; }).join('、') + '。'
               : '这场赛事还没有任何一轮入库。',
             rounds);
      }).catch(function () {
        fail('第 ' + ROUND + ' 轮还没有录入。', '也读不到 api/duiju/index.json，列不出已有轮次。', []);
      });
    } else {
      fail('读不到接口数据。',
           '本地预览请起 http 服务（<code>python -m http.server</code>）再打开本页；<code>file://</code> 下浏览器不允许 fetch 本地 JSON。', []);
    }
  });
})();
</script>
</body>
</html>
