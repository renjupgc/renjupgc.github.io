<title>杂技 - 连珠杂箱</title>
<meta name="description" content="连珠杂箱的杂技栏目：棋盘、打谱一类的小工具。">
<meta name="theme-color" content="#f6f2e9">
<link rel="stylesheet" href="assets/style.css">
</head>

<body data-nav="杂技">

<div class="container">

    <div id="site-header"></div>

    <main>

        <header class="page-head">
            <p class="eyebrow">栏目</p>
            <h1 class="page-title">杂技</h1>
            <p class="page-desc">手上的一点小玩意，摆子、打谱都在这里。</p>
        </header>

        <section>
            <h2>工具</h2>
            <ul class="tool-list">
                <li>
                    <a href="zaji/dapu.html">
                        <b>打谱</b>
                        <span>在棋盘上一手手摆子，可撤销、可跳转，也能看引擎给出的胜率；手上只有一张图，还能直接认成棋谱。</span>
                    </a>
                </li>
                <li>
                    <a href="zaji/molun.html">
                        <b>末轮计算器</b>
                        <span>按累计积分录各轮成绩，破同分随你排，算出末轮要什么结果才能进目标名次。</span>
                    </a>
                </li>
                <li>
                    <a href="zaji/predict.html">
                        <b>胜率预测</b>
                        <span>左右各选一位棋手，按等级分、交手记录和各自战绩推出胜平负，并换算成赔率。</span>
                    </a>
                </li>
                <li>
                    <a href="zaji/jinzhao.html">
                        <b>禁手找茬</b>
                        <span>盘上藏着一个点，黑棋落下去就违例。找出那处三三、四四或者长连。</span>
                    </a>
                </li>
                <li>
                    <a href="zaji/vcf.html">
                        <b>VCF 做题</b>
                        <span>题目现场生成，点一下换一盘。每一步都得是冲四，白方只能跟着挡，练的是算到最后一手的功夫。</span>
                    </a>
                </li>
            </ul>
        </section>

    </main>
