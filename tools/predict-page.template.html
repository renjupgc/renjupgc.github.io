<!DOCTYPE html>
<!-- 骨架：轮次预测页（build_exact_shanhai.py / generate_standings_and_r7.py 用）。
     脚本负责换 <title>、<div class="hd"> 与 <tbody>；这份文件不进站、不进 sitemap。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山海杯 · 第 1 轮对阵概率预测表</title>
<style>
@font-face{
  font-family:"ShuHei";
  font-style:normal;
  font-weight:400 900;
  font-display:swap;
  src:local("Alimama ShuHeiTi Bold"),local("Alimama ShuHeiTi"),local("AlimamaShuHeiTi-Bold"),local("阿里妈妈数黑体"),
      url("../fonts/AlimamaShuHeiTi-Bold.woff2") format("woff2"),
      url("https://cdn.jsdelivr.net/npm/@fontpkg/alimama-shu-hei-ti/AlimamaShuHeiTi-Bold.woff2") format("woff2");
}
* { font-family: "ShuHei", "Alimama ShuHeiTi", "AlimamaShuHeiTi-Bold", "阿里妈妈数黑体", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important; }

:root{
  --paper:#f2f0e9;
  --card:#fffefb;
  --ink:#15201c;
  --ink3:#7c877f;
  --line:#e4dfd2;
  --line2:#eeeadf;
  --green:#0d4736;
  --mint:#e5f0ea;
  --mint2:#f2f8f5;
  --pos-bg:#ddefe5;
  --neg-bg:#e7e5db;
  --neg-ink:#6d776f;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  /* 展示字体：阿里妈妈数黑体子集，中文与数字统一 */
  --dis:"ShuHei","PingFang SC","Microsoft YaHei",var(--sans);
  --num:var(--dis);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-synthesis:none}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;
  padding:28px 20px 40px;
}
.sheet{max-width:1020px;margin:0 auto}

.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;
  box-shadow:0 16px 40px -30px rgba(12,50,40,.5);
}
.card::before{
  content:"";display:block;height:4px;
  background:linear-gradient(90deg,#0d4736 0%,#2f7f63 42%,#cf8f45 100%);
}

/* 标题 */
.hd{padding:19px 22px 17px;border-bottom:1px solid var(--line)}
.hd h1{
  margin:0;font:400 27px/1.32 var(--dis);letter-spacing:.005em;
  color:var(--ink);white-space:nowrap;
}
.hd h1 em{font-style:normal;color:var(--green)}
.hd h1 .yr{
  font-family:var(--num);font-weight:400;letter-spacing:.01em;
  font-size:1.06em;
}
.hd-sub{
  margin:9px 0 0;display:flex;align-items:center;gap:9px;
  font:400 13.5px/1 var(--dis);letter-spacing:.09em;color:#68746d;
}
.hd-sub .rd{
  font:400 14px/1 var(--num);letter-spacing:.05em;
  color:var(--green);background:var(--mint);
  border-radius:5px;padding:5px 8px 4px;
}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{
  background:var(--mint);vertical-align:bottom;
  font:400 13px/1 var(--dis);letter-spacing:.13em;color:#2c5b49;
  padding:12px 10px;white-space:nowrap;border-bottom:1px solid #d3e5db;
}
thead th.t-no{width:56px;text-align:center}
thead th.t-bn{text-align:left;padding-left:20px}
thead th.t-wn{text-align:right;padding-right:20px}
thead th.t-prob{width:248px;padding:11px 22px 12px}

/* 表头：与单元格同构，上为「胜率分布」，下为三项名称 */
.ph-nums{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:baseline}
.ph-nums i{font-style:normal;font:400 13px/1 var(--dis);letter-spacing:.07em;color:#2c5b49}
.ph-nums i:nth-child(1){text-align:left}
.ph-nums i:nth-child(2){text-align:center}
.ph-nums i:nth-child(3){text-align:right}

tbody tr{border-bottom:1px solid var(--line2);transition:background .15s}
tbody tr:nth-child(even){background:#fafdfb}
tbody tr:hover{background:var(--mint2)}
tbody tr:last-child{border-bottom:0}
td{padding:10px;vertical-align:middle}

td.c-no{text-align:center;width:56px;
  font:400 14.5px/1 var(--num);letter-spacing:.02em;color:var(--ink3);
  font-variant-numeric:tabular-nums}
td.c-bn{text-align:left;padding-left:20px;white-space:nowrap}
td.c-wn{text-align:right;padding-right:20px;white-space:nowrap}
.pn{font:400 17.5px/1 var(--dis);letter-spacing:.01em;color:var(--ink)}
.pid{
  display:inline-block;min-width:26px;text-align:center;
  font:400 13px/1 var(--num);letter-spacing:.02em;
  color:#8d978f;background:#f1f0e8;
  border-radius:5px;padding:4px 5px 3px;margin:0 10px;vertical-align:2px;
}
td.c-bn .pid{margin-left:0}
td.c-wn .pid{margin-right:0}

/* 概率块：条在上，三个数在下 */
td.c-prob{width:248px;padding:11px 22px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#f0eee5;gap:1.5px}
.bar i{display:block;height:100%}
.bar .s-b{background:linear-gradient(180deg,#1a5f49,#0d4736)}
.bar .s-d{background:linear-gradient(180deg,#e6b273,#cf8f45)}
.bar .s-w{background:linear-gradient(180deg,#cfdbd4,#b6c8bf)}

.nums{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:8px}
.n{display:flex;flex-direction:column;gap:5px;min-width:0}
.n:nth-child(1){justify-self:start;align-items:flex-start}
.n:nth-child(2){justify-self:center;align-items:center}
.n:nth-child(3){justify-self:end;align-items:flex-end}
.n em{display:none;font-style:normal;font:400 10px/1 var(--dis);letter-spacing:.1em;color:#a3aca5}

.v{
  display:inline-block;text-align:center;white-space:nowrap;
  font:400 17px/1 var(--num);letter-spacing:.01em;
  color:var(--ink3);padding:6px 7px 5px;border-radius:8px;
  transition:background .15s;
}
.v i{font-style:normal;font-size:.66em;font-weight:400;opacity:.66;margin-left:1.5px}

.v.top{font-weight:400}
.v.top.pos{background:var(--pos-bg);color:var(--green)}
.v.top.neg{background:var(--neg-bg);color:var(--neg-ink);
  box-shadow:inset 0 0 0 1px rgba(21,32,28,.05)}
.v.top.neg i{opacity:.55}

/* 深色 */
@media (prefers-color-scheme:dark){
  body{background:#121614;color:#e9efe9}
  .card{background:#181d1a;border-color:#26332c}
  .hd{border-color:#26332c}
  .hd h1{color:#eef4ef}
  .hd h1 em{color:#8fc7ae}
  .hd-sub{color:#7f8d85}
  .hd-sub .rd{background:#1e2a24;color:#93d3b6}
  thead th{background:#1e2a24;color:#8fc7ae;border-color:#2b3a32}
  .ph-nums i{color:#8fc7ae}
  tbody tr{border-color:#232d28}
  tbody tr:nth-child(even){background:#1a201c}
  tbody tr:hover{background:#1f2a24}
  .pn{color:#e9efe9}
  .pid{background:#232d28;color:#85928a}
  td.c-no{color:#7f8d85}
  .bar{background:#1b231f}
  .bar .s-w{background:linear-gradient(180deg,#43594e,#375046)}
  .bar .s-d{background:linear-gradient(180deg,#c9945a,#a9773f)}
  .n em{color:#6d7a72}
  .v.top.pos{background:#1b3a2e;color:#93d3b6;box-shadow:inset 0 0 0 1px #2b5443}
  .v.top.neg{background:#262a26;color:#9aa39c;box-shadow:inset 0 0 0 1px #343a34}
}

/* 窄屏：行变卡片 */
@media (max-width:820px){
  body{padding:12px 12px 28px}
  .sheet{max-width:none}
  .hd{padding:15px 15px 13px}
  .hd h1{font-size:19.5px;line-height:1.45;white-space:normal}
  .hd-sub{margin-top:7px;font-size:13px;gap:8px}
  .hd-sub .rd{font-size:13px;padding:4px 7px 3px}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tbody tr{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:
      "no bh wn"
      "pb pb pb";
    align-items:center;gap:11px 10px;padding:13px 15px 14px;
    border-bottom:1px solid var(--line2);
  }
  tbody tr:nth-child(even){background:#fafdfb}
  td{padding:0!important;border:0;width:auto!important;height:auto!important;white-space:normal}

  td.c-no{grid-area:no;text-align:left}
  td.c-bn{grid-area:bh;text-align:left}
  td.c-wn{grid-area:wn;text-align:right}
  td.c-prob{grid-area:pb;padding:0!important}

  td.c-bn .pid{margin:0 6px 0 0;vertical-align:1px}
  td.c-wn .pid{margin:0 0 0 6px;vertical-align:1px}
  .pn{font-size:17px}

  .bar{height:8px}
  .nums{margin-top:9px}
  .n em{display:block;margin-bottom:1px}
  .v{font-size:17px;padding:5px 8px 4px}
}

@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;border:0;border-radius:0}
  tbody tr{break-inside:avoid}
  .sheet{max-width:none}
}

.pscore{display:inline-block;padding:1px 6px;margin:0 4px;font-size:12px;color:var(--ink3);background:var(--line2);border-radius:10px;vertical-align:middle;}
</style>
</head>
<body>
<div class="sheet">
  <div class="card">
    <div class="hd">
      <h1><em>「山海杯」</em><span class="yr">2026</span> 年全国五子棋业余棋王争霸赛线下总决赛</h1>
      <p class="hd-sub">公开组 <span class="rd">第 1 轮</span></p>
    </div>
    <table>
      <thead>
        <tr>
          <th class="t-no">台号</th>
          <th class="t-bn">假先方</th>
          <th class="t-prob">
            <span class="ph-nums"><i>假先胜率</i><i>和棋率</i><i>假后胜率</i></span>
          </th>
          <th class="t-wn">假后方</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
