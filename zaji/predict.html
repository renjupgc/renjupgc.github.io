<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胜率预测 - 连珠杂箱</title>
<meta name="description" content="选两位棋手，按等级分、交手记录与各自战绩推算胜平负概率与赔率。">
<meta name="theme-color" content="#f6f2e9">
<link rel="stylesheet" href="../assets/style.css">
</head>

<body data-nav="杂技" data-base="../">

<div class="container">

    <div id="site-header"></div>

    <main>

        <header class="page-head">
            <p class="eyebrow">杂技</p>
            <h1 class="page-title">胜率预测</h1>
            <p class="page-desc">左右各选一位棋手，看等级分、交手记录与各自战绩算出的胜平负，以及换算出的赔率。</p>
        </header>

        <section class="wp">
            <div class="wp-pick">
                <label class="wp-slot wp-slot-a">
                    <span class="wp-tag">左侧 · 甲</span>
                    <input class="wp-input" id="wp-a" list="wp-names" placeholder="输入棋手姓名" autocomplete="off">
                </label>
                <button type="button" class="wp-swap" id="wp-swap" title="左右交换">⇄</button>
                <label class="wp-slot wp-slot-b">
                    <span class="wp-tag">右侧 · 乙</span>
                    <input class="wp-input" id="wp-b" list="wp-names" placeholder="输入棋手姓名" autocomplete="off">
                </label>
            </div>
            <datalist id="wp-names"></datalist>

            <div class="wp-result" id="wp-result"></div>

            <div class="wp-cards">
                <article class="wp-card" id="wp-card-a"></article>
                <article class="wp-card" id="wp-card-b"></article>
            </div>

            <div class="wp-h2h" id="wp-h2h"></div>
        </section>

    </main>

</div>

<script src="../assets/layout.js"></script>
<script src="../assets/predict.js"></script>
<script src="../assets/predict-app.js"></script>

</body>
</html>
