        return {
            players: players, index: index, n: n, P: P,
            total: total, warnings: warnings,
            withdrawnOf: withdrawn,
            lastRound: rounds.length ? rounds[rounds.length - 1].r : 0
        };
    }

    /* 算别人对手分时，这个人算几分（FIDE 调整后的虚拟分）：
     *   积分 + 0.5×(弃权次数 + 退赛轮数) − 0.5×(轮空次数 + 对手弃权次数)
     * 弃权、对手弃权都由「未弈」勾选 + 本轮得分判出来：得 0 是自己弃权，得 1 是对手弃权。
     * 一句话：没下成的局一律按和棋 0.5 分算；轮空、对手弃权白捡的一分要减回去。
     * 整场退赛的人对别人一律按虚拟分 0 计（vsOf 里直接返回 0）。 */
    function vsOf(b, i) {
        var P = b.P[i], pid = b.players[i].id;
        var wd = (b.withdrawnOf ? b.withdrawnOf[pid] : null);
        if (wd != null && P.wd > 0) { return 0; }
        return P.pts + 0.5 * (P.ff + P.wd) - 0.5 * (P.byes + P.oppFF);
    }

    function slotValueOf(b, s, vs) {
        if (s.t === 'bye') { return CFG.byeBuch === 'zero' ? 0 : b.total * 0.5; }
        if (s.t === 'opp') { return s.i >= 0 ? vs[s.i] : 0; }
        return 0;
    }

    function scoreSet(b, i, vs) {
        var vals = b.P[i].slots.map(function (s) { return slotValueOf(b, s, vs); });
        return vals;
    }

    function tbFromVals(vals) {
        var sum = 0, i;
        for (i = 0; i < vals.length; i++) { sum += vals[i]; }
        var sorted = vals.slice().sort(function (a, b) { return a - b; });
        var len = sorted.length;
        var cut1 = len >= 1 ? sum - sorted[0] : sum;
        var cut2 = len >= 2 ? sum - sorted[0] - sorted[1] : cut1;
        var med;
        if (len > 2) {
            med = sum - sorted[0] - sorted[len - 1];
            if (CFG.medianMode === 'high') { med = sum - sorted[len - 1]; }
        } else {
            med = sum;
        }
        return { buch: sum, med: med, cut1: cut1, cut2: cut2, vals: vals };
    }

    /* 完整成绩表 */
    function standings(state, opt) {
        opt = opt || {};
        var b = build(state, opt);
        var n = b.n, P = b.P;
        var vs = [], i;
        for (i = 0; i < n; i++) { vs.push(vsOf(b, i)); }

        var rows = [];
        for (i = 0; i < n; i++) {
            var tb = tbFromVals(scoreSet(b, i, vs));
            var wins = P[i].wins
                + (CFG.byeAsWin ? P[i].byes : 0)
                + (CFG.ffWinAsWin ? P[i].oppFF : 0);
            rows.push({
                i: i,
                id: b.players[i].id,
                name: b.players[i].name,
                unit: b.players[i].unit || '',
                pts: P[i].pts,
                buch: tb.buch,
                med: tb.med,
                cut1: tb.cut1,
                cut2: tb.cut2,
                wins: wins,
                byes: P[i].byes,
                ff: P[i].ff,
                wd: P[i].wd,
                vs: vs[i],
                log: P[i].log
            });
        }

        var keys = tbKeys(state);

        function cmp(a, c) {
            if (a.pts !== c.pts) { return c.pts - a.pts; }
            for (var q = 0; q < keys.length; q++) {
                var k = keys[q];
                if (Math.abs(c[k] - a[k]) > 1e-9) { return c[k] - a[k]; }
            }
            return a.id - c.id;
        }

        rows.sort(cmp);

        /* 先找并列组，组内所有人同分同名次 */
        function sameRow(a, b) {
            if (a.pts !== b.pts) { return false; }
            for (var q = 0; q < keys.length; q++) {
                if (Math.abs(a[keys[q]] - b[keys[q]]) > 1e-9) { return false; }
            }
            return true;
        }
        var g = 0;
        while (g < rows.length) {
            var end = g + 1;
            while (end < rows.length && sameRow(rows[g], rows[end])) { end++; }
            for (var m2 = g; m2 < end; m2++) {
                rows[m2].rank = g + 1;
                rows[m2].tie = (end - g) > 1;
            }
            g = end;
        }

        return {
            rows: rows, b: b, n: n, index: b.index,
            acc: P, players: b.players, keys: keys,
            warnings: b.warnings,
            lastRound: b.lastRound
        };
    }

    /* ---------------- 末轮求解 ---------------- */

    var CODES = ['1-0', '1/2', '0-1'];

    /* 条件里一场对局的结果，永远相对「台次里排前面的那个人」：
     *   0 = 前者胜  1 = 平  2 = 前者负
     * 两选一记成 3/4/5，分别是 不负 / 不平 / 不胜。 */
    var MASK_SETS = { 3: [0, 1], 4: [0, 2], 5: [1, 2] };
    var MASK_OF = { '0,1': 3, '0,2': 4, '1,2': 5 };

    function solve(state, targetId, targetRank, opt) {
        opt = opt || {};
        var MAXG = opt.maxGames || 10;
        var total = Math.max(1, Number(state.totalRounds) || 9);
        var base = standings(state, { upto: total - 1 });
        var n = base.n, index = base.index;
        var t = index[targetId];
        if (t === undefined) { return { error: '名单里没有这个选手' }; }

        var wdMap = state.withdrawn || (base.b && base.b.withdrawnOf) || {};
        if (wdMap[targetId] != null && Number(wdMap[targetId]) <= total) {
            return { error: '这个人在第 ' + wdMap[targetId] + ' 轮已退赛，没有末轮' };
        }

        var last = null;
        (state.rounds || []).forEach(function (rd) { if (rd.r === total) { last = rd; } });
        if (!last) { return { error: '缺第 ' + total + ' 轮的对阵' }; }
        if (!inTable(last, targetId)) {
            return { error: '这个人没出现在第 ' + total + ' 轮的对阵表上，按退赛算，没有末轮' };
        }

        var opps = last.opps || {};
        var keys = base.keys;
        var rowsByI = [];
        base.rows.forEach(function (r) { rowsByI[r.i] = r; });

        var bp = [], bb = [], bvs = [];
        for (var i = 0; i < n; i++) {
            bp[i] = base.acc[i].pts;
            bb[i] = rowsByI[i].buch;
            bvs[i] = rowsByI[i].vs;
        }

        /* 末轮前退赛的人：别人算对手分时按虚拟分 0 计（槽位仍在） */
        for (i = 0; i < n; i++) {
            var wid = base.players[i].id;
            if (wdMap[wid] != null && Number(wdMap[wid]) <= total) { bvs[i] = 0; }
        }

        var lastOpp = [], lastKind = [], paired = {};
        for (i = 0; i < n; i++) { lastOpp[i] = -1; lastKind[i] = 'none'; }

        /* 末轮已标未弈 / 已经退赛的人：这一局不会下，不进枚举 */
        var lastFF = {};
        (last.ff || []).forEach(function (id) { lastFF[id] = 1; });
        if (lastFF[targetId]) {
            return { error: '这个人在第 ' + total + ' 轮标了未弈，这一局不会下，没有可推算的结果' };
        }
        function outOfLast(i2) {
            var pid = base.players[i2].id;
            if (lastFF[pid]) { return true; }
            return wdMap[pid] != null && Number(wdMap[pid]) <= total;
        }

        var games = [];
        for (i = 0; i < n; i++) {
            if (outOfLast(i)) { continue; }
            var o = opps[base.players[i].id];
            if (o === 'bye') { lastKind[i] = 'bye'; continue; }
            var oid = num(o);
            if (oid == null || paired[i]) { continue; }
            var j = index[oid];
            if (j == null || j === i || paired[j] || outOfLast(j)) { continue; }
            paired[i] = paired[j] = true;
            lastOpp[i] = j; lastOpp[j] = i;
            lastKind[i] = 'opp'; lastKind[j] = 'opp';
            games.push({ a: i, b: j });
        }

        var facedBy = [];
        for (i = 0; i < n; i++) { facedBy.push([]); }
        for (i = 0; i < n; i++) {
            base.b.P[i].slots.forEach(function (s) {
                if (s.t === 'opp' && s.i >= 0) { facedBy[s.i].push(i); }
            });
        }

        var pT0 = bp[t] + (lastKind[t] === 'bye' ? CFG.byePoint : 0);
        var pool = [], inPool = {};
        for (i = 0; i < n; i++) {
            if (i !== t && bp[i] + 1 >= pT0) { pool.push(i); inPool[i] = 1; }
        }
        inPool[t] = 1;

        /* ---------------- 台次顺序 ----------------
         * 末轮的台次按「上轮积分」排：先比这一桌两人里积分高的那一分（高的在前），
         * 一样再比低的那一分；两桌完全同分时比编号——积分高的那个人编号小者在前，
         * 两人同分则编号小者在前（也就是每一桌里排在前面的那个人编号小者优先）。 */
        function leadOf(i2, j2) {
            if (bp[i2] !== bp[j2]) { return bp[i2] > bp[j2] ? i2 : j2; }
            return base.players[i2].id <= base.players[j2].id ? i2 : j2;
        }
        function otherOf(i2, j2) { return leadOf(i2, j2) === i2 ? j2 : i2; }

        /* 一桌对局的排法：高积分降序 → 低积分降序 → 领先者编号升序 → 另一人编号升序 */
        function boardCmp(x, y) {
            var lx = leadOf(x.a, x.b), ox = otherOf(x.a, x.b);
            var ly = leadOf(y.a, y.b), oy = otherOf(y.a, y.b);
            if (bp[lx] !== bp[ly]) { return bp[ly] - bp[lx]; }
            if (bp[ox] !== bp[oy]) { return bp[oy] - bp[ox]; }
            if (base.players[lx].id !== base.players[ly].id) {
                return base.players[lx].id - base.players[ly].id;
            }
            return base.players[ox].id - base.players[oy].id;
        }

        /* 只枚举「有关对局」（与 pool 相关、可能影响名次的对局）以控制规模；
         * 无关对局不影响名次，不枚举、不补全计数。
         * 枚举顺序就是台次顺序，后面所有「按台次排」都直接拿枚举下标当台次号用。 */
        var rel = games.filter(function (g) { return inPool[g.a] || inPool[g.b]; });
        rel.sort(boardCmp);
        var enumGames = rel.slice(0, MAXG);
        var m = enumGames.length;

        var d = [], accd = [], dw = [];
        for (i = 0; i < n; i++) { d[i] = 0; accd[i] = 0; dw[i] = 0; }
        for (i = 0; i < n; i++) {
            if (lastKind[i] === 'bye') {
                d[i] += CFG.byePoint;
                /* 轮空的人虚拟分净增 +0.5（得 1 分 − 0.5 轮空），广播给之前把他当对手的人 */
                var fby = facedBy[i];
                for (var kk = 0; kk < fby.length; kk++) { accd[fby[kk]] += 0.5; }
            }
        }

        function vsNow(x) { return bvs[x] + d[x] - (lastKind[x] === 'bye' ? 0.5 : 0); }

        function slotValue(i2) {
            if (lastKind[i2] === 'bye') { return total * 0.5; }
            return lastOpp[i2] >= 0 ? vsNow(lastOpp[i2]) : 0;
        }

        function deltaOf(code) {
            if (code === '1-0') { return [1, 0, 1, 0]; }
            if (code === '0-1') { return [0, 1, 0, 1]; }
            return [0.5, 0.5, 0, 0];
        }

        function applyGame(g, code, sign) {
            var dd = deltaOf(code);
            var da = dd[0] * sign, db = dd[1] * sign;
            d[g.a] += da; d[g.b] += db;
            dw[g.a] += dd[2] * sign; dw[g.b] += dd[3] * sign;
            var la = facedBy[g.a], lb = facedBy[g.b], k;
            for (k = 0; k < la.length; k++) { accd[la[k]] += da; }
            for (k = 0; k < lb.length; k++) { accd[lb[k]] += db; }
            tbCache = {};
        }

        function ptsOf(x) { return bp[x] + d[x]; }
        function buchOf(x) { return bb[x] + accd[x] + slotValue(x); }
        function winsOf(x) { return rowsByI[x].wins + dw[x]; }

        function valsOf(x) {
            var arr = [];
            base.b.P[x].slots.forEach(function (s) {
                if (s.t === 'opp') { arr.push(s.i >= 0 ? vsNow(s.i) : 0); }
                else if (s.t === 'bye') { arr.push(CFG.byeBuch === 'zero' ? 0 : total * 0.5); }
                else { arr.push(0); }
            });
            if (lastKind[x] === 'opp' || lastKind[x] === 'bye') { arr.push(slotValue(x)); }
            return arr;
        }

        var tbCache = {};
        function tbVal(x, key) {
            var cacheKey = x + '|' + key;
            var hit = tbCache[cacheKey];
            if (hit !== undefined) { return hit; }
            var v = tbFromVals(valsOf(x))[key];
            tbCache[cacheKey] = v;
            return v;
        }

        function better(x, pT, bT, wT) {
            var px = ptsOf(x);
            if (Math.abs(px - pT) > 1e-9) { return px > pT ? 1 : -1; }
            for (var q = 0; q < keys.length; q++) {
                var k = keys[q], a, b;
                if (k === 'buch') { a = buchOf(x); b = bT; }
                else if (k === 'wins') { a = winsOf(x); b = wT; }
                else { a = tbVal(x, k); b = tbVal(t, k); }
                if (Math.abs(a - b) > 1e-9) { return a > b ? 1 : -1; }
            }
            return 0;
        }

        function evaluate() {
            var pT = ptsOf(t), bT = buchOf(t), wT = winsOf(t);
            var betterCnt = 0, ties = 0;
            for (var k = 0; k < pool.length; k++) {
                var x = pool[k];
                if (ptsOf(x) < pT - 1e-9) { continue; }
                var r = better(x, pT, bT, wT);
                if (r > 0) { betterCnt++; }
                else if (r === 0) { ties++; }
            }
            /* 破同分完全一样就得加赛：最差名次要把这批并列的人全算在自己前面 */
            return { rank: betterCnt + 1, ties: ties, worst: betterCnt + ties + 1 };
        }

        var pow3 = [1];
        for (i = 1; i <= m; i++) { pow3[i] = pow3[i - 1] * 3; }

        /* freeSet：不加赛也稳进前 N；playSet：加赛赢下来才进；tieSet：进前 N 但与他人完全并列需加赛 */
        var freeSet = {}, playSet = {}, tieSet = {}, freeCount = 0, playCount = 0, totalCount = 0;
        var cur = new Array(m);

        function rec(k) {
            if (k === m) {
                var key = 0;
                for (var q = 0; q < m; q++) { key += cur[q] * pow3[q]; }
                var r = evaluate();
                totalCount++;
                if (r.rank <= targetRank) {
                    playSet[key] = 1;
                    playCount++;
                    if (r.worst <= targetRank) { freeSet[key] = 1; freeCount++; }
                    else { tieSet[key] = 1; }   /* 进前 N 但完全并列，得加赛 */
                }
                return;
            }
            for (var c = 0; c < 3; c++) {
                applyGame(enumGames[k], CODES[c], 1);
                cur[k] = c;
                rec(k + 1);
                applyGame(enumGames[k], CODES[c], -1);
            }
        }
        rec(0);

        var always = freeCount === totalCount && totalCount > 0;

        var gt = -1;
        for (i = 0; i < m; i++) {
            if (enumGames[i].a === t || enumGames[i].b === t) { gt = i; }
        }

        function keyToPattern(key) {
            var p = [];
            for (var q = 0; q < m; q++) { p.push(Math.floor(key / pow3[q]) % 3); }
            return p;
        }

        function countLiterals(p) {
            var c = 0;
            for (var q = 0; q < m; q++) { if (p[q] >= 0 && q !== gt) { c++; } }
            return c;
        }

        /* 某个局部条件下，所有补全是否都落在 set 里 */
        function allIn(set, pattern, holes) {
            var cnt = pow3[holes.length];
            if (cnt > 200000) { return false; }
            for (var z = 0; z < cnt; z++) {
                var zz = z, key = 0, hi = 0;
                for (var q = 0; q < m; q++) {
                    var v = pattern[q];
                    if (v < 0) {
                        v = Math.floor(zz / pow3[hi]) % 3;
                        hi++;
                    }
                    key += v * pow3[q];
                }
                if (!set[key]) { return false; }
            }
            return true;
        }

        /* 一场对局写出来是「台次里排前面的人 结果 另一个人」：
         * 双方积分不同时，积分高的排前面；双方同分时，编号小的排前面。 */
        function partOf(q, allow) {
            var g = enumGames[q];
            var lead = leadOf(g.a, g.b);
            var flip = lead !== g.a;
            return {
                gi: q,
                a: base.players[lead].id,
                b: base.players[flip ? g.a : g.b].id,
                allow: allow.slice(),   /* 0 = 前者胜 1 = 平 2 = 前者负，两个就是不负/不平/不胜 */
                flip: flip
            };
        }

        function allowOfV(v) {
            if (v < 0) { return [0, 1, 2]; }
            return MASK_SETS[v] || [v];
        }

        /* ---------------- 条件树 ----------------
         * 四条规则：
         * 1) 一场对局无论胜/平/负结果都一样 → 这场不进条件，直接越过；
         * 2) 胜/平/负里有「后续完全一样」的分支 → 合并成 不负 / 不平 / 不胜；
         * 3) 后续不一样的必须留着，不能硬并；
         * 4) 一层一层往下走，每层都把「所有分支上取值都相同」的台次提成本层前提，
         *    所以前提下面还可以再有小前提，一直重复到没法再并。
         *
         * 结点：{ premise: [part], leaf: bool, tie: bool, items: [{ part, node }] }
         *   premise 是本层的共同前提（AND），items 是「满足任一」（OR），
         *   node 是这一条分支下面的子条件；leaf 表示到这里就满足。
         */
        function sameKeys(a, b) {
            if (a.length !== b.length) { return false; }
            for (var z = 0; z < a.length; z++) { if (a[z] !== b[z]) { return false; } }
            return true;
        }

        /* 一批组合是不是同一种结果：0 全稳进、1 全需加赛、-1 混着 */
        function sameKind(kinds) {
            var k0 = kinds[0], u;
            for (u = 1; u < kinds.length; u++) {
                if (kinds[u] !== k0) { return -1; }
            }
            return k0;
        }

        /* keys2 是（去掉已处理台次后的）组合键，kinds 是与之对应的 0 稳进 / 1 需加赛 */
        function buildTree(keys2, kinds, rest) {
            if (!keys2.length) { return null; }
            /* 剩下的台次怎么下都满足，而且结果一致 → 到此为止 */
            if (keys2.length === pow3[rest.length]) {
                var sd = sameKind(kinds);
                if (sd >= 0) { return { premise: [], leaf: true, tie: sd === 1, items: [] }; }
            }

            /* 本层前提：所有分支上都取了同一个值的台次 */
            var premise = [], free = [], z, u, g, v0, same;
            for (z = 0; z < rest.length; z++) {
                g = rest[z];
                v0 = Math.floor(keys2[0] / pow3[g]) % 3;
                same = true;
                for (u = 1; u < keys2.length; u++) {
                    if (Math.floor(keys2[u] / pow3[g]) % 3 !== v0) { same = false; break; }
                }
                if (same) { premise.push(partOf(g, [v0])); } else { free.push(g); }
            }
            if (!free.length) {
                return { premise: premise, leaf: true, tie: sameKind(kinds) === 1, items: [] };
            }

            var g0 = free[0], restN = free.slice(1);
            /* 抹掉这一场那一位，只留下「后续」用来比较是否相同；kind 跟着一起搬 */
            var bags = [[], [], []], kbags = [[], [], []];
            for (z = 0; z < keys2.length; z++) {
                var vv = Math.floor(keys2[z] / pow3[g0]) % 3;
                bags[vv].push(keys2[z] - vv * pow3[g0]);
                kbags[vv].push(kinds[z]);
            }

            /* 规则 2：后续完全一样的几种结果并成一条（胜+平＝不负，胜+负＝不平，平+负＝不胜）。
             * 「一样」既要比后续的对局组合，也要比每一组是稳进还是要加赛，
             * 结果不同的两条不能并。 */
            var grp = [];
            for (var v = 0; v < 3; v++) {
                if (!bags[v].length) { continue; }
                var hit = null;
                for (u = 0; u < grp.length; u++) {
                    if (sameKeys(grp[u].keys, bags[v]) && sameKeys(grp[u].kinds, kbags[v])) {
                        hit = grp[u]; break;
                    }
                }
                if (hit) { hit.allow.push(v); }
                else { grp.push({ keys: bags[v], kinds: kbags[v].slice(), allow: [v] }); }
            }

            /* 规则 1：三种结果后续全一样 → 这场无关，越过它接着看下一场 */
            if (grp.length === 1 && grp[0].allow.length === 3) {
                var child = buildTree(grp[0].keys, grp[0].kinds, restN);
                return {
                    premise: premise.concat(child.premise),
                    leaf: child.leaf, tie: child.tie, items: child.items
                };
            }

            return {
                premise: premise,
                leaf: false,
                tie: false,
                items: grp.map(function (o) {
                    return { part: partOf(g0, o.allow), node: buildTree(o.keys, o.kinds, restN) };
                })
            };
        }

        /* 这棵树里「稳进」和「需加赛」的叶子各有几个 */
        function countKind(node) {
            if (!node) { return { free: 0, tie: 0 }; }
            if (node.leaf) { return node.tie ? { free: 0, tie: 1 } : { free: 1, tie: 0 }; }
            var s = { free: 0, tie: 0 };
            node.items.forEach(function (it) {
                var c = countKind(it.node);
                s.free += c.free; s.tie += c.tie;
            });
            return s;
        }

        /* 摊平成编号表：每个分支给一个号，点开细分时按号找回这一路锁死的对局 */
        function flattenTree(node, pat, out) {
            var p = pat.slice();
            (node.premise || []).forEach(function (x) {
                p[x.gi] = x.allow.length === 1 ? x.allow[0] : MASK_OF[x.allow.join(',')];
            });
            if (node.leaf) { return; }
            node.items.forEach(function (it) {
                var p2 = p.slice();
                p2[it.part.gi] = it.part.allow.length === 1
                    ? it.part.allow[0] : MASK_OF[it.part.allow.join(',')];
                it.idx = out.length;
                it.pat = p2.slice();
                out.push(it);
                flattenTree(it.node, p2, out);
            });
        }

        var groups = [];
        /* 自身结果分支：普通选手末轮有胜/平/负三段；轮空选手（gt<0）没有自身结果，
         * 只考虑其他对局，整体归为一段（tOutcome='bye'）。 */
        var outcomeVs = gt >= 0 ? [0, 1, 2] : [null];
        if (!always && playCount > 0) {
            /* 其他台次，按台次顺序（枚举下标就是台次号） */
            var restGames = [];
            for (var rg = 0; rg < m; rg++) { if (rg !== gt) { restGames.push(rg); } }

            function keysOf(set, v) {
                var ks = [];
                Object.keys(set).forEach(function (k) {
                    var kn = Number(k);
                    if (gt >= 0 && Math.floor(kn / pow3[gt]) % 3 !== v) { return; }
                    ks.push(kn);
                });
                ks.sort(function (a, b) { return a - b; });
                return ks;
            }

            function basePat(v) {
                var p = [];
                for (var q = 0; q < m; q++) { p[q] = -1; }
                if (gt >= 0) { p[gt] = v; }   /* 自己那场不在文字里出现，但展开细分时要锁死 */
                return p;
            }

            outcomeVs.forEach(function (v) {
                var ksFree = keysOf(freeSet, v);   /* 稳进前 N */
                var ksTie = keysOf(tieSet, v);     /* 进前 N 但要加赛 */
                if (!ksFree.length && !ksTie.length) { return; }

                /* 稳进和加赛一起分类：同一棵树里分到最后，叶子再标是稳进还是加赛 */
                var ksAll = [], kinds = [];
                ksFree.forEach(function (k) { ksAll.push(k); kinds.push(0); });
                ksTie.forEach(function (k) { ksAll.push(k); kinds.push(1); });
                /* 键和 kind 一起按 key 排，保证一一对应 */
                var pairUp = ksAll.map(function (k, ix) { return { k: k, d: kinds[ix] }; });
                pairUp.sort(function (a, b) { return a.k - b.k; });
                ksAll = pairUp.map(function (o) { return o.k; });
                kinds = pairUp.map(function (o) { return o.d; });

                var tree = buildTree(ksAll, kinds, restGames);
                var flat = [];
                if (tree) { flattenTree(tree, basePat(v), flat); }
                var ck = countKind(tree);

                var code = gt >= 0 ? CODES[v] : null;
                var tOutcome = gt >= 0
                    ? (code === '1/2' ? 'draw'
                        : (code === '1-0' ? (enumGames[gt].a === t ? 'win' : 'loss')
                            : (enumGames[gt].b === t ? 'win' : 'loss')))
                    : 'bye';

                groups.push({
                    res: code,
                    tOutcome: tOutcome,
                    tree: tree,
                    freeCount: ck.free,
                    tieCount: ck.tie,
                    flat: flat          /* 编号表：点开细分时按号取 pat */
                });
            });

            var order = { win: 0, draw: 1, loss: 2, bye: 3 };
            groups.sort(function (x, y) { return order[x.tOutcome] - order[y.tOutcome]; });
        }

        var rankNow = 0;
        for (i = 0; i < base.rows.length; i++) {
            if (base.rows[i].i === t) { rankNow = base.rows[i].rank; }
        }

        /* ---------------- 展开某一条情形 ----------------
         * 一条条件只锁了几场对局，剩下的关键对局随便怎么下都算数。
         * 点开时把这些没锁的对局全部枚举一遍，每一种细分都留一条摘要（名次、最差名次），
         * 按「从险到不险」排好；某一细分要看的积分、破同分对比，等翻到那一页再算。
         */

        function tbOf(x) {
            var o = {};
            for (var q = 0; q < keys.length; q++) {
                var k = keys[q];
                o[k] = k === 'buch' ? buchOf(x) : (k === 'wins' ? winsOf(x) : tbVal(x, k));
            }
            return o;
        }

        function explainOne(key, holes) {
            var p = keyToPattern(key), q;
            for (q = 0; q < m; q++) { applyGame(enumGames[q], CODES[p[q]], 1); }

            var pT = ptsOf(t);

            /* 名次表显示全部选手（都显示），名次按「积分 → 破同分项」两两比，
             * 跟主流程 evaluate 口径一致。 */
            var rows = [];
            for (q = 0; q < n; q++) {
                rows.push({
                    i: q,
                    id: base.players[q].id,
                    name: base.players[q].name,
                    pts: ptsOf(q),
                    tb: tbOf(q),
                    me: q === t
                });
            }

            function cmp2(A, B) {
                if (Math.abs(A.pts - B.pts) > 1e-9) { return A.pts > B.pts ? 1 : -1; }
                for (var z = 0; z < keys.length; z++) {
                    var k = keys[z];
                    if (Math.abs(A.tb[k] - B.tb[k]) > 1e-9) { return A.tb[k] > B.tb[k] ? 1 : -1; }
                }
                return 0;
            }

            rows.forEach(function (a) {
                var up = 0;
                /* 名次 = 1 + 比自己强的人数 */
                rows.forEach(function (b) { if (b !== a && cmp2(b, a) > 0) { up++; } });
                a.rank = up + 1;
            });
            rows.sort(function (x, y) {
                if (x.rank !== y.rank) { return x.rank - y.rank; }
                if (!!x.me !== !!y.me) { return x.me ? -1 : 1; }
                return x.id - y.id;
            });

            var me = null, ties = 0;
            rows.forEach(function (r) { if (r.me) { me = r; } });
            rows.forEach(function (r) { if (r !== me && cmp2(r, me) === 0) { ties++; } });

            var games = [];
            for (q = 0; q < m; q++) {
                if (q === gt || p[q] < 0) { continue; }
                if (holes && holes.indexOf(q) < 0) { continue; }
                var pv = partOf(q, [p[q]]);
                games.push({ gi: q, a: pv.a, b: pv.b, allow: pv.allow });
            }
            /* 台次顺序：枚举下标就是台次号，小的在前 */
            games.sort(function (x, y) { return x.gi - y.gi; });

            for (q = 0; q < m; q++) { applyGame(enumGames[q], CODES[p[q]], -1); }

            return {
                pts: pT, rank: me.rank, worst: me.rank + ties, ties: ties,
                me: me, rows: rows, games: games
            };
        }

        function explore(pattern) {
            /* 没锁（-1）和「两选一」（3/4/5）的对局都要继续枚举 */
            var holes = [], q;
            for (q = 0; q < m; q++) { if (pattern[q] < 0 || pattern[q] >= 3) { holes.push(q); } }

            /* 未锁对局按台次排好，供「字典序」和顶部选择器共用（枚举下标就是台次号） */
            var holeOrder = holes.slice().sort(function (a, b) { return a - b; });

            var totalCnt = 1;
            holes.forEach(function (idx) { totalCnt *= allowOfV(pattern[idx]).length; });

            var st = {
                pts: 0,
                total: totalCnt,
                keys: keys.slice(),
                holes: holeOrder.map(function (idx) {
                    var pv = partOf(idx, allowOfV(pattern[idx]));
                    return { gi: idx, a: pv.a, b: pv.b, allow: pv.allow, flip: pv.flip };
                }),
                subs: [],
                ranks: []
            };

            var wp = pattern.slice();
            for (q = 0; q < m; q++) {
                if (pattern[q] >= 0 && pattern[q] < 3) {
                    applyGame(enumGames[q], CODES[pattern[q]], 1);
                }
            }

            function tally() {
                var key = 0, z;
                for (z = 0; z < m; z++) { key += wp[z] * pow3[z]; }
                var ev = evaluate();
                /* 字典序键：未锁对局按台次排，每场取 胜0/平1/负2 拼成序列 */
                var lex = '';
                for (z = 0; z < holeOrder.length; z++) { lex += String(wp[holeOrder[z]]); }
                st.subs.push({ key: key, rank: ev.rank, worst: ev.worst, ties: ev.ties, lex: lex });
                st.pts = ptsOf(t);
            }

            function walk(h) {
                if (h === holes.length) { tally(); return; }
                var gi = enumGames[holes[h]];
                var opts = allowOfV(pattern[holes[h]]);
                for (var z = 0; z < opts.length; z++) {
                    var cc = opts[z];
                    applyGame(gi, CODES[cc], 1);
                    wp[holes[h]] = cc;
                    walk(h + 1);
                    applyGame(gi, CODES[cc], -1);
                }
            }
            walk(0);

            for (q = 0; q < m; q++) {
                if (pattern[q] >= 0 && pattern[q] < 3) {
                    applyGame(enumGames[q], CODES[pattern[q]], -1);
                }
            }

            /* 可达名次段（第 N 名 / 第 N-M 名，M>N 表示这一档要加赛），给上方的标签用 */
            var seen = {};
            st.subs.forEach(function (s) {
                var id = s.rank + '-' + s.worst;
                if (!seen[id]) {
                    seen[id] = { id: id, from: s.rank, to: s.worst, count: 0 };
                    st.ranks.push(seen[id]);
                }
                seen[id].count++;
            });
            st.ranks.sort(function (x, y) {
                if (x.from !== y.from) { return x.from - y.from; }
                return x.to - y.to;
            });

            st.needPlay = st.subs.filter(function (s) { return s.worst > targetRank; }).length;

            /* 细分按字典序排：未锁对局按台次，每场胜0/平1/负2，序列小者在前 */
            st.subs.sort(function (x, y) {
                if (x.lex !== y.lex) { return x.lex < y.lex ? -1 : 1; }
                return x.key - y.key;
            });

            st.detailOf = function (key) { return explainOne(key, holes); };
            return st;
        }

        return {
            target: { id: base.players[t].id, name: base.players[t].name, pts: bp[t], rank: rankNow },
            totalRounds: total,
            keys: keys,
            games: m,
            m: m,               /* 枚举的对局数（调试/校验用） */
            gt: gt,             /* 目标本人那一场在枚举里的下标，-1 表示轮空 */
            counts: { all: totalCount, ok: playCount, free: freeCount },
            always: always,
            alwaysPlayoff: !always && totalCount > 0 && playCount === totalCount,
            never: playCount === 0,
            groups: groups,
            explore: explore
        };
    }

    /* ---------------- 文本解析 ---------------- */

    var UNIT_HINTS = ['组', '队', '学校', '小学', '中学', '大学', '学院', '棋院', '俱乐部', '中心', '协会', '公司', '单位', '班'];

    function looksUnit(s) {
        return UNIT_HINTS.some(function (w) { return s.indexOf(w) >= 0; });
    }

    /*
     * 一行一人：编号 姓名 单位 上轮积分 对手编号
     * 姓名从第二轮起可省，单位可省，对手编号也可省；轮空写 bye。
     * 末尾连续的数字里，最后一个当对手编号，倒数第二个当上轮积分。
     */
    function parseLine(line, ids) {
        var s = String(line || '').replace(/[|｜]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!s) { return null; }

        var m = s.match(/^(\d{1,4})[.、)．]?\s*(.*)$/);
        if (!m) { return null; }
        var id = Number(m[1]);
        var rest = (m[2] || '').trim();
        if (!rest) { return { id: id, name: '', unit: '', pre: null, opp: null }; }

        var tokens = rest.split(' ');
        var nums = [], bye = false;
        while (tokens.length) {
            var last = tokens[tokens.length - 1];
            if (/^\d+(?:\.\d+)?$/.test(last)) { nums.unshift(Number(tokens.pop())); }
            else if (/^(bye|轮空)$/i.test(last)) { bye = true; tokens.pop(); }
            else { break; }
        }

        var pre = null, opp = null;
        if (bye) {
            opp = 'bye';
            if (nums.length) { pre = nums[nums.length - 1]; }
        } else if (nums.length >= 2) {
            pre = nums[nums.length - 2];
            opp = nums[nums.length - 1];
        } else if (nums.length === 1) {
            pre = nums[0];
        }

        /* 名单已知时，认不出的对手编号宁可留空 */
        if (opp != null && opp !== 'bye' && ids && Object.keys(ids).length && ids[opp] == null) {
            opp = null;
        }

        var text = tokens.join(' ');
        var name = '', unit = '';
        var latin = text.match(/[A-Za-z][A-Za-z.\-']*/g) || [];
        var cjk = text.match(/[\u4e00-\u9fa5·]{2,}/g) || [];

        if (cjk.length) {
            var unitParts = cjk.filter(looksUnit);
            if (unitParts.length) {
                unit = unitParts[unitParts.length - 1];
                name = cjk.filter(function (x) { return x !== unit; })[0] || '';
            } else {
                name = cjk[0];
                unit = cjk.slice(1).join('');
            }
        }
        if (latin.length && !name) { name = latin.join(' '); }

        return { id: id, name: name, unit: unit, pre: pre, opp: opp };
    }

    function parseText(text, knownPlayers) {
        var ids = {};
        (knownPlayers || []).forEach(function (p) { ids[p.id] = p; });
        var out = [], bad = [];
        String(text || '').split(/\r?\n/).forEach(function (line) {
            if (!line.trim()) { return; }
            var r = parseLine(line, ids);
            if (r) { out.push(r); } else { bad.push(line); }
        });
        return { rows: out, bad: bad };
    }

    return {
        CFG: CFG,
        TB_DEFS: TB_DEFS,
        DEFAULT_TIEBREAK: DEFAULT_TIEBREAK,
        detectWithdrawn: detectWithdrawn,
        tbKeys: tbKeys,
        normalizeTiebreaks: normalizeTiebreaks,
        build: build,
        standings: standings,
        solve: solve,
        parseText: parseText,
        parseLine: parseLine
    };
}));

</script>

<script>
(function () {
    'use strict';

    var ML = window.ML;
    var LS_KEY = 'molun_state_v2';

    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    function fmt(v) {
        if (v == null || v === '') { return ''; }
        var n = Math.round(Number(v) * 2) / 2;
        if (!isFinite(n)) { return ''; }
        return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    /* ---------------- 状态 ---------------- */

    function blank() {
        return {
            totalRounds: 7,
            byePoint: 1,
            tiebreaks: ML.DEFAULT_TIEBREAK.slice(),
            players: [],
            rounds: []
        };
    }

    var state = load() || blank();
    var curRound = 1;

    function load() {
        try {
            var raw = localStorage.getItem(LS_KEY);
            if (!raw) { return null; }
            var s = JSON.parse(raw);
            if (!s || !Array.isArray(s.players)) { return null; }
            s.tiebreaks = ML.normalizeTiebreaks(s.tiebreaks);
            if (!s.tiebreaks.length) { s.tiebreaks = ML.DEFAULT_TIEBREAK.slice(); }
            delete s.withdrawn;    /* 退赛现在按对阵表自动识别，旧数据里的手工登记不再用 */
            delete s.wdOff;
            return s;
        } catch (e) { return null; }
    }

    var saveTimer = 0;
    function save() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        }, 220);
    }

    function roundOf(r, create) {
        var rd = null;
        state.rounds.forEach(function (x) { if (x.r === r) { rd = x; } });
        if (!rd && create) {
            rd = { r: r, pre: {}, opps: {}, ff: [] };
            state.rounds.push(rd);
        }
        return rd;
    }

    function nameOf(p) { return p && p.name ? p.name : ('#' + (p ? p.id : '')); }

    /* 第 r 轮开赛前的累计分；第 1 轮是 0，没有就是 null */
    function preOf(id, r) {
        if (r === 1) { return 0; }
        var rd = roundOf(r);
        if (!rd || !rd.pre) { return null; }
        var v = rd.pre[id];
        if (v == null || v === '') { return null; }
        var n = Number(v);
        return isFinite(n) ? n : null;
    }

    /* 第 r 轮的得分 = 第 r+1 轮的上轮积分 − 第 r 轮的上轮积分 */
    function scoreOf(id, r) {
        var a = preOf(id, r), b = preOf(id, r + 1);
        if (a == null || b == null) { return null; }
        return Math.round((b - a) * 2) / 2;
    }

    /* 这一轮是否录过东西：上轮积分、对手、未弈勾选任一有值就算录过 */
    function roundFilled(rd) {
        if (!rd) { return false; }
        return Object.keys(rd.pre || {}).length > 0 ||
               Object.keys(rd.opps || {}).length > 0 ||
               (rd.ff || []).length > 0;
    }

    function hasScores(r) {
        /* 整轮都清空了，就不能再拿相邻轮的积分差硬算成绩 */
        if (!roundFilled(roundOf(r))) { return false; }
        return state.players.some(function (p) { return scoreOf(p.id, r) != null; });
    }

    function lastPlayed() {
        var m = 0;
        for (var r = 1; r < state.totalRounds; r++) { if (hasScores(r)) { m = r; } }
        return m;
    }

    /* ---------------- 破同分排序 ---------------- */

    function renderTiebreak() {
        var host = $('#tb-list');
        var on = state.tiebreaks.slice();
        var off = ML.TB_DEFS.map(function (d) { return d.key; }).filter(function (k) { return on.indexOf(k) < 0; });

        host.innerHTML = on.map(function (k, idx) {
            var d = ML.TB_DEFS.filter(function (x) { return x.key === k; })[0];
            return '<li data-key="' + k + '" draggable="true" class="is-on">' +
                '<span class="ml-grip">⋮⋮</span>' +
                '<input type="checkbox" class="ml-check" checked data-toggle="' + k + '">' +
                '<span class="ml-tb-rank">' + (idx + 1) + '</span>' +
                '<span class="ml-tb-name">' + esc(d.name) + '</span>' +
                '<button class="ml-move" data-up="' + k + '"' + (idx === 0 ? ' disabled' : '') + ' title="上移">↑</button>' +
                '<button class="ml-move" data-down="' + k + '"' + (idx === on.length - 1 ? ' disabled' : '') + ' title="下移">↓</button>' +
                '</li>';
        }).join('') + off.map(function (k) {
            var d = ML.TB_DEFS.filter(function (x) { return x.key === k; })[0];
            return '<li data-key="' + k + '" class="is-off">' +
                '<span class="ml-grip">·</span>' +
                '<input type="checkbox" class="ml-check" data-toggle="' + k + '">' +
                '<span class="ml-tb-rank">—</span>' +
                '<span class="ml-tb-name">' + esc(d.name) + '</span>' +
                '</li>';
        }).join('');

        bindDrag(host);
    }

    var dragKey = null;

    function bindDrag(host) {
        $$('li', host).forEach(function (li) {
            li.addEventListener('dragstart', function (e) {
                if (!li.classList.contains('is-on')) { e.preventDefault(); return; }
                dragKey = li.dataset.key;
                li.classList.add('is-drag');
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', dragKey); } catch (err) {}
            });
            li.addEventListener('dragend', function () {
                li.classList.remove('is-drag');
                dragKey = null;
            });
            li.addEventListener('dragover', function (e) {
                if (!dragKey || !li.classList.contains('is-on')) { return; }
                e.preventDefault();
            });
            li.addEventListener('drop', function (e) {
                if (!dragKey) { return; }
                e.preventDefault();
                var to = li.dataset.key;
                if (to === dragKey) { return; }
                var arr = state.tiebreaks.slice();
                var from = arr.indexOf(dragKey);
                var dst = arr.indexOf(to);
                if (from < 0 || dst < 0) { return; }
                arr.splice(from, 1);
                arr.splice(dst, 0, dragKey);
                state.tiebreaks = arr;
                dragKey = null;
                save();
                renderTiebreak();
                refreshAll();
            });
        });
    }

    $('#tb-list').addEventListener('click', function (e) {
        var t = e.target;
        if (t.dataset.up) {
            var i = state.tiebreaks.indexOf(t.dataset.up);
            if (i > 0) {
                var a = state.tiebreaks.slice();
                a.splice(i - 1, 0, a.splice(i, 1)[0]);
                state.tiebreaks = a;
                save(); renderTiebreak(); refreshAll();
            }
        } else if (t.dataset.down) {
            var j = state.tiebreaks.indexOf(t.dataset.down);
            if (j >= 0 && j < state.tiebreaks.length - 1) {
                var b = state.tiebreaks.slice();
                b.splice(j + 1, 0, b.splice(j, 1)[0]);
                state.tiebreaks = b;
                save(); renderTiebreak(); refreshAll();
            }
        }
    });

    $('#tb-list').addEventListener('change', function (e) {
        var k = e.target.dataset.toggle;
        if (!k) { return; }
        var i = state.tiebreaks.indexOf(k);
        if (i >= 0) {
            state.tiebreaks.splice(i, 1);
        } else {
            state.tiebreaks.push(k);
        }
        if (!state.tiebreaks.length) {
            /* 全不选时留一个占位，避免排名退化成只看积分 */
            state.tiebreaks.push('buch');
        }
        save();
        renderTiebreak();
        refreshAll();
    });

    /* ---------------- 名单与轮数 ---------------- */

    function syncSetup() {
        var hint = $('#roster-hint');
        if (!state.players.length) {
            hint.textContent = '还没有名单，粘贴任意一轮的对阵表就会自动建出来。';
        } else {
            var units = {};
            state.players.forEach(function (p) { if (p.unit) { units[p.unit] = 1; } });
            hint.innerHTML = '共 <b>' + state.players.length + '</b> 人' +
                (Object.keys(units).length ? '，' + Object.keys(units).length + ' 个单位' : '') +
                '；已录 ' + lastPlayed() + ' 轮，总 ' + state.totalRounds + ' 轮。';
        }
        var rt = $('#round-total');
        if (rt) { rt.textContent = state.totalRounds; }
        var less = $('#btn-round-less');
        if (less) { less.disabled = state.totalRounds <= 2; }
    }

    function setTotalRounds(v) {
        v = Math.max(2, Math.min(30, v));
        state.totalRounds = v;
        if (curRound > v) { curRound = v; }
        save();
        renderTabs(); renderEntry(); syncSetup(); refreshAll();
    }

    $('#btn-round-more').addEventListener('click', function () {
        setTotalRounds(state.totalRounds + 1);
    });

    $('#btn-round-less').addEventListener('click', function () {
        var last = state.totalRounds;
        if (last <= 2) { return; }
        if (hasScores(last) && !confirm('第 ' + last + ' 轮已录成绩，减少一轮会丢掉这轮数据，继续？')) { return; }
        state.rounds = state.rounds.filter(function (rd) { return rd.r < last; });
        setTotalRounds(last - 1);
    });

    /* ---------------- 轮次页签 ---------------- */

    function renderTabs() {
        var host = $('#round-tabs');
        var html = '';
        for (var r = 1; r <= state.totalRounds; r++) {
            var on = r === curRound ? ' is-on' : '';
            var played = hasScores(r);
            html += '<button class="ml-tab' + on + '" data-round="' + r + '">第 ' + r + ' 轮' +
                (r === state.totalRounds ? '（末轮）' : '') +
                (played ? '<span class="ml-dot"></span>' : '') + '</button>';
        }
        host.innerHTML = html;
    }

    $('#round-tabs').addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('[data-round]') : null;
        if (!b) { return; }
        curRound = Number(b.dataset.round);
        renderTabs(); renderEntry();
    });

    /* ---------------- 录入表 ---------------- */

    function isLastRound() { return curRound === state.totalRounds; }

    function renderEntry() {
        var host = $('#entry-host');
        var hint = $('#entry-hint');
        hint.hidden = true;
        renderWd();

        if (!state.players.length) {
            host.innerHTML = '<div class="ml-empty">还没有名单。<br>点「粘贴本轮」贴入任意一轮对阵表，' +
                '名单会按编号自动建立。' +
                '<br><button class="ml-btn" data-act="paste">粘贴本轮</button></div>';
            bindEmpty();
            return;
        }

        var rd = roundOf(curRound, true);
        var players = state.players.slice().sort(function (a, b) { return a.id - b.id; });
        var recorded = roundFilled(rd);
        var rows = players.map(function (p) {
            var pre = preOf(p.id, curRound);
            var sc = recorded ? scoreOf(p.id, curRound) : null;
            var opp = rd.opps[p.id];
            var cls = '', label = '';
            if (sc != null) {
                if (sc === 1) { label = '1'; cls = 'is-win'; }
                else if (sc === 0.5) { label = '½'; cls = 'is-draw'; }
                else if (sc === 0) { label = '0'; }
                else { label = fmt(sc); cls = 'is-bad'; }
            }
            var fixed = curRound === 1;
            /* 第 1 轮开赛前人人 0 分，不用填也不用显示 0，留空即「无输入」 */
            var preCell = fixed || pre == null ? '' : fmt(pre);
            return '<tr data-id="' + p.id + '">' +
                '<td class="c-num">' + p.id + '</td>' +
                '<td>' + esc(nameOf(p)) + '</td>' +
                '<td class="c-num">' + esc(p.unit || '') + '</td>' +
                '<td><input class="ml-cell' + (fixed ? ' is-fixed' : '') + '" data-pre="' + p.id +
                    '" inputmode="decimal" value="' + esc(preCell) + '"' +
                    (fixed ? ' readonly tabindex="-1"' : '') + ' placeholder="—"></td>' +
                '<td><input class="ml-cell" data-opp="' + p.id + '" value="' +
                    esc(opp === 'bye' ? 'bye' : (opp == null ? '' : opp)) + '" placeholder="—"></td>' +
                '<td class="c-delta ' + cls + '" data-delta="' + p.id + '">' + label + '</td>' +
                '<td style="text-align:center"><input type="checkbox" class="ml-check" data-ff="' + p.id +
                    '"' + ((rd.ff || []).indexOf(p.id) >= 0 ? ' checked' : '') + '></td>' +
                '</tr>';
        }).join('');

        host.innerHTML = '<div class="ml-table-wrap"><table class="ml-table">' +
            '<thead><tr>' +
            '<th>编号</th><th>姓名</th><th>单位</th>' +
            '<th class="c-score">上轮积分</th><th>对手编号</th><th class="c-score">得分</th>' +
            '<th title="本轮没下就勾上：得 0 记自己弃权，得 1 记对手弃权（白捡一胜），得 ½ 按和棋算">未弈</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table></div>';

        updateEntryHint();
    }

    function updateEntryHint() {
        var hint = $('#entry-hint');
        var rd = roundOf(curRound);
        if (!rd) { hint.hidden = true; return; }
        var bad = 0;
        var recorded = roundFilled(rd);
        state.players.forEach(function (p) {
            var v = recorded ? scoreOf(p.id, curRound) : null;
            if (v == null) { return; }
            if (v !== 1 && v !== 0.5 && v !== 0) { bad++; }
        });

        if (!bad) { hint.hidden = true; return; }
        hint.innerHTML = '<b>' + bad + ' 人的分差不是 0、0.5 或 1，请核对上轮积分</b>';
        hint.hidden = false;
        hint.className = 'ml-hint is-warn';
    }

    var entryHost = $('#entry-host');

    entryHost.addEventListener('input', function (e) {
        var t = e.target;
        var rd = roundOf(curRound, true);

        if (t.dataset.pre !== undefined && t.dataset.pre !== '') {
            if (curRound === 1) { return; }
            var id = Number(t.dataset.pre);
            var raw = t.value.trim();
            if (raw === '') { delete rd.pre[id]; }
            else {
                var n = Number(raw);
                if (!isFinite(n)) { return; }
                rd.pre[id] = n;
            }
            updateDeltaCell(id);
            updateEntryHint();
            save();
            scheduleStand();
        } else if (t.dataset.opp !== undefined && t.dataset.opp !== '') {
            var oid = Number(t.dataset.opp);
            var ov = t.value.trim();
            if (ov === '') { delete rd.opps[oid]; }
            else if (/^(bye|轮空)$/i.test(ov)) { rd.opps[oid] = 'bye'; t.value = 'bye'; }
            else {
                var on = Number(ov);
                if (!isFinite(on)) { return; }
                rd.opps[oid] = on;
            }
            save();
            scheduleStand();
        }
    });

    entryHost.addEventListener('change', function (e) {
        var t = e.target;

        /* a 的对手是 b：b 那一行的对手编号自动补成 a，不必再输一遍 */
        if (t.dataset.opp !== undefined && t.dataset.opp !== '') {
            var a = Number(t.dataset.opp);
            var b = Number(t.value.trim());
            if (!isFinite(b) || a === b) { return; }
            if (!state.players.some(function (p) { return p.id === b; })) { return; }
            var rd = roundOf(curRound, true);
            if (Number(rd.opps[b]) === a) { return; }
            rd.opps[b] = a;
            var cell = entryHost.querySelector('[data-opp="' + b + '"]');
            if (cell) { cell.value = String(a); }
            save();
            scheduleStand();
            return;
        }

        if (t.dataset.ff !== undefined) {
            var rd2 = roundOf(curRound, true);
            var id = Number(t.dataset.ff);
            rd2.ff = rd2.ff || [];
            var i = rd2.ff.indexOf(id);
            if (t.checked && i < 0) { rd2.ff.push(id); }
            if (!t.checked && i >= 0) { rd2.ff.splice(i, 1); }
            /* 一局没下成，两边都没下：勾/取消一边，对面那行跟着一起变 */
            var oRaw = rd2.opps[id];
            var o = (oRaw == null || oRaw === 'bye') ? null : Number(oRaw);
            if (o != null && isFinite(o) && o !== id &&
                state.players.some(function (p) { return p.id === o; })) {
                var oi = rd2.ff.indexOf(o);
                var cb = entryHost.querySelector('[data-ff="' + o + '"]');
                if (t.checked && oi < 0) {
                    rd2.ff.push(o);
                    if (cb) { cb.checked = true; }
                } else if (!t.checked && oi >= 0) {
                    rd2.ff.splice(oi, 1);
                    if (cb) { cb.checked = false; }
                }
            }
            save();
            scheduleStand();
        }
    });

    function updateDeltaCell(id) {
        var td = entryHost.querySelector('[data-delta="' + id + '"]');
        var inp = entryHost.querySelector('[data-pre="' + id + '"]');
        if (!td) { return; }
        var sc = scoreOf(id, curRound);
        if (sc == null) {
            td.textContent = '';
            td.className = 'c-delta';
            if (inp) { inp.classList.remove('is-bad'); }
            return;
        }
        var bad = sc < 0 || sc > 1 || Math.abs(sc * 2 - Math.round(sc * 2)) > 1e-9;
        td.textContent = sc === 1 ? '1' : (sc === 0.5 ? '½' : fmt(sc));
        td.className = 'c-delta ' + (bad ? 'is-bad' : (sc === 1 ? 'is-win' : (sc === 0.5 ? 'is-draw' : '')));
        if (inp) { inp.classList.toggle('is-bad', bad); }
    }

    function bindEmpty() {
        var b = entryHost.querySelector('[data-act="paste"]');
        if (b) { b.addEventListener('click', openCurrentPaste); }
    }

    /* ---------------- 粘贴 ---------------- */

    function openPaste(text) {
        var box = $('#paste-box');
        box.hidden = false;
        if (text != null) { $('#paste-text').value = text; }
        $('#paste-hint').textContent = '';
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('#paste-text').focus();
    }

    function openCurrentPaste() {
        openPaste(null);
    }

    $('#btn-paste').addEventListener('click', openCurrentPaste);

    $('#btn-close-paste').addEventListener('click', function () { $('#paste-box').hidden = true; });

    function applyPaste() {
        var text = $('#paste-text').value;
        if (!text.trim()) { return; }

        var first = ML.parseText(text, state.players);
        if (!first.rows.length) {
            $('#paste-hint').textContent = '没认出任何一行，检查是否以编号开头';
            return;
        }

        /* 名单按编号自动建立：没见过的新编号补进来，已有的只补空的姓名/单位 */
        var added = 0;
        first.rows.forEach(function (r) {
            var p = null;
            state.players.forEach(function (x) { if (x.id === r.id) { p = x; } });
            if (!p) {
                state.players.push({ id: r.id, name: r.name, unit: r.unit || '' });
                added++;
            } else {
                if (!p.name) { p.name = r.name; }
                if (!p.unit && r.unit) { p.unit = r.unit; }
            }
        });
        state.players.sort(function (a, b) { return a.id - b.id; });

        /* 名单补齐后重解析一次，这次能认出对手编号 */
        var res = ML.parseText(text, state.players);
        var rd = roundOf(curRound, true);

        var idSet = {};
        state.players.forEach(function (p) { idSet[p.id] = 1; });

        res.rows.forEach(function (r) {
            /* 第 1 轮开赛前人人 0 分，那唯一的一个数字其实是对手编号 */
            if (curRound === 1) {
                if (r.opp == null && r.pre != null && idSet[r.pre]) { r.opp = r.pre; }
                r.pre = null;
            }
            if (r.pre != null && curRound > 1) { rd.pre[r.id] = r.pre; }
            if (r.opp != null) { rd.opps[r.id] = r.opp; }
        });

        /* 一局只输一次：a 写了对手 b，b 那边空着就补上 a */
        res.rows.forEach(function (r) {
            if (r.opp == null || r.opp === 'bye') { return; }
            var b = r.opp;
            if (rd.opps[b] == null || rd.opps[b] === '') { rd.opps[b] = r.id; }
        });

        $('#paste-hint').textContent = '填入 ' + res.rows.length + ' 人' +
            (added ? '，新增名单 ' + added + ' 人' : '');

        save();
        renderTabs(); syncSetup(); renderEntry(); refreshAll();
    }

    $('#btn-apply-paste').addEventListener('click', applyPaste);

    /* ---------------- 清空本轮 ---------------- */

    var flashEl = null, flashTimer = 0;
    function flash(msg) {
        if (!flashEl) {
            flashEl = document.createElement('div');
            flashEl.className = 'ml-flash';
            document.body.appendChild(flashEl);
        }
        flashEl.textContent = msg;
        flashEl.classList.add('is-on');
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () { flashEl.classList.remove('is-on'); }, 1800);
    }

    /* 把表格里所有能输入的东西按格子清空，不依赖重新渲染的结果 */
    function blankEntryInputs() {
        $$('#entry-host input[data-pre]').forEach(function (i) { i.value = ''; });
        $$('#entry-host input[data-opp]').forEach(function (i) { i.value = ''; });
        $$('#entry-host input[data-ff]').forEach(function (i) { i.checked = false; });
        $$('#entry-host [data-delta]').forEach(function (t) {
            t.textContent = '';
            t.className = 'c-delta';
        });
    }

    $('#btn-clear').addEventListener('click', function () {
        var ask = curRound === 1
            ? '清空第 1 轮的所有输入？名单、姓名、单位、对手都会清掉。'
            : '清空第 ' + curRound + ' 轮的所有输入？';
        if (!confirm(ask)) { return; }

        var rd = roundOf(curRound);
        if (rd) { rd.pre = {}; rd.opps = {}; rd.ff = []; }

        /* 清空的轮次直接从存档里去掉，别留空壳影响页签圆点与推算 */
        state.rounds = state.rounds.filter(function (x) {
            if (x.r !== curRound) { return true; }
            return Object.keys(x.pre || {}).length ||
                   Object.keys(x.opps || {}).length ||
                   (x.ff || []).length;
        });

        /* 第 1 轮连带名单一起清：姓名、单位都是粘贴时带进来的输入 */
        if (curRound === 1) {
            var rest = state.rounds.some(function (x) {
                return Object.keys(x.pre || {}).length ||
                       Object.keys(x.opps || {}).length ||
                       (x.ff || []).length;
            });
            if (!rest) { state.players = []; }
        }

        /* 立刻落盘，不等 220ms 防抖，马上刷新页面也不会复活 */
        clearTimeout(saveTimer);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}

        /* 粘贴草稿一并清掉，免得再点「填入本轮」把刚清的数据贴回来 */
        $('#paste-text').value = '';
        $('#paste-hint').textContent = '';
        $('#paste-box').hidden = true;

        renderTabs(); syncSetup(); renderEntry(); renderStandings(); renderSolveSelect();
        blankEntryInputs();
        resetSolve();
        flash('已清空第 ' + curRound + ' 轮' + (curRound === 1 ? '，名单也一并清空' : ''));
    });

    /* ---------------- 退赛识别 ----------------

       只看他有没有出现在那一轮的对阵表上：最后一轮露过面、之后就没影了，
       从缺席的那一轮起算退赛，后面都算。规则在引擎里（ML.detectWithdrawn），
       这里只把结果显示出来。
    */

    function renderWd() {
        var el = $('#wd-line');
        if (!el) { return; }
        var wd = ML.detectWithdrawn({
            totalRounds: state.totalRounds,
            players: state.players,
            rounds: state.rounds
        });
        var ids = Object.keys(wd).sort(function (a, b) { return wd[a] - wd[b] || a - b; });
        if (!ids.length) { el.hidden = true; el.innerHTML = ''; return; }

        var names = {};
        state.players.forEach(function (p) { names[p.id] = nameOf(p); });

        el.innerHTML = '<span class="ml-wd-k">退赛</span>' + ids.map(function (id) {
            return '<span class="ml-wd-i">' + esc(names[id] || (id + ' 号')) +
                '<i>第 ' + wd[id] + ' 轮起</i></span>';
        }).join('');
        el.hidden = false;
    }

    /* ---------------- 名次表 ---------------- */

    var standTimer = 0;
    function scheduleStand() {
        clearTimeout(standTimer);
        standTimer = setTimeout(function () { renderWd(); renderSolveSelect(); }, 180);
    }

    function currentState() {
        return {
            totalRounds: state.totalRounds,
            players: state.players,
            rounds: state.rounds,
            tiebreaks: state.tiebreaks
        };
    }

    function renderStandings() {
        /* 名次表不再单独展示，只维护推算用的选手下拉 */
        renderSolveSelect();
    }

    /* ---------------- 推算 ---------------- */

    var solveKey = '';

    function syncSolveSelect(st) {
        var sel = $('#f-target');
        var keep = sel.value;
        st = st || ML.standings(currentState());
        /* 选择器按积分降序、同分按编号升序排 */
        var rows = st.rows.slice().sort(function (a, b) {
            if (a.pts !== b.pts) { return b.pts - a.pts; }
            return a.id - b.id;
        });
        var opts = rows.map(function (r) {
            return '<option value="' + r.id + '">' + r.id + '　' + esc(nameOf(r)) +
                '（' + fmt(r.pts) + ' 分）</option>';
        }).join('');
        sel.innerHTML = opts;
        if (keep && rows.some(function (r) { return String(r.id) === keep; })) {
            sel.value = keep;
        }
    }

    function renderSolveSelect() {
        if (!state.players.length) {
            $('#f-target').innerHTML = '<option value="">—</option>';
            return;
        }
        syncSolveSelect();
    }

    /* 一场对局的说法：0=前者胜 1=平 2=前者负；两选一就是 不负/不平/不胜 */
    var RESULT_WORD = { '0': '胜', '1': '平', '2': '负', '0,1': '不负', '0,2': '不平', '1,2': '不胜' };

    function condText(t, nm) {
        if (t.playoff && t.a == null) { return nm(t.playoff); }   /* 占位：实际不再用「加赛胜」表述 */
        var allow = t.allow || [t.code === '1-0' ? 0 : (t.code === '0-1' ? 2 : 1)];
        var w = RESULT_WORD[allow.join(',')] || '胜';
        return nm(t.a) + ' ' + w + ' ' + nm(t.b);
    }

    /* 前提行：所有条件共有的那几场，单拎到最前面；只写对局本身，不加「前提」字样。
     * tail 用来把「→ 一定进前 N / 需加赛」直接挂在同一行末尾，不另起一行 */
    function premiseText(premise, nm, tail) {
        if (!premise || !premise.length) { return ''; }
        return '<div class="ml-premise">' +
            '<span class="ml-premise-txt">' +
            esc(premise.map(function (x) { return condText(x, nm); }).join('，')) + '</span>' +
            (tail || '') + '</div>';
    }

    /* 结论标签：稳进还是需加赛，始终跟在条件文字后面 */
    function leafTag(node, rank) {
        return '<span class="ml-leaf-tag' + (node.tie ? ' is-tie' : '') + '">→ ' +
            leafLabel(node, rank) + '</span>';
    }

    /* 条件树：一层一层摊开——本层前提，然后「满足任一」的分支，
     * 分支下面还能再套前提和分支。稳进和加赛在同一棵树里一起分类，
     * 分到最后那一行再标「一定进前 N」还是「需加赛」。 */
    function branchLis(node, gi, nm, rank) {
        if (!node || node.leaf) { return []; }
        /* 分支特别多时只列前 16 条，剩下的略过（列出来的都是能达成的） */
        var CAP = 16, shown = node.items.slice(0, CAP), more = node.items.length - shown.length;
        var out = shown.map(function (it) {
            var tag = '', sub = '';
            if (it.node && it.node.leaf && !(it.node.premise && it.node.premise.length)) {
                tag = leafTag(it.node, rank);
            } else if (it.node) {
                sub = subHtml(it.node, gi, nm, rank);
            }
            return '<li class="ml-branch">' +
                '<div class="ml-branch-row">' +
                '<button type="button" class="ml-term-q" data-g="' + gi + '" data-t="' + it.idx + '">' +
                '<span class="ml-term-txt">' + esc(condText(it.part, nm)) + '</span></button>' +
                tag + '</div>' +
                sub + detailBox(gi, it.idx) + '</li>';
        });
        if (more > 0) {
            out.push('<li class="ml-branch"><span class="ml-leaf-tag">……另有 ' + more + ' 种，略</span></li>');
        }
        return out;
    }

    /* 子树：本层前提 + 本层分支。有前提时分支整体再缩进一层，
     * 这样「前提」和它管着的分支能看出上下级 */
    function subHtml(node, gi, nm, rank) {
        if (node.leaf) {
            /* 结论直接接在前提那一行后面，不单独占一行 */
            if (node.premise && node.premise.length) {
                return premiseText(node.premise, nm, leafTag(node, rank));
            }
            return '<div class="ml-premise">' + leafTag(node, rank) + '</div>';
        }
        var head = premiseText(node.premise, nm);
        return head + '<ul class="ml-tree' + (head ? ' is-sub' : '') + '">' +
            branchLis(node, gi, nm, rank).join('') + '</ul>';
    }

    function leafLabel(node, rank) {
        if (node.tie) { return '需加赛'; }
        return '一定进前 ' + rank;
    }

    /* ---------------- 推算结果的展开详情 ---------------- */

    var lastAns = null;      /* 最近一次推算，用来按需展开 */
    var lastNm = function (id) { return String(id); };
    var detailCache = {};    /* 已算过的展开结果，键 = 组序号-条序号 */

    /* 一条条件展开后的状态：基础条件（pat）+ 手动固定的对局 + 当前看到的细分 */
    function makeDetail(gi, ti) {
        var g = lastAns.groups[gi];
        var it = g && g.flat && g.flat[ti];
        if (!it || !it.pat) { return null; }
        var c = { pat: it.pat.slice(), pins: [], view: { tab: 'all', page: 0 }, st: null };
        c.st = lastAns.explore(c.pat);
        /* 顶部选择器用的可固定对局列表（这条条件里没锁的对局，按台次排好） */
        c.holes = c.st.holes.slice();
        return c;
    }

    function patOf(c) {
        var p = c.pat.slice();
        c.pins.forEach(function (x) { p[x.gi] = x.v; });
        return p;
    }

    function pinIndexOf(c, gi) {
        for (var z = 0; z < c.pins.length; z++) { if (c.pins[z].gi === gi) { return z; } }
        return -1;
    }

    /* 固定/解除后重算细分，回到第一页 */
    function refreshDetail(c) {
        c.st = lastAns.explore(patOf(c));
        c.view.tab = 'all';
        c.view.page = 0;
    }

    function tbNameOf(k) {
        for (var i = 0; i < ML.TB_DEFS.length; i++) {
            if (ML.TB_DEFS[i].key === k) { return ML.TB_DEFS[i].name; }
        }
        return k;
    }

    function detailBox(gi, ti) {
        return '<div class="ml-term-detail" data-detail="' + gi + '-' + ti + '" hidden></div>';
    }

    /* 一个细分：未锁对局的结果 + 完整名次表（按名次排，自己那行高亮） */
    function repBlock(s, keys, nm, title) {
        var out = '<div class="ml-rep">';
        if (title) { out += '<p class="ml-rep-title">' + title + '</p>'; }

        /* 名次表上方：这个细分里未锁对局分别是胜/平/负 */
        if (s.games.length) {
            out += '<p class="ml-rep-games">' + s.games.map(function (x) {
                return esc(condText(x, nm));
            }).join('，') + '</p>';
        }

        var head = '<tr><th>名次</th><th>选手</th><th>积分</th>' +
            keys.map(function (k) { return '<th>' + esc(tbNameOf(k)) + '</th>'; }).join('') +
            '</tr>';

        function cells(o) {
            return '<td>' + o.rank + '</td>' +
                '<td>' + esc(o.me ? (nm(o.id) + '（你）') : nm(o.id)) + '</td>' +
                '<td>' + fmt(o.pts) + '</td>' +
                keys.map(function (k) { return '<td>' + fmt(o.tb[k]) + '</td>'; }).join('');
        }

        var rows = s.rows.map(function (o) {
            return '<tr' + (o.me ? ' class="is-me"' : '') + '>' + cells(o) + '</tr>';
        }).join('');

        out += '<div class="ml-cmp-wrap"><table class="ml-cmp"><thead>' + head +
            '</thead><tbody>' + rows + '</tbody></table></div>';

        return out + '</div>';
    }

    /* 名次表很长时，把自己那行滚到中间，免得要往下翻着找 */
    function revealMe(box) {
        var wrap = box.querySelector('.ml-cmp-wrap');
        var tr = wrap && wrap.querySelector('tr.is-me');
        if (!wrap || !tr) { return; }
        var top = tr.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
        wrap.scrollTop += top - wrap.clientHeight / 2 + tr.clientHeight / 2;
    }

    function detailHtml(c, key, nm) {
        var st = c.st, view = c.view;
        var list = view.tab === 'all' ? st.subs : st.subs.filter(function (s) {
            return (s.rank + '-' + s.worst) === view.tab;
        });
        if (!list.length) { view.tab = 'all'; list = st.subs; }
        var page = Math.min(Math.max(0, view.page | 0), Math.max(0, list.length - 1));
        view.page = page;
        var cur = list[page];

        function span(from, to) {
            return from === to ? ('第 ' + from + ' 名') : ('第 ' + from + '-' + to + ' 名');
        }

        var out = '';

        /* 顶部固定区：这条条件里没锁的对局，逐场选 胜/平/负（点已选的取消） */
        if (c.holes && c.holes.length) {
            out += '<div class="ml-pin-select">' +
                c.holes.map(function (h) {
                    var curV = -1;
                    var pi = pinIndexOf(c, h.gi);
                    if (pi >= 0) { curV = c.pins[pi].v; }
                    /* 按钮上的 胜/平/负 永远相对台次里排前面的那个人；
                     * h.flip 表示枚举方向跟台次方向相反，取值要倒过来。 */
                    var opts = ['胜', '平', '负'].map(function (w, idx) {
                        var v = h.flip ? 2 - idx : idx;
                        return '<button type="button" class="ml-pin-opt' + (curV === v ? ' is-on' : '') +
                            '" data-gi="' + h.gi + '" data-v="' + v + '" title="' + nm(h.a) + ' ' + w + ' ' + nm(h.b) + '">' +
                            w + '</button>';
                    }).join('');
                    return '<div class="ml-pin-row"><span class="ml-pin-pair">' +
                        esc(nm(h.a)) + ' — ' + esc(nm(h.b)) + '</span><span class="ml-pin-opts">' +
                        opts + '</span></div>';
                }).join('') +
                (c.pins.length ? '<button type="button" class="ml-pin-all" data-pin-all="1">全部解除</button>' : '') +
                '</div>';
        }

        var tabs = st.subs.length > 1 ? '<div class="ml-d-tabs">' +
            '<button type="button" class="ml-d-tab' + (view.tab === 'all' ? ' is-on' : '') +
            '" data-tab="all">全部 <b>' + st.subs.length + '</b></button>' +
            st.ranks.map(function (r) {
                return '<button type="button" class="ml-d-tab' + (view.tab === r.id ? ' is-on' : '') +
                    '" data-tab="' + r.id + '">' + span(r.from, r.to) +
                    ' <b>' + r.count + '</b></button>';
            }).join('') +
            '</div>' : '';

        var body = cur
            ? repBlock(st.detailOf(cur.key), st.keys, nm, '')
            : '<p class="ml-rep-none">没有细分。</p>';

        out += tabs + body;

        if (list.length <= 1) { return out; }

        var atTop = page <= 0, atEnd = page >= list.length - 1;
        var pos = '第 ' + (page + 1) + ' / ' + list.length + ' 种';
        if (cur) { pos += '｜' + span(cur.rank, cur.worst); }
        out += '<div class="ml-d-pager">' +
            '<button type="button" class="ml-d-pg" data-pg="first" title="第一种"' +
            (atTop ? ' disabled' : '') + '>«</button>' +
            '<button type="button" class="ml-d-pg" data-pg="prev" title="上一种"' +
            (atTop ? ' disabled' : '') + '>‹</button>' +
            '<span class="ml-d-pos">' + pos + '</span>' +
            '<button type="button" class="ml-d-pg" data-pg="next" title="下一种"' +
            (atEnd ? ' disabled' : '') + '>›</button>' +
            '<button type="button" class="ml-d-pg" data-pg="last" title="最后一种"' +
            (atEnd ? ' disabled' : '') + '>»</button>' +
            '</div>';

        return out;
    }

    function runSolve() {
        var host = $('#solve-host');
        if (!state.players.length) {
            host.innerHTML = '<div class="ml-empty">先录名单和成绩。</div>';
            return;
        }
        var tId = Number($('#f-target').value);
        var rank = Math.max(1, Number($('#f-rank').value) || 1);
        if (!tId) {
            host.innerHTML = '<p class="ml-hint">先选一个选手。</p>';
            return;
        }

        var t0 = Date.now();
        var ans = ML.solve(currentState(), tId, rank, { maxGames: 10 });
        var ms = Date.now() - t0;

        if (ans.error) {
            host.innerHTML = '<div class="ml-banner is-no">' + esc(ans.error) + '</div>';
            return;
        }

        var names = {};
        state.players.forEach(function (p) { names[p.id] = nameOf(p); });
        function nm(id) { return names[id] || (id + ' 号'); }

        lastAns = ans;
        lastNm = nm;
        detailCache = {};

        var self = esc(ans.target.name || ('#' + ans.target.id));

        /* 只有「一定进前 / 不可能」两种结论才显示带底色的横幅；
         * 其余情况（含轮空、需加赛）都走下面的条件列表，不再显示笼统横幅。 */
        var head = '';
        if (ans.always) {
            head = '<div class="ml-banner is-ok"><b>' + self + '</b> 一定进前 ' + rank + '。</div>';
        } else if (ans.never) {
            head = '<div class="ml-banner is-no"><b>' + self + '</b> 不可能进前 ' + rank + '。</div>';
        }

        var label = { win: self + ' 胜', draw: self + ' 平', loss: self + ' 负', bye: self + ' 轮空' };
        var badge = { win: 'is-win', draw: 'is-draw', loss: 'is-loss', bye: 'is-draw' };
        var byOut = {};
        ans.groups.forEach(function (g) { byOut[g.tOutcome] = g; });

        /* 三段恒定：胜 / 平 / 负（轮空选手只有一段）；每条条件都能点开看细分 */
        var body = '';
        if (!ans.always && !ans.never) {
            /* 轮空选手没有自身胜/平/负，只列一段（byOut 里只有 bye）；普通选手列三段 */
            var outcomeList = byOut.bye ? ['bye'] : ['win', 'draw', 'loss'];
            body = outcomeList.map(function (k) {
                var g = byOut[k];
                var gi = g ? ans.groups.indexOf(g) : -1;
                var tag = '<span class="ml-badge ' + badge[k] + '">' + esc(label[k]) + '</span>';
                if (!g || !g.tree) {
                    return '<div class="ml-case is-empty"><div class="ml-case-head">' + tag +
                        '<span class="ml-case-line">不可能进前 ' + rank + '</span></div></div>';
                }
                var inner = '', line = '';
                if (g.tree.leaf) {
                    /* 整段同一种结果：不用分类，直接一句结论 */
                    line = leafLabel(g.tree, rank);
                } else {
                    /* 稳进和加赛在同一棵树里一起分类，叶子才标是稳进还是要加赛 */
                    var pre = premiseText(g.tree.premise, nm);
                    inner = pre +
                        '<ul class="ml-tree' + (pre ? ' is-sub' : '') + '">' +
                        branchLis(g.tree, gi, nm, rank).join('') + '</ul>';
                    var n = (g.freeCount || 0) + (g.tieCount || 0);
                    if (n > 1) { line = '满足以下任一，共 ' + n + ' 种'; }
                }
                return '<div class="ml-case">' +
                    '<div class="ml-case-head">' + tag +
                    (line ? '<span class="ml-case-line">' + line + '</span>' : '') +
                    '</div>' + inner + '</div>';
            }).join('');
        }

        var tail = '耗时 ' + ms + ' ms';

        host.innerHTML = head + body + '<p class="ml-hint">' + tail + '。</p>';
    }

    /* 找某个按钮所在的展开块及其状态 */
    function detailCtxOf(el) {
        var box = el.closest ? el.closest('.ml-term-detail') : null;
        if (!box) { return null; }
        var k = box.dataset.detail;
        var c = k && detailCache[k];
        return c ? { box: box, key: k, c: c } : null;
    }

    /* 固定的对局按台次排：枚举下标就是台次号 */
    function pairOrder(gi) { return gi; }

    /* 点一条条件 → 展开它下面的细分；点对局可固定结果，点名次标签 / 翻页换页 */
    $('#solve-host').addEventListener('click', function (e) {
        var tgt = e.target && e.target.closest ? e.target : null;
        if (!tgt || !lastAns) { return; }

        /* 顶部固定区：给某一场选 胜/平/负，点已选的取消 */
        var optBtn = tgt.closest('.ml-pin-opt');
        if (optBtn) {
            var oc = detailCtxOf(optBtn);
            if (!oc) { return; }
            var ogi = Number(optBtn.dataset.gi);
            var ov = Number(optBtn.dataset.v);
            var h = null;
            for (var z = 0; z < oc.c.holes.length; z++) {
                if (oc.c.holes[z].gi === ogi) { h = oc.c.holes[z]; break; }
            }
            if (!h) { return; }
            var pi = pinIndexOf(oc.c, ogi);
            if (pi >= 0 && oc.c.pins[pi].v === ov) {
                oc.c.pins.splice(pi, 1);          /* 再点一次 → 取消 */
            } else {
                if (pi >= 0) { oc.c.pins.splice(pi, 1); }
                oc.c.pins.push({ gi: ogi, v: ov, a: h.a, b: h.b });
            }
            oc.c.pins.sort(function (x, y) { return pairOrder(x.gi) - pairOrder(y.gi); });
            refreshDetail(oc.c);
            oc.box.innerHTML = detailHtml(oc.c, oc.key, lastNm);
            revealMe(oc.box);
            return;
        }

        if (tgt.closest('.ml-pin-all')) {
            var ac = detailCtxOf(tgt);
            if (!ac) { return; }
            ac.c.pins = [];
            refreshDetail(ac.c);
            ac.box.innerHTML = detailHtml(ac.c, ac.key, lastNm);
            revealMe(ac.box);
            return;
        }

        var nav = tgt.closest('.ml-d-tab, .ml-d-pg');
        if (nav) {
            var nc = detailCtxOf(nav);
            if (!nc) { return; }
            var st0 = nc.c.st, view = nc.c.view;
            if (nav.classList.contains('ml-d-tab')) {
                view.tab = nav.dataset.tab;
                view.page = 0;
            } else {
                var list = view.tab === 'all' ? st0.subs : st0.subs.filter(function (s) {
                    return (s.rank + '-' + s.worst) === view.tab;
                });
                var last = Math.max(0, list.length - 1);
                var pg2 = nav.dataset.pg;
                if (pg2 === 'first') { view.page = 0; }
                else if (pg2 === 'last') { view.page = last; }
                else if (pg2 === 'prev') { view.page = Math.max(0, view.page - 1); }
                else { view.page = Math.min(last, view.page + 1); }
            }
            nc.box.innerHTML = detailHtml(nc.c, nc.key, lastNm);
            revealMe(nc.box);
            return;
        }

        /* ---- 详情页已去掉：点条件不再展开细分（以下代码打注释保留） ----
        var btn = tgt.closest('.ml-term-q');
        if (!btn) { return; }
        var gi = Number(btn.dataset.g), ti = Number(btn.dataset.t);
        var box = this.querySelector('[data-detail="' + gi + '-' + ti + '"]');
        if (!box) { return; }

        if (!box.hidden) {
            box.hidden = true;
            btn.classList.remove('is-open');
            return;
        }

        if (!box.dataset.done) {
            var c = makeDetail(gi, ti);
            if (!c) {
                box.innerHTML = '<p class="ml-d-note">这一条没有可展开的细分。</p>';
            } else {
                var key = gi + '-' + ti;
                detailCache[key] = c;
                box.dataset.detail = key;
                box.innerHTML = detailHtml(c, key, lastNm);
            }
            box.dataset.done = '1';
        }
        box.hidden = false;
        btn.classList.add('is-open');
        revealMe(box);
        ---- 详情页展开逻辑结束 ---- */
    });

    $('#btn-solve').addEventListener('click', runSolve);
    $('#f-rank').addEventListener('keydown', function (e) { if (e.key === 'Enter') { runSolve(); } });

    /* ---------------- 导入导出 ---------------- */

    function download(name, text) {
        var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }

    $('#btn-export').addEventListener('click', function () {
        var name = '末轮计算器-' + new Date().toISOString().slice(0, 10) + '.json';
        download(name, JSON.stringify(state, null, 2));
    });

    $('#btn-import').addEventListener('click', function () {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.json,application/json';
        inp.addEventListener('change', function () {
            var f = inp.files && inp.files[0];
            if (!f) { return; }
            var fr = new FileReader();
            fr.onload = function () {
                try {
                    var s = JSON.parse(String(fr.result));
                    if (!s || !Array.isArray(s.players)) { throw new Error('格式不对'); }
                    state = s;
                    state.tiebreaks = ML.normalizeTiebreaks(state.tiebreaks);
                    if (!state.tiebreaks.length) { state.tiebreaks = ML.DEFAULT_TIEBREAK.slice(); }
                    ML.CFG.byePoint = state.byePoint || 1;
                    curRound = Math.min(state.totalRounds, Math.max(1, lastPlayed() + 1));
                    save();
                    syncSetup(); renderTiebreak(); renderTabs(); renderEntry();
                    renderStandings(); renderSolveSelect();
                } catch (e) {
                    alert('导入失败：' + e.message);
                }
            };
            fr.readAsText(f);
        });
        inp.click();
    });

    $('#btn-reset').addEventListener('click', function () {
        if (!confirm('清空全部名单与成绩？导出过的存档不受影响。')) { return; }
        state = blank();
        curRound = 1;

        syncSetup(); renderTiebreak(); renderTabs(); renderEntry();
        renderStandings(); renderSolveSelect();
        $('#solve-host').innerHTML = '<p class="ml-hint">录完前几轮后，这里会列出末轮条件。</p>';
