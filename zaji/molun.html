<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>末轮计算器 - 连珠杂箱</title>
<meta name="description" content="瑞士制比赛末轮计算器：按相邻轮次积分分差识别每轮成绩，自定义对手分、中间对手分、对手分去1、对手分去2、胜局数的优先顺序，推算目标名次所需的胜平条件。">
<meta name="theme-color" content="#f6f2e9">
<link rel="stylesheet" href="../assets/style.css">
<style>
    /* ---------- 工具卡 ---------- */
    .ml-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 20px 22px 22px;
        margin: 0 0 20px;
        box-shadow: var(--shadow-sm);
    }

    .ml-card > h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 14px;
        letter-spacing: 0.04em;
        display: flex;
        align-items: baseline;
        gap: 8px;
    }

    .ml-card > h2 .ml-step {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--gold-deep);
        background: var(--gold-tint);
        border-radius: 999px;
        padding: 2px 9px;
        transform: translateY(-1px);
    }

    .ml-sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
        margin: 0 0 16px;
        font-family: var(--sans);
    }

    .ml-sub b { color: var(--ink-2); font-weight: 600; }


    .ml-field { display: flex; flex-direction: column; gap: 5px; }

    .ml-field > span {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
    }

    .ml-input,
    .ml-select,
    .ml-textarea {
        width: 100%;
        font-family: var(--sans);
        font-size: 13px;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        line-height: 1.5;
        transition: border-color 0.16s ease, background-color 0.16s ease;
    }

    .ml-input:focus,
    .ml-select:focus,
    .ml-textarea:focus {
        outline: none;
        border-color: var(--gold);
        background: var(--surface);
    }

    .ml-textarea {
        min-height: 120px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.8;
    }

    .ml-btn {
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1;
        padding: 8px 15px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink-2);
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, background-color 0.16s ease;
        white-space: nowrap;
    }

    .ml-btn:hover { border-color: var(--gold); color: var(--gold-deep); background: var(--gold-tint); }

    .ml-btn.is-primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #fffdf7;
    }

    .ml-btn.is-primary:hover { background: var(--gold-deep); border-color: var(--gold-deep); color: #fffdf7; }

    .ml-btn.is-quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .ml-btn.is-quiet:hover { color: var(--gold-deep); background: var(--gold-tint); }

    .ml-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .ml-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 14px;
    }

    .ml-toolbar .ml-spacer { flex: 1; }

    .ml-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
    }

    .ml-bar .ml-spacer { flex: 1; }

    .ml-note {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--muted);
    }

    .ml-note b { color: var(--ink-2); font-weight: 600; }

    /* ---------- 轻提示 ---------- */
    .ml-flash {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%) translateY(10px);
        z-index: 90;
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        font-size: 13px;
        letter-spacing: 0.02em;
        box-shadow: var(--shadow-md);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .ml-flash.is-on { opacity: 0.95; transform: translateX(-50%) translateY(0); }

    /* ---------- 破同分 ---------- */
    .ml-tb { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

    .ml-tb li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        font-family: var(--sans);
        font-size: 13.5px;
        transition: opacity 0.16s ease, border-color 0.16s ease;
    }

    .ml-tb li.is-off { opacity: 0.42; }
    .ml-tb li.is-drag { border-color: var(--gold); background: var(--gold-tint); }

    .ml-tb .ml-grip {
        cursor: grab;
        color: var(--faint);
        font-size: 15px;
        letter-spacing: -2px;
        user-select: none;
    }

    .ml-tb .ml-tb-rank {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--gold-deep);
        width: 16px;
        text-align: center;
    }

    .ml-tb .ml-tb-name { flex: 1; }
    .ml-tb .ml-tb-hint { color: var(--muted); font-size: 11.5px; }

    .ml-move {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-3);
        border-radius: 6px;
        width: 24px;
        height: 24px;
        line-height: 1;
        cursor: pointer;
        font-size: 12px;
        padding: 0;
    }

    .ml-move:hover { border-color: var(--gold); color: var(--gold-deep); }
    .ml-move:disabled { opacity: 0.3; cursor: default; }

    .ml-check {
        width: 15px;
        height: 15px;
        accent-color: var(--gold-deep);
        cursor: pointer;
        margin: 0;
        flex: none;
    }

    /* ---------- 轮次页签 ---------- */
    .ml-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 14px;
    }

    .ml-tab {
        font-family: var(--sans);
        font-size: 12.5px;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink-3);
        cursor: pointer;
        line-height: 1.4;
        transition: all 0.16s ease;
    }

    .ml-tab:hover { border-color: var(--gold); color: var(--gold-deep); }

    .ml-tab.is-on {
        background: var(--ink-2);
        border-color: var(--ink-2);
        color: var(--paper);
    }

    .ml-tab .ml-dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold);
        margin-left: 5px;
        transform: translateY(-1px);
    }

    .ml-tab.is-on .ml-dot { background: #e2c07d; }

    .ml-rounds {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -4px 0 16px;
        font-family: var(--sans);
        font-size: 12px;
        color: var(--ink-3);
    }

    .ml-rounds b { color: var(--ink-2); font-weight: 600; }
    .ml-rounds .ml-move { width: 24px; height: 24px; font-size: 13px; }

    /* ---------- 表格 ---------- */
    .ml-table-wrap {
        overflow: auto;
        max-height: 60vh;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--surface);
    }

    table.ml-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--sans);
        font-size: 13px;
        white-space: nowrap;
    }

    .ml-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--paper-deep);
        color: var(--ink-3);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
    }

    .ml-table td {
        padding: 3px 10px;
        border-top: 1px solid var(--line-soft);
        color: var(--ink-2);
    }

    .ml-table tbody tr:nth-child(even) { background: rgba(239, 232, 217, 0.3); }
    .ml-table tbody tr:hover { background: var(--gold-tint); }

    .ml-table .c-num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .ml-table .c-score { font-variant-numeric: tabular-nums; }
    .ml-table .c-delta { font-variant-numeric: tabular-nums; color: var(--ink-3); }
    .ml-table .c-delta.is-win { color: var(--win); font-weight: 600; }
    .ml-table .c-delta.is-draw { color: var(--draw); }
    .ml-table .c-delta.is-bad { color: #b3261e; font-weight: 600; }

    .ml-table input.ml-cell {
        width: 66px;
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 3px 7px;
        text-align: right;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        transition: border-color 0.14s ease, background-color 0.14s ease;
    }

    .ml-table input.ml-cell::placeholder { color: var(--faint); }
    .ml-table input.ml-cell.is-fixed {
        color: var(--muted);
        background: transparent;
        border-color: transparent;
        cursor: default;
    }

    .ml-table input.ml-cell:hover { border-color: var(--gold); }
    .ml-table input.ml-cell:focus { outline: none; border-color: var(--gold); background: #fffdf9; box-shadow: 0 0 0 3px rgba(176, 141, 87, 0.12); }
    .ml-table input.ml-cell.is-bad { border-color: #d99; background: #fdf3f2; }
    .ml-table input.ml-cell[data-opp] { text-align: center; width: 62px; }
    .ml-table input.ml-cell[data-pre] { text-align: center; width: 72px; }

    /* 数字列跟输入框一起居中对齐 */
    .ml-table th.c-score { text-align: center; padding-right: 0; }
    .ml-table .c-delta { text-align: center; padding-right: 0; font-size: 13px; }

    .ml-table tr.is-bye td { color: var(--ink-3); }
    .ml-table .c-tag {
        font-size: 10.5px;
        color: var(--gold-deep);
        background: var(--gold-tint);
        border-radius: 4px;
        padding: 1px 5px;
        margin-left: 4px;
    }

    /* ---------- 提示 ---------- */
    .ml-hint {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--muted);
        padding: 8px 12px;
        background: var(--surface-2);
        border: 1px dashed var(--line);
        border-radius: 8px;
        margin: 12px 0 0;
    }

    .ml-hint.is-warn { color: #8a3a34; background: #fbf1ef; border-color: #e6c6c0; }
    .ml-hint b { color: inherit; }

    .ml-empty {
        text-align: center;
        padding: 34px 16px;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 2;
        border: 1px dashed var(--line);
        border-radius: 10px;
        background: var(--surface-2);
    }

    .ml-empty .ml-btn { margin-top: 10px; }

    /* ---------- 退赛识别 ---------- */
    .ml-wd {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        margin: 2px 0 10px;
        font-family: var(--sans);
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink-3);
    }

    .ml-wd-k { color: var(--faint); letter-spacing: 0.06em; }
    .ml-wd-i i { font-style: normal; margin-left: 4px; font-size: 11px; color: var(--faint); }

    .ml-paste { margin: 0 0 14px; }
    .ml-paste[hidden] { display: none; }

    /* ---------- 名次表 ---------- */
    .ml-stand th.is-tb, .ml-stand td.is-tb { text-align: right; font-variant-numeric: tabular-nums; }
    .ml-stand td.is-pts { font-weight: 600; color: var(--ink); text-align: right; }
    .ml-stand tr.is-cut td { background: rgba(176, 141, 87, 0.1); }
    .ml-stand tr.is-target td { background: var(--gold-tint); }

    .ml-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 10px;
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
    }

    /* ---------- 推算 ---------- */
    .ml-solve-grid {
        display: grid;
        grid-template-columns: minmax(150px, 1.4fr) minmax(90px, 0.7fr) auto;
        gap: 12px;
        align-items: end;
    }

    .ml-result { margin-top: 16px; }

    .ml-banner {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.8;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface-2);
    }

    .ml-banner.is-ok { border-color: #c6dcc9; background: #f1f7f2; color: #2f5a3a; }
    .ml-banner.is-no { border-color: #e8cdc8; background: #fbf2f0; color: #8a3a34; }

    .ml-case {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        margin-top: 10px;
        overflow: hidden;
    }

    .ml-case > .ml-case-head {
        padding: 11px 14px;
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.85;
        color: var(--ink-2);
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 9px;
    }

    .ml-case.is-empty { background: transparent; }

    .ml-case .ml-case-head .ml-case-line { color: var(--ink-2); }
    .ml-case.is-empty .ml-case-head .ml-case-line { color: var(--muted); }

    .ml-case .ml-badge {
        font-size: 11px;
        font-family: var(--sans);
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: var(--surface);
    }

    .ml-case .ml-badge.is-win { color: var(--win); border-color: #e2c3bd; }
    .ml-case .ml-badge.is-draw { color: var(--draw); }
    .ml-case .ml-badge.is-loss { color: var(--loss); border-color: #c7d6c9; }

    .ml-case ul {
        margin: 0;
        padding: 0 16px 12px 34px;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 2;
        color: var(--ink-2);
    }

    .ml-case li::marker { color: var(--gold); }
    .ml-case .ml-cond-none { color: var(--muted); list-style: none; margin-left: -16px; }
    .ml-case .ml-cond-tag { color: var(--faint); font-size: 11.5px; margin-left: 6px; }

    /* ---------- 可展开的条件 ---------- */
    .ml-case ul.ml-terms {
        list-style: none;
        margin: 0;
        padding: 0 10px 10px;
        line-height: 1.9;
    }

    .ml-case li.ml-term { list-style: none; margin: 0; }

    /* 前提：多条条件共有的那几场，单拎到最前面；下面的分支缩进列举
     * 版式跟分支行一致（同字号、同色、同缩进），只是不带层级线、也不可点 */
    .ml-case .ml-premise {
        margin: 0;
        padding: 0 0 0 16px;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.9;
        color: var(--ink-2);
    }

    /* 嵌在某一分支下的前提，缩进跟同层的子分支对齐 */
    .ml-case .ml-branch > .ml-premise { padding-left: 21px; }

    /* 前提下面管着的分支：再往里缩一层，跟前提拉开一个台阶 */
    .ml-case ul.ml-tree ul.ml-tree.is-sub { padding-left: 34px; }
    .ml-case > ul.ml-tree.is-sub { padding-left: 38px; }

    .ml-case .ml-case-sub {
        padding: 6px 14px 0 30px;
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
    }

    .ml-case ul.ml-terms.is-sub { padding-left: 26px; }

    /* ---------- 条件树：分支里还能再套前提和分支 ---------- */
    .ml-case ul.ml-tree {
        list-style: none;
        margin: 0;
        padding: 2px 10px 10px 16px;
        line-height: 1.9;
    }

    .ml-case ul.ml-tree ul.ml-tree {
        padding: 0 0 2px 12px;
        margin-left: 9px;
        border-left: 1px dashed var(--line);
    }

    .ml-case li.ml-branch { list-style: none; margin: 0; }

    .ml-case .ml-branch-row {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0 2px;
    }

    .ml-case .ml-branch-row .ml-term-q { width: auto; flex: 0 1 auto; }

    /* 条件文字按正文排版：不加边框、底色和留白，只在悬停时给一点提示 */

    /* 结论「→ 一定进前 N / → 需加赛」按纯文本排：跟条件文字同字号、同颜色，
     * 不加标签样式，只保留一点间距和不断行 */
    .ml-leaf-tag {
        margin-left: 8px;
        white-space: nowrap;
    }

    /* 结论跟前一个词黏在一起，不单独掉到下一行 */
    .ml-leaf-tag::before { content: "\2060"; }

    .ml-term-q {
        display: inline-flex;
        align-items: baseline;
        gap: 0;
        width: auto;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.9;
        color: var(--ink-2);
        text-align: left;
        cursor: pointer;
        transition: color 0.14s ease;
    }

    .ml-term-q:hover { color: var(--ink); }
    .ml-term-q:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
    .ml-term-q .ml-term-txt { flex: 0 0 auto; }

    .ml-term-q.is-open { color: var(--gold-deep); }

    .ml-term-detail {
        margin: 4px 0 8px;
        padding: 10px 12px;
        border-left: 2px solid var(--gold);
        border-radius: 0 8px 8px 0;
        background: var(--surface);
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.9;
        color: var(--ink-2);
    }

    .ml-term-detail .ml-d-note {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
    }

    .ml-term-detail .ml-d-note b { color: var(--ink-2); }

    /* 名次标签 + 细分翻页 */
    .ml-d-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 8px;
    }

    .ml-d-tab {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        padding: 2px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--ink-3);
        font-family: var(--sans);
        font-size: 12px;
        line-height: 1.8;
        cursor: pointer;
        transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    .ml-d-tab b { font-weight: 600; font-size: 11px; color: var(--faint); }
    .ml-d-tab:hover { border-color: var(--gold); color: var(--ink); }
    .ml-d-tab.is-on { background: var(--gold-tint); border-color: var(--gold); color: var(--gold-deep); }
    .ml-d-tab.is-on b { color: var(--gold-deep); }

    .ml-d-pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 8px 0 0;
        padding-top: 7px;
        border-top: 1px solid var(--line-soft);
    }

    .ml-d-pg {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink-2);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
    }

    .ml-d-pg:hover:not(:disabled) { border-color: var(--gold); color: var(--ink); background: var(--gold-tint); }
    .ml-d-pg:disabled { opacity: 0.3; cursor: default; }

    .ml-d-pos { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

    .ml-rep {
        margin: 0 0 10px;
        padding: 8px 10px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--surface-2);
    }

    .ml-rep:last-child { margin-bottom: 0; }

    .ml-rep-title {
        margin: 0 0 3px;
        font-size: 11.5px;
        letter-spacing: 0.04em;
        color: var(--gold-deep);
    }

    .ml-rep-games {
        margin: 0 0 8px;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.6;
    }

    /* 顶部固定区：逐场选 胜/平/负 */
    .ml-pin-select {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin: 0 0 10px;
        padding: 8px;
        border: 1px solid var(--line-soft);

<script id="ml-engine">
/*
 * 末轮计算器 · 引擎（通用版）
 * ------------------------------------------------------------
 * 口径约定：
 *   每轮只认「上轮积分」（该轮成绩单上的积分列），
 *   本轮得分 = 下一轮的上轮积分 − 本轮的上轮积分。
 *   不读任何「胜/负」字样，胜负由分差反推，避免识别结果列出错。
 *
 * 数据：
 *   state = {
 *     totalRounds: 7,
 *     players: [{ id, name, unit }],
 *     rounds: [{ r: 3, pre: {1: 2, 2: 1.5}, opps: {1: 2, 2: 1}, ff: [3] }],
 *     // ff = 这一轮勾了「未弈」的编号；弃权还是对手弃权，看这一轮的得分：
 *     //   得 0 记自己弃权，得 1 记对手弃权（白捡一胜），得 0.5 按和棋算
 *     withdrawn: { 33: 6 },          // 可选：编号 -> 从第几轮起退赛；不给就按对阵表自动识别
 *     tiebreaks: ['buch', 'med', 'wins']
 *   }
 *
 * 破同分项：积分永远是第一顺位，其后按 tiebreaks 顺序逐项比较。
 */
(function (root, factory) {
    if (typeof module === 'object' && module && module.exports) {
        module.exports = factory();
    } else {
        root.ML = factory();
    }
}(typeof self !== 'undefined' ? self : this, function () {
    'use strict';

    var CFG = {
        byePoint: 1,          // 轮空得几分
        byeAsWin: false,      // 轮空算不算胜局数
        ffWinAsWin: false,    // 对手弃权白捡的一胜算不算胜局数
        /* 虚拟积分（别人算对手分时，这个人算几分）：
         *   积分 + 0.5×(弃权次数 + 退赛轮数) − 0.5×(轮空次数 + 对手弃权次数)
         * 弃权与对手弃权都不再单独录，一律由「未弈」勾选 + 本轮得分判出来：
         *   勾了未弈且得 0 → 弃权次数 +1；勾了未弈且得 1 → 对手弃权次数 +1。
         * 一句话：没下成的局一律按和棋 0.5 分算；轮空、对手弃权白捡的一分要减回去。
         * 每一局都占一个对手分槽位，不能丢：
         *   轮空那一槽 = 虚拟对手「总轮数×0.5」
         *   弃权、未弈、退赛那一槽 = 虚拟对手 0
         * 整场退赛的人，对别人一律按虚拟分 0 计（vsOf 里直接返回 0）。 */
        medianMode: 'both',   // both = 去头去尾，high = 只去最高
        byeBuch: 'half'       // 轮空在对手分里按 total×0.5 的虚拟对手
    };

    var TB_DEFS = [
        { key: 'buch', name: '对手分', hint: '全部对手的积分之和' },
        { key: 'med', name: '中间对手分', hint: '对手分去掉最高、最低各一个' },
        { key: 'cut1', name: '对手分去1', hint: '对手分去掉一个最低的' },
        { key: 'cut2', name: '对手分去2', hint: '对手分去掉两个最低的' },
        { key: 'wins', name: '胜局数', hint: '真正下赢的盘数，不含轮空与对手弃权' }
    ];

    var DEFAULT_TIEBREAK = ['buch', 'med', 'wins'];

    function num(v) {
        if (v === '' || v == null) { return null; }
        var x = Number(v);
        return isFinite(x) ? x : null;
    }

    function half(v) { return Math.round(v * 2) / 2; }

    function tbKeys(state) {
        var k = (state.tiebreaks || []).filter(function (x) {
            return TB_DEFS.some(function (d) { return d.key === x; });
        });
        return k.length ? k : DEFAULT_TIEBREAK.slice();
    }

    function normalizeTiebreaks(list) {
        var out = [];
        (list || []).forEach(function (k) {
            if (k && out.indexOf(k) < 0 && TB_DEFS.some(function (d) { return d.key === k; })) {
                out.push(k);
            }
        });
        return out;
    }

    /* ---------------- 基础累计 ---------------- */

    /* 这一轮的对阵表上有没有他：自己有对手栏，或者被别人写成对手 */
    function inTable(rd, id) {
        var opps = (rd && rd.opps) || {};
        if (opps[id] != null && opps[id] !== '') { return true; }
        return Object.keys(opps).some(function (k) { return num(opps[k]) === id; });
    }

    /*
     * 退赛：只看他有没有出现在那一轮的对阵表上。
     * 最后一轮露过面、之后就没影了 → 从缺席的第一轮起算退赛，后面都算。
     * 只认「贴得比较全」的轮次（对阵条数不到半数的不看），免得贴一半就误判。
     */
    function detectWithdrawn(state) {
        var out = {};
        var total = Math.max(1, Number(state.totalRounds) || 9);
        var list = (state.players || []).map(function (p) { return Number(p.id); });
        if (!list.length) { return out; }

        var need = Math.max(4, Math.ceil(list.length * 0.5));
        var rs = [];
        (state.rounds || []).forEach(function (rd) {
            if (!rd || rd.r > total - 1) { return; }
            var opps = rd.opps || {};
            if (Object.keys(opps).length < need) { return; }
            var has = {};
            Object.keys(opps).forEach(function (k) {
                var v = opps[k];
                if (num(k) != null) { has[Number(k)] = 1; }   /* 自己有对手栏 */
                var o = num(v);
                if (o != null) { has[o] = 1; }                /* 被别人写成对手，也算在表上 */
            });
            rs.push({ r: rd.r, has: has });
        });
        rs.sort(function (a, b) { return a.r - b.r; });
        if (rs.length < 2) { return out; }

        var lastR = rs[rs.length - 1].r;
        list.forEach(function (id) {
            var lp = 0;
            rs.forEach(function (x) { if (x.has[id]) { lp = x.r; } });
            if (!lp || lp >= lastR) { return; }
            out[id] = lp + 1;
        });
        return out;
    }

    function build(state, opt) {
        opt = opt || {};
        var upto = opt.upto == null ? Infinity : opt.upto;
        var total = Math.max(1, Number(state.totalRounds) || 9);
        var players = (state.players || []).slice().sort(function (a, b) { return a.id - b.id; });
        var n = players.length;
        var index = {};
        players.forEach(function (p, i) { index[p.id] = i; });

        var P = [];
        for (var i = 0; i < n; i++) {
            P.push({
                pts: 0, wins: 0, draws: 0, losses: 0,
                ff: 0, oppFF: 0, byes: 0, none: 0, wd: 0,
                slots: [], log: []
            });
        }

        /* 退赛：没显式给出就按对阵表自动识别 */
        var withdrawn = state.withdrawn || detectWithdrawn(state);
        var warnings = [];

        var allRounds = (state.rounds || []).filter(function (rd) {
            if (!rd) { return false; }
            return Object.keys(rd.pre || {}).length > 0 ||
                   Object.keys(rd.opps || {}).length > 0 ||
                   (rd.ff || []).length > 0;
        }).sort(function (a, b) { return a.r - b.r; });

        var preAt = {};
        allRounds.forEach(function (rd) { preAt[rd.r] = rd.pre || {}; });

        /* 第 r 轮开赛前的累计分（即这一轮成绩单上的「上轮积分」）；第 1 轮一律 0 */
        function beforeOf(r, pid) {
            var m = preAt[r];
            if (!m) { return r === 1 ? 0 : null; }
            var v = num(m[pid]);
            if (v == null) { return r === 1 ? 0 : null; }
            return v;
        }

        /* 只有相邻两轮都有上轮积分，才推得出这一轮的得分 */
        var rounds = allRounds.filter(function (rd) {
            if (rd.r > upto) { return false; }
            for (var q = 0; q < n; q++) {
                var qid = players[q].id;
                if (beforeOf(rd.r, qid) != null && beforeOf(rd.r + 1, qid) != null) { return true; }
            }
            return false;
        });

        rounds.forEach(function (rd) {
            var opps = rd.opps || {};
            var ffSet = {};
            (rd.ff || []).forEach(function (id) { ffSet[id] = 1; });

            var delta = [], has = [], op = [], k;
            for (k = 0; k < n; k++) {
                var pid = players[k].id;
                var b0 = beforeOf(rd.r, pid);
                var b1 = beforeOf(rd.r + 1, pid);
                has[k] = b0 != null && b1 != null;
                delta[k] = has[k] ? half(b1 - b0) : 0;
                var o = opps[pid];
                op[k] = (o == null || o === '') ? null : (o === 'bye' ? 'bye' : Number(o));
            }

            var seen = {}, paired = {};

            function push(i2, s) { P[i2].slots.push(s); }

            /* 未弈：勾了这一轮没下，再按本轮得分（分差）判断是哪一种：
             *   0  → 自己弃权（没到场，判负）
             *   ½  → 双方都没下成，按和棋算（不额外调整）
             *   1  → 对手弃权，白捡一胜
             * 没有得分信息时按弃权算，与旧版一致。 */
            for (k = 0; k < n; k++) {
                if (!ffSet[players[k].id]) { continue; }
                if (!has[k] && op[k] == null) { continue; }
                classifyNoPlay(k, has[k] ? delta[k] : 0, true);
            }

            /* 没下成的一局里，某一方记一次：0 判负、½ 和棋、1 白捡一胜 */
            function classifyNoPlay(i2, dd, checked) {
                if (dd === 0) {
                    P[i2].ff++; P[i2].losses++;
                } else if (dd === 0.5) {
                    P[i2].draws++;
                } else if (dd === 1) {
                    P[i2].oppFF++;
                } else if (checked) {
                    P[i2].ff++; P[i2].losses++;
                    warnings.push('第 ' + rd.r + ' 轮：' + players[i2].id +
                        ' 标了未弈但得分是 ' + dd + '，按弃权处理');
                }
            }

            for (k = 0; k < n; k++) {
                if (paired[k]) { continue; }
                var oid = op[k];

                /* 只有显式标 bye 才算轮空；对手留空视为没录对手，对手分记 0 */
                if (has[k] && oid === 'bye') {
                    paired[k] = true;
                    seen[k] = 1;
                    P[k].pts += delta[k];
                    P[k].byes++;
                    push(k, { t: 'bye', d: delta[k] });
                    P[k].log.push({ r: rd.r, d: delta[k], t: 'bye' });
                    continue;
                }

                if (oid == null) {
                    /* 对手没录：说明这轮他不在对阵表上，算退赛轮数；分数照算，对手分槽位记 0。
                     * 已经标过未弈的，上面已按分差记过一次，不再重复算退赛轮。 */
                    if (!has[k]) { continue; }
                    paired[k] = true; seen[k] = 1;
                    P[k].pts += delta[k];
                    var kMarked = !!ffSet[players[k].id];
                    if (!kMarked) { P[k].wd++; }
                    push(k, { t: kMarked ? 'none' : 'wd', d: delta[k] });
                    P[k].log.push({ r: rd.r, d: delta[k], t: kMarked ? 'none' : 'wd' });
                    continue;
                }

                var j = index[oid];
                if (j == null) {
                    warnings.push('第 ' + rd.r + ' 轮：' + players[k].id + ' 号对手 ' + oid + ' 不在名单');
                    paired[k] = true; seen[k] = 1;
                    P[k].pts += delta[k];
                    P[k].none++;
                    push(k, { t: 'none', d: delta[k] });
                    continue;
                }
                if (j === k) { continue; }

                paired[k] = true; paired[j] = true;
                seen[k] = 1; seen[j] = 1;

                var da = delta[k], db = delta[j];
                P[k].pts += da;
                P[j].pts += db;
                push(k, { t: 'opp', i: j });
                push(j, { t: 'opp', i: k });
                P[k].log.push({ r: rd.r, d: da, t: 'opp', o: players[j].id });
                P[j].log.push({ r: rd.r, d: db, t: 'opp', o: players[k].id });

                var ki = ffSet[players[k].id], ji = ffSet[players[j].id];

                if (!ki && !ji) {
                    if (da === 1 && db === 0) {
                        P[k].wins++; P[j].losses++;
                    } else if (da === 0 && db === 1) {
                        P[j].wins++; P[k].losses++;
                    } else if (da === 0.5 && db === 0.5) {
                        P[k].draws++; P[j].draws++;
                    } else if (da === 0 && db === 0) {
                        P[k].none++; P[j].none++;
                        warnings.push('第 ' + rd.r + ' 轮：' + players[k].id + ' 对 ' + players[j].id + ' 双方都没得分，按未弈处理（要算弃权请勾未弈）');
                    } else {
                        warnings.push('第 ' + rd.r + ' 轮：' + players[k].id + ' 对 ' + players[j].id +
                            ' 的分差是 ' + da + ' / ' + db + '，不像一局棋，请核对上轮积分');
                    }
                } else {
                    /* 这一局没下：勾了未弈的一方上面已按分差记过，
                     * 没勾的一方也照分差补记，免得白捡的一胜按整分算进对手分 */
                    if (!ki) { classifyNoPlay(k, da, false); }
                    if (!ji) { classifyNoPlay(j, db, false); }
                }
            }

            for (k = 0; k < n; k++) {
                if (seen[k]) { continue; }
                var kp = players[k].id;
                /* 没被配对 = 这轮不在对阵表上 → 记一次退赛轮数 */
                P[k].wd++;
                push(k, { t: 'wd' });
                P[k].log.push({ r: rd.r, d: 0, t: 'wd' });
            }
