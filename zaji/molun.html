<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>末轮计算器 - 连珠杂箱</title>
<meta name="description" content="瑞士制比赛末轮计算器：按相邻轮次积分分差识别每轮成绩，自定义对手分、中间对手分、对手分去1、对手分去2、胜局数的优先顺序，推算目标名次所需的胜平条件。">
<meta name="theme-color" content="#f6f2e9">
<link rel="stylesheet" href="../assets/style.css">
<style>
    /* ---------- 工具卡 ---------- */
    .ml-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 20px 22px 22px;
        margin: 0 0 20px;
        box-shadow: var(--shadow-sm);
    }

    .ml-card > h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 14px;
        letter-spacing: 0.04em;
        display: flex;
        align-items: baseline;
        gap: 8px;
    }

    .ml-card > h2 .ml-step {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--gold-deep);
        background: var(--gold-tint);
        border-radius: 999px;
        padding: 2px 9px;
        transform: translateY(-1px);
    }

    .ml-sub {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
        margin: 0 0 16px;
        font-family: var(--sans);
    }

    .ml-sub b { color: var(--ink-2); font-weight: 600; }


    .ml-field { display: flex; flex-direction: column; gap: 5px; }

    .ml-field > span {
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
    }

    .ml-input,
    .ml-select,
    .ml-textarea {
        width: 100%;
        font-family: var(--sans);
        font-size: 13px;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        line-height: 1.5;
        transition: border-color 0.16s ease, background-color 0.16s ease;
    }

    .ml-input:focus,
    .ml-select:focus,
    .ml-textarea:focus {
        outline: none;
        border-color: var(--gold);
        background: var(--surface);
    }

    .ml-textarea {
        min-height: 120px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.8;
    }

    .ml-btn {
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1;
        padding: 8px 15px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink-2);
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, background-color 0.16s ease;
        white-space: nowrap;
    }

    .ml-btn:hover { border-color: var(--gold); color: var(--gold-deep); background: var(--gold-tint); }

    .ml-btn.is-primary {
        background: var(--gold);
        border-color: var(--gold);
        color: #fffdf7;
    }

    .ml-btn.is-primary:hover { background: var(--gold-deep); border-color: var(--gold-deep); color: #fffdf7; }

    .ml-btn.is-quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .ml-btn.is-quiet:hover { color: var(--gold-deep); background: var(--gold-tint); }

    .ml-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .ml-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 14px;
    }

    .ml-toolbar .ml-spacer { flex: 1; }

    .ml-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
    }

    .ml-bar .ml-spacer { flex: 1; }

    .ml-note {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--muted);
    }

    .ml-note b { color: var(--ink-2); font-weight: 600; }

    /* ---------- 轻提示 ---------- */
    .ml-flash {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%) translateY(10px);
        z-index: 90;
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        font-size: 13px;
        letter-spacing: 0.02em;
        box-shadow: var(--shadow-md);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .ml-flash.is-on { opacity: 0.95; transform: translateX(-50%) translateY(0); }

    /* ---------- 破同分 ---------- */
    .ml-tb { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

    .ml-tb li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        font-family: var(--sans);
        font-size: 13.5px;
        transition: opacity 0.16s ease, border-color 0.16s ease;
    }

    .ml-tb li.is-off { opacity: 0.42; }
    .ml-tb li.is-drag { border-color: var(--gold); background: var(--gold-tint); }

    .ml-tb .ml-grip {
        cursor: grab;
        color: var(--faint);
        font-size: 15px;
        letter-spacing: -2px;
        user-select: none;
    }

    .ml-tb .ml-tb-rank {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--gold-deep);
        width: 16px;
        text-align: center;
    }

    .ml-tb .ml-tb-name { flex: 1; }
    .ml-tb .ml-tb-hint { color: var(--muted); font-size: 11.5px; }

    .ml-move {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-3);
        border-radius: 6px;
        width: 24px;
        height: 24px;
        line-height: 1;
        cursor: pointer;
        font-size: 12px;
        padding: 0;
    }

    .ml-move:hover { border-color: var(--gold); color: var(--gold-deep); }
    .ml-move:disabled { opacity: 0.3; cursor: default; }

    .ml-check {
        width: 15px;
        height: 15px;
        accent-color: var(--gold-deep);
        cursor: pointer;
        margin: 0;
        flex: none;
    }

    /* ---------- 轮次页签 ---------- */
    .ml-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 14px;
    }

    .ml-tab {
        font-family: var(--sans);
        font-size: 12.5px;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink-3);
        cursor: pointer;
        line-height: 1.4;
        transition: all 0.16s ease;
    }

    .ml-tab:hover { border-color: var(--gold); color: var(--gold-deep); }

    .ml-tab.is-on {
        background: var(--ink-2);
        border-color: var(--ink-2);
        color: var(--paper);
    }

    .ml-tab .ml-dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold);
        margin-left: 5px;
        transform: translateY(-1px);
    }

    .ml-tab.is-on .ml-dot { background: #e2c07d; }

    .ml-rounds {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -4px 0 16px;
        font-family: var(--sans);
        font-size: 12px;
        color: var(--ink-3);
    }

    .ml-rounds b { color: var(--ink-2); font-weight: 600; }
    .ml-rounds .ml-move { width: 24px; height: 24px; font-size: 13px; }

    /* ---------- 表格 ---------- */
    .ml-table-wrap {
        overflow: auto;
        max-height: 60vh;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--surface);
    }

    table.ml-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--sans);
        font-size: 13px;
        white-space: nowrap;
    }

    .ml-table th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--paper-deep);
        color: var(--ink-3);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
    }

    .ml-table td {
        padding: 3px 10px;
        border-top: 1px solid var(--line-soft);
        color: var(--ink-2);
    }

    .ml-table tbody tr:nth-child(even) { background: rgba(239, 232, 217, 0.3); }
    .ml-table tbody tr:hover { background: var(--gold-tint); }

    .ml-table .c-num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .ml-table .c-score { font-variant-numeric: tabular-nums; }
    .ml-table .c-delta { font-variant-numeric: tabular-nums; color: var(--ink-3); }
    .ml-table .c-delta.is-win { color: var(--win); font-weight: 600; }
    .ml-table .c-delta.is-draw { color: var(--draw); }
    .ml-table .c-delta.is-bad { color: #b3261e; font-weight: 600; }

    .ml-table input.ml-cell {
        width: 66px;
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 3px 7px;
        text-align: right;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        transition: border-color 0.14s ease, background-color 0.14s ease;
    }

    .ml-table input.ml-cell::placeholder { color: var(--faint); }
    .ml-table input.ml-cell.is-fixed {
        color: var(--muted);
        background: transparent;
        border-color: transparent;
        cursor: default;
    }

    .ml-table input.ml-cell:hover { border-color: var(--gold); }
    .ml-table input.ml-cell:focus { outline: none; border-color: var(--gold); background: #fffdf9; box-shadow: 0 0 0 3px rgba(176, 141, 87, 0.12); }
    .ml-table input.ml-cell.is-bad { border-color: #d99; background: #fdf3f2; }
    .ml-table input.ml-cell[data-opp] { text-align: center; width: 62px; }
    .ml-table input.ml-cell[data-pre] { text-align: center; width: 72px; }

    /* 数字列跟输入框一起居中对齐 */
    .ml-table th.c-score { text-align: center; padding-right: 0; }
    .ml-table .c-delta { text-align: center; padding-right: 0; font-size: 13px; }

    .ml-table tr.is-bye td { color: var(--ink-3); }
    .ml-table .c-tag {
        font-size: 10.5px;
        color: var(--gold-deep);
        background: var(--gold-tint);
        border-radius: 4px;
        padding: 1px 5px;
        margin-left: 4px;
    }

    /* ---------- 提示 ---------- */
    .ml-hint {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--muted);
        padding: 8px 12px;
        background: var(--surface-2);
        border: 1px dashed var(--line);
        border-radius: 8px;
        margin: 12px 0 0;
    }

    .ml-hint.is-warn { color: #8a3a34; background: #fbf1ef; border-color: #e6c6c0; }
    .ml-hint b { color: inherit; }

    .ml-empty {
        text-align: center;
        padding: 34px 16px;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 2;
        border: 1px dashed var(--line);
        border-radius: 10px;
        background: var(--surface-2);
    }

    .ml-empty .ml-btn { margin-top: 10px; }

    .ml-paste { margin: 0 0 14px; }
    .ml-paste[hidden] { display: none; }

    /* ---------- 名次表 ---------- */
    .ml-stand th.is-tb, .ml-stand td.is-tb { text-align: right; font-variant-numeric: tabular-nums; }
    .ml-stand td.is-pts { font-weight: 600; color: var(--ink); text-align: right; }
    .ml-stand tr.is-cut td { background: rgba(176, 141, 87, 0.1); }
    .ml-stand tr.is-target td { background: var(--gold-tint); }

    .ml-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 10px;
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
    }

    /* ---------- 推算 ---------- */
    .ml-solve-grid {
        display: grid;
        grid-template-columns: minmax(150px, 1.4fr) minmax(90px, 0.7fr) auto;
        gap: 12px;
        align-items: end;
    }

    .ml-result { margin-top: 16px; }

    .ml-banner {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.8;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface-2);
    }

    .ml-banner.is-ok { border-color: #c6dcc9; background: #f1f7f2; color: #2f5a3a; }
    .ml-banner.is-no { border-color: #e8cdc8; background: #fbf2f0; color: #8a3a34; }

    .ml-case {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        margin-top: 10px;
        overflow: hidden;
    }

    .ml-case > .ml-case-head {
        padding: 11px 14px;
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.85;
        color: var(--ink-2);
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 9px;
    }

    .ml-case.is-empty { background: transparent; }

    .ml-case .ml-case-head .ml-case-line { color: var(--ink-2); }
    .ml-case.is-empty .ml-case-head .ml-case-line { color: var(--muted); }

    .ml-case .ml-badge {
        font-size: 11px;
        font-family: var(--sans);
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: var(--surface);
    }

    .ml-case .ml-badge.is-win { color: var(--win); border-color: #e2c3bd; }
    .ml-case .ml-badge.is-draw { color: var(--draw); }
    .ml-case .ml-badge.is-loss { color: var(--loss); border-color: #c7d6c9; }

    .ml-case ul {
        margin: 0;
        padding: 0 16px 12px 34px;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 2;
        color: var(--ink-2);
    }

    .ml-case li::marker { color: var(--gold); }
    .ml-case .ml-cond-none { color: var(--muted); list-style: none; margin-left: -16px; }
    .ml-case .ml-cond-tag { color: var(--faint); font-size: 11.5px; margin-left: 6px; }

    @media (max-width: 640px) {
        .ml-bar { flex-wrap: wrap; }
        .ml-bar .ml-spacer { display: none; }
        .ml-bar .ml-note { flex: 1 0 100%; }
        .ml-card { padding: 16px 14px 18px; border-radius: 14px; }
        .ml-solve-grid { grid-template-columns: 1fr; }
        .ml-toolbar .ml-spacer { display: none; }
        .ml-tb .ml-tb-hint { display: none; }
        .ml-table-wrap { max-height: 56vh; }
    }
</style>
</head>

<div class="container">

    <div id="site-header"></div>

    <main>

        <header class="page-head">
            <p class="eyebrow">杂技</p>
            <h1 class="page-title">末轮计算器</h1>
            <p class="page-desc">每轮只填成绩单上的上轮积分和对手编号，得分由相邻两轮相减得出；破同分顺序随你排，算出末轮要什么结果才能进目标名次。</p>

        <div class="ml-bar">

            <div class="ml-result" id="solve-host"></div>
        </section>

        <p class="back-link"><a href="../zaji.html">← 返回杂技</a> · <a href="../index.html">返回首页</a></p>

    </main>

</div>

<script id="ml-engine">
/*
 * 末轮计算器 · 引擎（通用版）
 * ------------------------------------------------------------
 * 口径约定：
 *   每轮只认「上轮积分」（该轮成绩单上的积分列），
 *   本轮得分 = 下一轮的上轮积分 − 本轮的上轮积分。
 *   不读任何「胜/负」字样，胜负由分差反推，避免识别结果列出错。
 *
 * 数据：
 *   state = {
 *     totalRounds: 7,
 *     players: [{ id, name, unit }],
 *     rounds: [{ r: 3, pre: {1: 2, 2: 1.5}, opps: {1: 2, 2: 1}, ff: [3] }],
 *     withdrawn: { 33: 6 },          // 编号 -> 从第几轮起退赛
 *     tiebreaks: ['buch', 'med', 'wins']
 *   }
 *
 * 破同分项：积分永远是第一顺位，其后按 tiebreaks 顺序逐项比较。
 */
(function (root, factory) {
    if (typeof module === 'object' && module && module.exports) {
        module.exports = factory();
    } else {
        root.ML = factory();
    }
}(typeof self !== 'undefined' ? self : this, function () {
    'use strict';

    var CFG = {
        byePoint: 1,          // 轮空得几分
        byeAsWin: false,      // 轮空算不算胜局数
        ffWinAsWin: false,    // 对手弃权白捡的一胜算不算胜局数
        ffSign: -1,           // 自身弃权的虚拟分调整方向
        noneAsHalf: true,     // 未弈按和棋计入虚拟分
        medianMode: 'both',   // both = 去头去尾，high = 只去最高
        byeBuch: 'half'       // 轮空在对手分里按 total×0.5 的虚拟对手
    };

    var TB_DEFS = [
        { key: 'buch', name: '对手分', hint: '全部对手的积分之和' },
        { key: 'med', name: '中间对手分', hint: '对手分去掉最高、最低各一个' },
        { key: 'cut1', name: '对手分去1', hint: '对手分去掉一个最低的' },
        { key: 'cut2', name: '对手分去2', hint: '对手分去掉两个最低的' },
        { key: 'wins', name: '胜局数', hint: '真正下赢的盘数，不含轮空与对手弃权' }
    ];

    var DEFAULT_TIEBREAK = ['buch', 'med', 'wins'];

    function num(v) {
        if (v === '' || v == null) { return null; }
        var x = Number(v);
        return isFinite(x) ? x : null;
    }

    function half(v) { return Math.round(v * 2) / 2; }

    function tbKeys(state) {
        var k = (state.tiebreaks || []).filter(function (x) {
            return TB_DEFS.some(function (d) { return d.key === x; });
        });
        return k.length ? k : DEFAULT_TIEBREAK.slice();
    }

    function normalizeTiebreaks(list) {
        var out = [];
        (list || []).forEach(function (k) {
            if (k && out.indexOf(k) < 0 && TB_DEFS.some(function (d) { return d.key === k; })) {
                out.push(k);
            }
        });
        return out;
    }

    /* ---------------- 基础累计 ---------------- */

    function build(state, opt) {
        opt = opt || {};
        var upto = opt.upto == null ? Infinity : opt.upto;
        var total = Math.max(1, Number(state.totalRounds) || 9);
        var players = (state.players || []).slice().sort(function (a, b) { return a.id - b.id; });
        var n = players.length;
        var index = {};
        players.forEach(function (p, i) { index[p.id] = i; });

        var P = [];
        for (var i = 0; i < n; i++) {
            P.push({
                pts: 0, wins: 0, draws: 0, losses: 0,
                ff: 0, oppFF: 0, byes: 0, none: 0, wd: 0,
                slots: [], log: []
            });
        }

        var withdrawn = state.withdrawn || {};
        var warnings = [];

        var allRounds = (state.rounds || []).filter(function (rd) {
            if (!rd) { return false; }
            return Object.keys(rd.pre || {}).length > 0 ||
                   Object.keys(rd.opps || {}).length > 0 ||
                   (rd.ff || []).length > 0;
        }).sort(function (a, b) { return a.r - b.r; });

        var preAt = {};
        allRounds.forEach(function (rd) { preAt[rd.r] = rd.pre || {}; });

        /* 第 r 轮开赛前的累计分（即这一轮成绩单上的「上轮积分」）；第 1 轮一律 0 */
        function beforeOf(r, pid) {
            var m = preAt[r];
            if (!m) { return r === 1 ? 0 : null; }
            var v = num(m[pid]);
            if (v == null) { return r === 1 ? 0 : null; }
            return v;
        }

        /* 只有相邻两轮都有上轮积分，才推得出这一轮的得分 */
        var rounds = allRounds.filter(function (rd) {
            if (rd.r > upto) { return false; }
            for (var q = 0; q < n; q++) {
                var qid = players[q].id;
                if (beforeOf(rd.r, qid) != null && beforeOf(rd.r + 1, qid) != null) { return true; }
            }
            return false;
        });

        rounds.forEach(function (rd) {
            var opps = rd.opps || {};
            var ffSet = {};
            (rd.ff || []).forEach(function (id) { ffSet[id] = 1; });

            var delta = [], has = [], op = [], k;
            for (k = 0; k < n; k++) {
                var pid = players[k].id;
                var b0 = beforeOf(rd.r, pid);
                var b1 = beforeOf(rd.r + 1, pid);
                has[k] = b0 != null && b1 != null;
                delta[k] = has[k] ? half(b1 - b0) : 0;
                var o = opps[pid];
                op[k] = (o == null || o === '') ? null : (o === 'bye' ? 'bye' : Number(o));
            }

            var seen = {}, paired = {};

            function push(i2, s) { P[i2].slots.push(s); }

            /* 弃权：只标本轮确实参赛的人，配对时据此只计积分不计胜局 */
            for (k = 0; k < n; k++) {
                if (!ffSet[players[k].id]) { continue; }
                if (!has[k] && op[k] == null) { continue; }
                P[k].ff++;
                P[k].losses++;
            }

            for (k = 0; k < n; k++) {
                if (paired[k]) { continue; }
                var oid = op[k];

                /* 只有显式标 bye 才算轮空；对手留空视为没录对手，对手分记 0 */
                if (has[k] && oid === 'bye') {
                    paired[k] = true;
                    seen[k] = 1;
                    P[k].pts += delta[k];
                    P[k].byes++;
                    push(k, { t: 'bye' });
                    P[k].log.push({ r: rd.r, d: delta[k], t: 'bye' });
                    continue;
                }
                if (oid == null) {
                    /* 对手没录：分数照算，对手分槽位记 0 */
                    if (!has[k]) { continue; }
                    paired[k] = true; seen[k] = 1;
                    P[k].pts += delta[k];
                    P[k].none++;
                    push(k, { t: 'none' });
                    P[k].log.push({ r: rd.r, d: delta[k], t: 'none' });
                    continue;
                }

                var j = index[oid];
                if (j == null) {
                    warnings.push('第 ' + rd.r + ' 轮：' + players[k].id + ' 号对手 ' + oid + ' 不在名单');
                    paired[k] = true; seen[k] = 1;
                    P[k].pts += delta[k];
                    P[k].none++;
                    push(k, { t: 'none' });
                    continue;
                }
                if (j === k) { continue; }

                paired[k] = true; paired[j] = true;
                seen[k] = 1; seen[j] = 1;

                var da = delta[k], db = delta[j];
                P[k].pts += da;
                P[j].pts += db;
                push(k, { t: 'opp', i: j });
                push(j, { t: 'opp', i: k });
                P[k].log.push({ r: rd.r, d: da, t: 'opp', o: players[j].id });
                P[j].log.push({ r: rd.r, d: db, t: 'opp', o: players[k].id });

                var ki = ffSet[players[k].id], ji = ffSet[players[j].id];

                if (!ki && !ji) {
                    if (da === 1 && db === 0) {
                        P[k].wins++; P[j].losses++;
                    } else if (da === 0 && db === 1) {
                        P[j].wins++; P[k].losses++;
                    } else if (da === 0.5 && db === 0.5) {
                        P[k].draws++; P[j].draws++;
                    } else if (da === 0 && db === 0) {
                        P[k].none++; P[j].none++;
                        warnings.push('第 ' + rd.r + ' 轮：' + players[k].id + ' 对 ' + players[j].id + ' 双方都没得分，按未弈处理');
                    } else {
                        warnings.push('第 ' + rd.r + ' 轮：' + players[k].id + ' 对 ' + players[j].id +
                            ' 的分差是 ' + da + ' / ' + db + '，不像一局棋，请核对上轮积分');
                    }
                } else if (ki && !ji) {
                    P[j].oppFF++;
                } else if (!ki && ji) {
                    P[k].oppFF++;
                }
            }

            for (k = 0; k < n; k++) {
                if (seen[k]) { continue; }
                var kp = players[k].id;
                if (withdrawn[kp] != null && rd.r >= withdrawn[kp]) {
                    P[k].wd++;
                    push(k, { t: 'wd' });
                    P[k].log.push({ r: rd.r, d: 0, t: 'wd' });
                } else {
                    P[k].none++;
                    push(k, { t: 'none' });
                    P[k].log.push({ r: rd.r, d: 0, t: 'none' });
                }
            }
        });

        return {
            players: players, index: index, n: n, P: P,
            total: total, warnings: warnings,
            withdrawnOf: withdrawn,
            lastRound: rounds.length ? rounds[rounds.length - 1].r : 0
        };
    }

    /* 算别人对手分时，这个人算几分 */
    function vsOf(b, i) {
        var P = b.P[i], pid = b.players[i].id;
        var wd = (b.withdrawnOf ? b.withdrawnOf[pid] : null);
        if (wd != null && P.wd > 0) { return 0; }
        var v = P.pts
            + CFG.ffSign * 0.5 * (P.ff + P.wd)
            + 0.5 * (P.byes + P.oppFF);
        if (CFG.noneAsHalf) { v += 0.5 * P.none; }
        return v;
    }

    function slotValueOf(b, s, vs) {
        if (s.t === 'bye') { return CFG.byeBuch === 'zero' ? 0 : b.total * 0.5; }
        if (s.t === 'opp') { return s.i >= 0 ? vs[s.i] : 0; }
        return 0;
    }

    function scoreSet(b, i, vs) {
        var vals = b.P[i].slots.map(function (s) { return slotValueOf(b, s, vs); });
        return vals;
    }

    function tbFromVals(vals) {
        var sum = 0, i;
        for (i = 0; i < vals.length; i++) { sum += vals[i]; }
        var sorted = vals.slice().sort(function (a, b) { return a - b; });
        var len = sorted.length;
        var cut1 = len >= 1 ? sum - sorted[0] : sum;
        var cut2 = len >= 2 ? sum - sorted[0] - sorted[1] : cut1;
        var med;
        if (len > 2) {
            med = sum - sorted[0] - sorted[len - 1];
            if (CFG.medianMode === 'high') { med = sum - sorted[len - 1]; }
        } else {
            med = sum;
        }
        return { buch: sum, med: med, cut1: cut1, cut2: cut2, vals: vals };
    }

    /* 完整成绩表 */
    function standings(state, opt) {
        opt = opt || {};
        var b = build(state, opt);
        var n = b.n, P = b.P;
        var vs = [], i;
        for (i = 0; i < n; i++) { vs.push(vsOf(b, i)); }

        var rows = [];
        for (i = 0; i < n; i++) {
            var tb = tbFromVals(scoreSet(b, i, vs));
            var wins = P[i].wins
                + (CFG.byeAsWin ? P[i].byes : 0)
                + (CFG.ffWinAsWin ? P[i].oppFF : 0);
            rows.push({
                i: i,
                id: b.players[i].id,
                name: b.players[i].name,
                unit: b.players[i].unit || '',
                pts: P[i].pts,
                buch: tb.buch,
                med: tb.med,
                cut1: tb.cut1,
                cut2: tb.cut2,
                wins: wins,
                byes: P[i].byes,
                ff: P[i].ff,
                wd: P[i].wd,
                vs: vs[i],
                log: P[i].log
            });
        }

        var keys = tbKeys(state);

        function cmp(a, c) {
            if (a.pts !== c.pts) { return c.pts - a.pts; }
            for (var q = 0; q < keys.length; q++) {
                var k = keys[q];
                if (Math.abs(c[k] - a[k]) > 1e-9) { return c[k] - a[k]; }
            }
            return a.id - c.id;
        }

        rows.sort(cmp);

        /* 先找并列组，组内所有人同分同名次 */
        function sameRow(a, b) {
            if (a.pts !== b.pts) { return false; }
            for (var q = 0; q < keys.length; q++) {
                if (Math.abs(a[keys[q]] - b[keys[q]]) > 1e-9) { return false; }
            }
            return true;
        }
        var g = 0;
        while (g < rows.length) {
            var end = g + 1;
            while (end < rows.length && sameRow(rows[g], rows[end])) { end++; }
            for (var m2 = g; m2 < end; m2++) {
                rows[m2].rank = g + 1;
                rows[m2].tie = (end - g) > 1;
            }
            g = end;
        }

        return {
            rows: rows, b: b, n: n, index: b.index,
            acc: P, players: b.players, keys: keys,
            warnings: b.warnings,
            lastRound: b.lastRound
        };
    }

    /* ---------------- 末轮求解 ---------------- */

    var CODES = ['1-0', '1/2', '0-1'];

    function solve(state, targetId, targetRank, opt) {
        opt = opt || {};
        var MAXG = opt.maxGames || 10;
        var total = Math.max(1, Number(state.totalRounds) || 9);
        var base = standings(state, { upto: total - 1 });
        var n = base.n, index = base.index;
        var t = index[targetId];
        if (t === undefined) { return { error: '名单里没有这个选手' }; }

        var last = null;
        (state.rounds || []).forEach(function (rd) { if (rd.r === total) { last = rd; } });
        if (!last) { return { error: '缺第 ' + total + ' 轮的对阵' }; }

        var opps = last.opps || {};
        var keys = base.keys;
        var rowsByI = [];
        base.rows.forEach(function (r) { rowsByI[r.i] = r; });

        var bp = [], bb = [], bvs = [];
        for (var i = 0; i < n; i++) {
            bp[i] = base.acc[i].pts;
            bb[i] = rowsByI[i].buch;
            bvs[i] = rowsByI[i].vs;
        }

        var lastOpp = [], lastKind = [], paired = {};
        for (i = 0; i < n; i++) { lastOpp[i] = -1; lastKind[i] = 'none'; }

        var games = [];
        for (i = 0; i < n; i++) {
            var o = opps[base.players[i].id];
            if (o === 'bye') { lastKind[i] = 'bye'; continue; }
            var oid = num(o);
            if (oid == null || paired[i]) { continue; }
            var j = index[oid];
            if (j == null || j === i || paired[j]) { continue; }
            paired[i] = paired[j] = true;
            lastOpp[i] = j; lastOpp[j] = i;
            lastKind[i] = 'opp'; lastKind[j] = 'opp';
            games.push({ a: i, b: j });
        }

        var facedBy = [];
        for (i = 0; i < n; i++) { facedBy.push([]); }
        for (i = 0; i < n; i++) {
            base.b.P[i].slots.forEach(function (s) {
                if (s.t === 'opp' && s.i >= 0) { facedBy[s.i].push(i); }
            });
        }

        var pT0 = bp[t] + (lastKind[t] === 'bye' ? CFG.byePoint : 0);
        var pool = [], inPool = {};
        for (i = 0; i < n; i++) {
            if (i !== t && bp[i] + 1 >= pT0) { pool.push(i); inPool[i] = 1; }
        }
        inPool[t] = 1;

        var rel = games.filter(function (g) { return inPool[g.a] || inPool[g.b]; });
        rel.sort(function (x, y) {
            var mx = Math.max(bp[x.a], bp[x.b]), my = Math.max(bp[y.a], bp[y.b]);
            if (my !== mx) { return my - mx; }
            return Math.min(bp[x.a], bp[x.b]) - Math.min(bp[y.a], bp[y.b]);
        });
        var enumGames = rel.slice(0, MAXG);
        var m = enumGames.length;

        var d = [], accd = [], dw = [];
        for (i = 0; i < n; i++) { d[i] = 0; accd[i] = 0; dw[i] = 0; }
        for (i = 0; i < n; i++) { if (lastKind[i] === 'bye') { d[i] += CFG.byePoint; } }

        function vsNow(x) { return bvs[x] + d[x] + (lastKind[x] === 'bye' ? 0.5 : 0); }

        function slotValue(i2) {
            if (lastKind[i2] === 'bye') { return total * 0.5; }
            return lastOpp[i2] >= 0 ? vsNow(lastOpp[i2]) : 0;
        }

        function deltaOf(code) {
            if (code === '1-0') { return [1, 0, 1, 0]; }
            if (code === '0-1') { return [0, 1, 0, 1]; }
            return [0.5, 0.5, 0, 0];
        }

        function applyGame(g, code, sign) {
            var dd = deltaOf(code);
            var da = dd[0] * sign, db = dd[1] * sign;
            d[g.a] += da; d[g.b] += db;
            dw[g.a] += dd[2] * sign; dw[g.b] += dd[3] * sign;
            var la = facedBy[g.a], lb = facedBy[g.b], k;
            for (k = 0; k < la.length; k++) { accd[la[k]] += da; }
            for (k = 0; k < lb.length; k++) { accd[lb[k]] += db; }
            tbCache = {};
        }

        function ptsOf(x) { return bp[x] + d[x]; }
        function buchOf(x) { return bb[x] + accd[x] + slotValue(x); }
        function winsOf(x) { return rowsByI[x].wins + dw[x]; }

        function valsOf(x) {
            var arr = [];
            base.b.P[x].slots.forEach(function (s) {
                if (s.t === 'opp') { arr.push(s.i >= 0 ? vsNow(s.i) : 0); }
                else if (s.t === 'bye') { arr.push(CFG.byeBuch === 'zero' ? 0 : total * 0.5); }
                else { arr.push(0); }
            });
            if (lastKind[x] === 'opp' || lastKind[x] === 'bye') { arr.push(slotValue(x)); }
            return arr;
        }

        var tbCache = {};
        function tbVal(x, key) {
            var cacheKey = x + '|' + key;
            var hit = tbCache[cacheKey];
            if (hit !== undefined) { return hit; }
            var v = tbFromVals(valsOf(x))[key];
            tbCache[cacheKey] = v;
            return v;
        }

        function better(x, pT, bT, wT) {
            var px = ptsOf(x);
            if (Math.abs(px - pT) > 1e-9) { return px > pT ? 1 : -1; }
            for (var q = 0; q < keys.length; q++) {
                var k = keys[q], a, b;
                if (k === 'buch') { a = buchOf(x); b = bT; }
                else if (k === 'wins') { a = winsOf(x); b = wT; }
                else { a = tbVal(x, k); b = tbVal(t, k); }
                if (Math.abs(a - b) > 1e-9) { return a > b ? 1 : -1; }
            }
            return 0;
        }

        function evaluate() {
            var pT = ptsOf(t), bT = buchOf(t), wT = winsOf(t);
            var betterCnt = 0, ties = 0;
            for (var k = 0; k < pool.length; k++) {
                var x = pool[k];
                if (ptsOf(x) < pT - 1e-9) { continue; }
                var r = better(x, pT, bT, wT);
                if (r > 0) { betterCnt++; }
                else if (r === 0) { ties++; }
            }
            return { rank: betterCnt + 1, ties: ties };
        }

        var pow3 = [1];
        for (i = 1; i <= m; i++) { pow3[i] = pow3[i - 1] * 3; }

        var okSet = {}, okCount = 0, totalCount = 0, tieCount = 0, cur = new Array(m);

        function rec(k) {
            if (k === m) {
                var key = 0;
                for (var q = 0; q < m; q++) { key += cur[q] * pow3[q]; }
                var r = evaluate();
                totalCount++;
                if (r.rank <= targetRank) {
                    okSet[key] = 1;
                    okCount++;
                    if (r.ties > 0) { tieCount++; }
                }
                return;
            }
            for (var c = 0; c < 3; c++) {
                applyGame(enumGames[k], CODES[c], 1);
                cur[k] = c;
                rec(k + 1);
                applyGame(enumGames[k], CODES[c], -1);
            }
        }
        rec(0);

        var gt = -1;
        for (i = 0; i < m; i++) {
            if (enumGames[i].a === t || enumGames[i].b === t) { gt = i; }
        }

        function allOk(pattern, holes) {
            var cnt = pow3[holes.length];
            if (cnt > 200000) { return false; }
            for (var z = 0; z < cnt; z++) {
                var zz = z, key = 0, hi = 0;
                for (var q = 0; q < m; q++) {
                    var v = pattern[q];
                    if (v < 0) {
                        v = Math.floor(zz / pow3[hi]) % 3;
                        hi++;
                    }
                    key += v * pow3[q];
                }
                if (!okSet[key]) { return false; }
            }
            return true;
        }

        function keyToPattern(key) {
            var p = [];
            for (var q = 0; q < m; q++) { p.push(Math.floor(key / pow3[q]) % 3); }
            return p;
        }

        function countLiterals(p) {
            var c = 0;
            for (var q = 0; q < m; q++) { if (p[q] >= 0 && q !== gt) { c++; } }
            return c;
        }

        var groups = [];
        if (okCount && okCount !== totalCount && gt >= 0) {
            var okKeys = Object.keys(okSet);
            if (okKeys.length > 1200) {
                var step = Math.ceil(okKeys.length / 1200);
                okKeys = okKeys.filter(function (k, idx) { return idx % step === 0; });
            }

            [0, 1, 2].forEach(function (v) {
                var out = [], seen = {};
                okKeys.forEach(function (k) {
                    var pat = keyToPattern(Number(k));
                    if (pat[gt] !== v) { return; }
                    var holes = [];
                    for (var q = 0; q < m; q++) {
                        if (q === gt || pat[q] < 0) { continue; }
                        var old = pat[q];
                        pat[q] = -1;
                        holes.push(q);
                        if (!allOk(pat, holes)) {
                            pat[q] = old;
                            holes.pop();
                        }
                    }
                    var sig = pat.join(',');
                    if (!seen[sig]) { seen[sig] = 1; out.push(pat); }
                });

                if (out.length <= 400) {
                    out = out.filter(function (p1) {
                        for (var b = 0; b < out.length; b++) {
                            var p2 = out[b];
                            if (p2 === p1) { continue; }
                            if (countLiterals(p2) >= countLiterals(p1)) { continue; }
                            var covers = true;
                            for (var q = 0; q < m; q++) {
                                if (p2[q] === -1) { continue; }
                                if (p2[q] !== p1[q]) { covers = false; break; }
                            }
                            if (covers) { return false; }
                        }
                        return true;
                    });
                }
                out.sort(function (x, y) { return countLiterals(x) - countLiterals(y); });

                if (!out.length) { return; }
                var code = CODES[v];
                var tOutcome = code === '1/2' ? 'draw'
                    : (code === '1-0' ? (enumGames[gt].a === t ? 'win' : 'loss')
                        : (enumGames[gt].b === t ? 'win' : 'loss'));

                groups.push({
                    res: code,
                    tOutcome: tOutcome,
                    terms: out.slice(0, 12).map(function (p) {
                        var parts = [];
                        for (var q = 0; q < m; q++) {
                            if (p[q] < 0 || q === gt) { continue; }
                            parts.push({
                                a: base.players[enumGames[q].a].id,
                                b: base.players[enumGames[q].b].id,
                                code: CODES[p[q]]
                            });
                        }
                        return parts;
                    })
                });
            });

            var order = { win: 0, draw: 1, loss: 2 };
            groups.sort(function (x, y) { return order[x.tOutcome] - order[y.tOutcome]; });
        }

        var rankNow = 0;
        for (i = 0; i < base.rows.length; i++) {
            if (base.rows[i].i === t) { rankNow = base.rows[i].rank; }
        }

        return {
            target: { id: base.players[t].id, name: base.players[t].name, pts: bp[t], rank: rankNow },
            totalRounds: total,
            keys: keys,
            games: m,
            counts: { all: totalCount, ok: okCount, ties: tieCount },
            always: okCount === totalCount && totalCount > 0,
            never: okCount === 0,
            groups: groups,
            assumes: '未列入条件的末轮对局，按和棋计算'
        };
    }

    /* ---------------- 文本解析 ---------------- */

    var UNIT_HINTS = ['组', '队', '学校', '小学', '中学', '大学', '学院', '棋院', '俱乐部', '中心', '协会', '公司', '单位', '班'];

    function looksUnit(s) {
        return UNIT_HINTS.some(function (w) { return s.indexOf(w) >= 0; });
    }

    /*
     * 一行一人：编号 姓名 单位 上轮积分 对手编号
     * 姓名从第二轮起可省，单位可省，对手编号也可省；轮空写 bye。
     * 末尾连续的数字里，最后一个当对手编号，倒数第二个当上轮积分。
     */
    function parseLine(line, ids) {
        var s = String(line || '').replace(/[|｜]/g, ' ').replace(/\s+/g, ' ').trim();
        if (!s) { return null; }

        var m = s.match(/^(\d{1,4})[.、)．]?\s*(.*)$/);
        if (!m) { return null; }
        var id = Number(m[1]);
        var rest = (m[2] || '').trim();
        if (!rest) { return { id: id, name: '', unit: '', pre: null, opp: null }; }

        var tokens = rest.split(' ');
        var nums = [], bye = false;
        while (tokens.length) {
            var last = tokens[tokens.length - 1];
            if (/^\d+(?:\.\d+)?$/.test(last)) { nums.unshift(Number(tokens.pop())); }
            else if (/^(bye|轮空)$/i.test(last)) { bye = true; tokens.pop(); }
            else { break; }
        }

        var pre = null, opp = null;
        if (bye) {
            opp = 'bye';
            if (nums.length) { pre = nums[nums.length - 1]; }
        } else if (nums.length >= 2) {
            pre = nums[nums.length - 2];
            opp = nums[nums.length - 1];
        } else if (nums.length === 1) {
            pre = nums[0];
        }

        /* 名单已知时，认不出的对手编号宁可留空 */
        if (opp != null && opp !== 'bye' && ids && Object.keys(ids).length && ids[opp] == null) {
            opp = null;
        }

        var text = tokens.join(' ');
        var name = '', unit = '';
        var latin = text.match(/[A-Za-z][A-Za-z.\-']*/g) || [];
        var cjk = text.match(/[\u4e00-\u9fa5·]{2,}/g) || [];

        if (cjk.length) {
            var unitParts = cjk.filter(looksUnit);
            if (unitParts.length) {
                unit = unitParts[unitParts.length - 1];
                name = cjk.filter(function (x) { return x !== unit; })[0] || '';
            } else {
                name = cjk[0];
                unit = cjk.slice(1).join('');
            }
        }
        if (latin.length && !name) { name = latin.join(' '); }

        return { id: id, name: name, unit: unit, pre: pre, opp: opp };
    }

    function parseText(text, knownPlayers) {
        var ids = {};
        (knownPlayers || []).forEach(function (p) { ids[p.id] = p; });
        var out = [], bad = [];
        String(text || '').split(/\r?\n/).forEach(function (line) {
            if (!line.trim()) { return; }
            var r = parseLine(line, ids);
            if (r) { out.push(r); } else { bad.push(line); }
        });
        return { rows: out, bad: bad };
    }

    return {
        CFG: CFG,
        TB_DEFS: TB_DEFS,
        DEFAULT_TIEBREAK: DEFAULT_TIEBREAK,
        tbKeys: tbKeys,
        normalizeTiebreaks: normalizeTiebreaks,
        build: build,
        standings: standings,
        solve: solve,
        parseText: parseText,
        parseLine: parseLine
    };
}));

</script>

<script>
(function () {
    'use strict';

    var ML = window.ML;
    var LS_KEY = 'molun_state_v2';

    var $ = function (s, r) { return (r || document).querySelector(s); };
    var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    function fmt(v) {
        if (v == null || v === '') { return ''; }
        var n = Math.round(Number(v) * 2) / 2;
        if (!isFinite(n)) { return ''; }
        return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    /* ---------------- 状态 ---------------- */

    function blank() {
        return {
            totalRounds: 7,
            byePoint: 1,
            tiebreaks: ML.DEFAULT_TIEBREAK.slice(),
            players: [],
            rounds: [],
            withdrawn: {}
        };
    }

    var state = load() || blank();
    var curRound = 1;

    function load() {
        try {
            var raw = localStorage.getItem(LS_KEY);
            if (!raw) { return null; }
            var s = JSON.parse(raw);
            if (!s || !Array.isArray(s.players)) { return null; }
            s.tiebreaks = ML.normalizeTiebreaks(s.tiebreaks);
            if (!s.tiebreaks.length) { s.tiebreaks = ML.DEFAULT_TIEBREAK.slice(); }
            return s;
        } catch (e) { return null; }
    }

    var saveTimer = 0;
    function save() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        }, 220);
    }

    function roundOf(r, create) {
        var rd = null;
        state.rounds.forEach(function (x) { if (x.r === r) { rd = x; } });
        if (!rd && create) {
            rd = { r: r, pre: {}, opps: {}, ff: [] };
            state.rounds.push(rd);
        }
        return rd;
    }

    function nameOf(p) { return p && p.name ? p.name : ('#' + (p ? p.id : '')); }

    /* 第 r 轮开赛前的累计分；第 1 轮是 0，没有就是 null */
    function preOf(id, r) {
        if (r === 1) { return 0; }
        var rd = roundOf(r);
        if (!rd || !rd.pre) { return null; }
        var v = rd.pre[id];
        if (v == null || v === '') { return null; }
        var n = Number(v);
        return isFinite(n) ? n : null;
    }

    /* 第 r 轮的得分 = 第 r+1 轮的上轮积分 − 第 r 轮的上轮积分 */
    function scoreOf(id, r) {
        var a = preOf(id, r), b = preOf(id, r + 1);
        if (a == null || b == null) { return null; }
        return Math.round((b - a) * 2) / 2;
    }

    /* 这一轮是否录过东西：上轮积分、对手、弃权任一有值就算录过 */
    function roundFilled(rd) {
        if (!rd) { return false; }
        return Object.keys(rd.pre || {}).length > 0 ||
               Object.keys(rd.opps || {}).length > 0 ||
               (rd.ff || []).length > 0;
    }

    function hasScores(r) {
        /* 整轮都清空了，就不能再拿相邻轮的积分差硬算成绩 */
        if (!roundFilled(roundOf(r))) { return false; }
        return state.players.some(function (p) { return scoreOf(p.id, r) != null; });
    }

    function lastPlayed() {
        var m = 0;
        for (var r = 1; r < state.totalRounds; r++) { if (hasScores(r)) { m = r; } }
        return m;
    }

    /* ---------------- 破同分排序 ---------------- */

    function renderTiebreak() {
        var host = $('#tb-list');
        var on = state.tiebreaks.slice();
        var off = ML.TB_DEFS.map(function (d) { return d.key; }).filter(function (k) { return on.indexOf(k) < 0; });

        host.innerHTML = on.map(function (k, idx) {
            var d = ML.TB_DEFS.filter(function (x) { return x.key === k; })[0];
            return '<li data-key="' + k + '" draggable="true" class="is-on">' +
                '<span class="ml-grip">⋮⋮</span>' +
                '<input type="checkbox" class="ml-check" checked data-toggle="' + k + '">' +
                '<span class="ml-tb-rank">' + (idx + 1) + '</span>' +
                '<span class="ml-tb-name">' + esc(d.name) + '</span>' +
                '<span class="ml-tb-hint">' + esc(d.hint) + '</span>' +
                '<button class="ml-move" data-up="' + k + '"' + (idx === 0 ? ' disabled' : '') + ' title="上移">↑</button>' +
                '<button class="ml-move" data-down="' + k + '"' + (idx === on.length - 1 ? ' disabled' : '') + ' title="下移">↓</button>' +
                '</li>';
        }).join('') + off.map(function (k) {
            var d = ML.TB_DEFS.filter(function (x) { return x.key === k; })[0];
            return '<li data-key="' + k + '" class="is-off">' +
                '<span class="ml-grip">·</span>' +
                '<input type="checkbox" class="ml-check" data-toggle="' + k + '">' +
                '<span class="ml-tb-rank">—</span>' +
                '<span class="ml-tb-name">' + esc(d.name) + '</span>' +
                '<span class="ml-tb-hint">' + esc(d.hint) + '</span>' +
                '</li>';
        }).join('');

        bindDrag(host);
    }

    var dragKey = null;

    function bindDrag(host) {
        $$('li', host).forEach(function (li) {
            li.addEventListener('dragstart', function (e) {
                if (!li.classList.contains('is-on')) { e.preventDefault(); return; }
                dragKey = li.dataset.key;
                li.classList.add('is-drag');
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', dragKey); } catch (err) {}
            });
            li.addEventListener('dragend', function () {
                li.classList.remove('is-drag');
                dragKey = null;
            });
            li.addEventListener('dragover', function (e) {
                if (!dragKey || !li.classList.contains('is-on')) { return; }
                e.preventDefault();
            });
            li.addEventListener('drop', function (e) {
                if (!dragKey) { return; }
                e.preventDefault();
                var to = li.dataset.key;
                if (to === dragKey) { return; }
                var arr = state.tiebreaks.slice();
                var from = arr.indexOf(dragKey);
                var dst = arr.indexOf(to);
                if (from < 0 || dst < 0) { return; }
                arr.splice(from, 1);
                arr.splice(dst, 0, dragKey);
                state.tiebreaks = arr;
                dragKey = null;
                save();
                renderTiebreak();
                refreshAll();
            });
        });
    }

    $('#tb-list').addEventListener('click', function (e) {
        var t = e.target;
        if (t.dataset.up) {
            var i = state.tiebreaks.indexOf(t.dataset.up);
            if (i > 0) {
                var a = state.tiebreaks.slice();
                a.splice(i - 1, 0, a.splice(i, 1)[0]);
                state.tiebreaks = a;
                save(); renderTiebreak(); refreshAll();
            }
        } else if (t.dataset.down) {
            var j = state.tiebreaks.indexOf(t.dataset.down);
            if (j >= 0 && j < state.tiebreaks.length - 1) {
                var b = state.tiebreaks.slice();
                b.splice(j + 1, 0, b.splice(j, 1)[0]);
                state.tiebreaks = b;
                save(); renderTiebreak(); refreshAll();
            }
        }
    });

    $('#tb-list').addEventListener('change', function (e) {
        var k = e.target.dataset.toggle;
        if (!k) { return; }
        var i = state.tiebreaks.indexOf(k);
        if (i >= 0) {
            state.tiebreaks.splice(i, 1);
        } else {
            state.tiebreaks.push(k);
        }
        if (!state.tiebreaks.length) {
            /* 全不选时留一个占位，避免排名退化成只看积分 */
            state.tiebreaks.push('buch');
        }
        save();
        renderTiebreak();
        refreshAll();
    });

    /* ---------------- 名单与轮数 ---------------- */

    function syncSetup() {
        var hint = $('#roster-hint');
        if (!state.players.length) {
            hint.textContent = '还没有名单，粘贴任意一轮的对阵表就会自动建出来。';
        } else {
            var units = {};
            state.players.forEach(function (p) { if (p.unit) { units[p.unit] = 1; } });
            hint.innerHTML = '共 <b>' + state.players.length + '</b> 人' +
                (Object.keys(units).length ? '，' + Object.keys(units).length + ' 个单位' : '') +
                '；已录 ' + lastPlayed() + ' 轮，总 ' + state.totalRounds + ' 轮。';
        }
        var rt = $('#round-total');
        if (rt) { rt.textContent = state.totalRounds; }
        var less = $('#btn-round-less');
        if (less) { less.disabled = state.totalRounds <= 2; }
    }

    function setTotalRounds(v) {
        v = Math.max(2, Math.min(30, v));
        state.totalRounds = v;
        if (curRound > v) { curRound = v; }
        save();
        renderTabs(); renderEntry(); syncSetup(); refreshAll();
    }

    $('#btn-round-more').addEventListener('click', function () {
        setTotalRounds(state.totalRounds + 1);
    });

    $('#btn-round-less').addEventListener('click', function () {
        var last = state.totalRounds;
        if (last <= 2) { return; }
        if (hasScores(last) && !confirm('第 ' + last + ' 轮已录成绩，减少一轮会丢掉这轮数据，继续？')) { return; }
        state.rounds = state.rounds.filter(function (rd) { return rd.r < last; });
        setTotalRounds(last - 1);
    });

    /* ---------------- 轮次页签 ---------------- */

    function renderTabs() {
        var host = $('#round-tabs');
        var html = '';
        for (var r = 1; r <= state.totalRounds; r++) {
            var on = r === curRound ? ' is-on' : '';
            var played = hasScores(r);
            html += '<button class="ml-tab' + on + '" data-round="' + r + '">第 ' + r + ' 轮' +
                (r === state.totalRounds ? '（末轮）' : '') +
                (played ? '<span class="ml-dot"></span>' : '') + '</button>';
        }
        host.innerHTML = html;
    }

    $('#round-tabs').addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('[data-round]') : null;
        if (!b) { return; }
        curRound = Number(b.dataset.round);
        renderTabs(); renderEntry();
    });

    /* ---------------- 录入表 ---------------- */

    function isLastRound() { return curRound === state.totalRounds; }

    function renderEntry() {
        var host = $('#entry-host');
        var hint = $('#entry-hint');
        hint.hidden = true;

        if (!state.players.length) {
            host.innerHTML = '<div class="ml-empty">还没有名单。<br>点「粘贴本轮」贴入任意一轮对阵表，' +
                '名单会按编号自动建立。' +
                '<br><button class="ml-btn" data-act="paste">粘贴本轮</button></div>';
            bindEmpty();
            return;
        }

        var rd = roundOf(curRound, true);
        var players = state.players.slice().sort(function (a, b) { return a.id - b.id; });
        var recorded = roundFilled(rd);
        var rows = players.map(function (p) {
            var pre = preOf(p.id, curRound);
            var sc = recorded ? scoreOf(p.id, curRound) : null;
            var opp = rd.opps[p.id];
            var cls = '', label = '';
            if (sc != null) {
                if (sc === 1) { label = '1'; cls = 'is-win'; }
                else if (sc === 0.5) { label = '½'; cls = 'is-draw'; }
                else if (sc === 0) { label = '0'; }
                else { label = fmt(sc); cls = 'is-bad'; }
            }
            var fixed = curRound === 1;
            /* 第 1 轮开赛前人人 0 分，不用填也不用显示 0，留空即「无输入」 */
            var preCell = fixed || pre == null ? '' : fmt(pre);
            return '<tr data-id="' + p.id + '">' +
                '<td class="c-num">' + p.id + '</td>' +
                '<td>' + esc(nameOf(p)) + '</td>' +
                '<td class="c-num">' + esc(p.unit || '') + '</td>' +
                '<td><input class="ml-cell' + (fixed ? ' is-fixed' : '') + '" data-pre="' + p.id +
                    '" inputmode="decimal" value="' + esc(preCell) + '"' +
                    (fixed ? ' readonly tabindex="-1"' : '') + ' placeholder="—"></td>' +
                '<td><input class="ml-cell" data-opp="' + p.id + '" value="' +
                    esc(opp === 'bye' ? 'bye' : (opp == null ? '' : opp)) + '" placeholder="—"></td>' +
                '<td class="c-delta ' + cls + '" data-delta="' + p.id + '">' + label + '</td>' +
                '<td style="text-align:center"><input type="checkbox" class="ml-check" data-ff="' + p.id +
                    '"' + ((rd.ff || []).indexOf(p.id) >= 0 ? ' checked' : '') + '></td>' +
                '</tr>';
        }).join('');

        host.innerHTML = '<div class="ml-table-wrap"><table class="ml-table">' +
            '<thead><tr>' +
            '<th>编号</th><th>姓名</th><th>单位</th>' +
            '<th class="c-score">上轮积分</th><th>对手编号</th><th class="c-score">得分</th><th>弃权</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table></div>';

        updateEntryHint();
    }

    function updateEntryHint() {
        var hint = $('#entry-hint');
        var rd = roundOf(curRound);
        if (!rd) { hint.hidden = true; return; }
        var preN = 0, filled = 0, dist = { '1': 0, '0.5': 0, '0': 0 }, bad = 0, byes = 0;
        var recorded = roundFilled(rd);
        state.players.forEach(function (p) {
            if (preOf(p.id, curRound) != null) { preN++; }
            var v = recorded ? scoreOf(p.id, curRound) : null;
            if (v == null) { return; }
            filled++;
            if (v === 1 || v === 0.5 || v === 0) { dist[String(v)]++; } else { bad++; }
            if (rd.opps[p.id] === 'bye') { byes++; }
        });

        var parts = [];
        if (curRound > 1) {
            parts.push('上轮积分已填 <b>' + preN + '</b> / ' + state.players.length + ' 人');
        }
        if (filled) {
            parts.push('得分：胜 ' + dist['1'] + '、和 ' + dist['0.5'] + '、负 ' + dist['0']);
        }
        if (byes) { parts.push('轮空 ' + byes + ' 人'); }
        if (bad) { parts.push('<b>' + bad + ' 人的分差不是 0、0.5 或 1，请核对上轮积分</b>'); }
        if (!filled && curRound > 1 && curRound < state.totalRounds && preN) {
            parts.push('第 ' + curRound + ' 轮的得分，要等第 ' + (curRound + 1) + ' 轮的上轮积分填进来才算得出');
        }
        if (curRound === state.totalRounds) {
            parts.push('末轮未赛，填上轮积分和对手编号即可');
        }
        if (!parts.length) { hint.hidden = true; return; }
        hint.innerHTML = parts.join('　·　');
        hint.hidden = false;
        hint.className = 'ml-hint' + (bad ? ' is-warn' : '');
    }

    var entryHost = $('#entry-host');

    entryHost.addEventListener('input', function (e) {
        var t = e.target;
        var rd = roundOf(curRound, true);

        if (t.dataset.pre !== undefined && t.dataset.pre !== '') {
            if (curRound === 1) { return; }
            var id = Number(t.dataset.pre);
            var raw = t.value.trim();
            if (raw === '') { delete rd.pre[id]; }
            else {
                var n = Number(raw);
                if (!isFinite(n)) { return; }
                rd.pre[id] = n;
            }
            updateDeltaCell(id);
            updateEntryHint();
            save();
            scheduleStand();
        } else if (t.dataset.opp !== undefined && t.dataset.opp !== '') {
            var oid = Number(t.dataset.opp);
            var ov = t.value.trim();
            if (ov === '') { delete rd.opps[oid]; }
            else if (/^(bye|轮空)$/i.test(ov)) { rd.opps[oid] = 'bye'; t.value = 'bye'; }
            else {
                var on = Number(ov);
                if (!isFinite(on)) { return; }
                rd.opps[oid] = on;
            }
            save();
            scheduleStand();
        }
    });

    entryHost.addEventListener('change', function (e) {
        var t = e.target;

        /* a 的对手是 b：b 那一行的对手编号自动补成 a，不必再输一遍 */
        if (t.dataset.opp !== undefined && t.dataset.opp !== '') {
            var a = Number(t.dataset.opp);
            var b = Number(t.value.trim());
            if (!isFinite(b) || a === b) { return; }
            if (!state.players.some(function (p) { return p.id === b; })) { return; }
            var rd = roundOf(curRound, true);
            if (Number(rd.opps[b]) === a) { return; }
            rd.opps[b] = a;
            var cell = entryHost.querySelector('[data-opp="' + b + '"]');
            if (cell) { cell.value = String(a); }
            save();
            scheduleStand();
            return;
        }

        if (t.dataset.ff !== undefined) {
            var rd2 = roundOf(curRound, true);
            var id = Number(t.dataset.ff);
            rd2.ff = rd2.ff || [];
            var i = rd2.ff.indexOf(id);
            if (t.checked && i < 0) { rd2.ff.push(id); }
            if (!t.checked && i >= 0) { rd2.ff.splice(i, 1); }
            save();
            scheduleStand();
        }
    });

    function updateDeltaCell(id) {
        var td = entryHost.querySelector('[data-delta="' + id + '"]');
        var inp = entryHost.querySelector('[data-pre="' + id + '"]');
        if (!td) { return; }
        var sc = scoreOf(id, curRound);
        if (sc == null) {
            td.textContent = '';
            td.className = 'c-delta';
            if (inp) { inp.classList.remove('is-bad'); }
            return;
        }
        var bad = sc < 0 || sc > 1 || Math.abs(sc * 2 - Math.round(sc * 2)) > 1e-9;
        td.textContent = sc === 1 ? '1' : (sc === 0.5 ? '½' : fmt(sc));
        td.className = 'c-delta ' + (bad ? 'is-bad' : (sc === 1 ? 'is-win' : (sc === 0.5 ? 'is-draw' : '')));
        if (inp) { inp.classList.toggle('is-bad', bad); }
    }

    function bindEmpty() {
        var b = entryHost.querySelector('[data-act="paste"]');
        if (b) { b.addEventListener('click', openCurrentPaste); }
    }

    /* ---------------- 粘贴 ---------------- */

    function openPaste(text) {
        var box = $('#paste-box');
        box.hidden = false;
        if (text != null) { $('#paste-text').value = text; }
        $('#paste-hint').textContent = '';
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('#paste-text').focus();
    }

    function openCurrentPaste() {
        openPaste(null);
    }

    $('#btn-paste').addEventListener('click', openCurrentPaste);

    $('#btn-close-paste').addEventListener('click', function () { $('#paste-box').hidden = true; });

    function applyPaste() {
        var text = $('#paste-text').value;
        if (!text.trim()) { return; }

        var first = ML.parseText(text, state.players);
        if (!first.rows.length) {
            $('#paste-hint').textContent = '没认出任何一行，检查是否以编号开头';
            return;
        }

        /* 名单按编号自动建立：没见过的新编号补进来，已有的只补空的姓名/单位 */
        var added = 0;
        first.rows.forEach(function (r) {
            var p = null;
            state.players.forEach(function (x) { if (x.id === r.id) { p = x; } });
            if (!p) {
                state.players.push({ id: r.id, name: r.name, unit: r.unit || '' });
                added++;
            } else {
                if (!p.name) { p.name = r.name; }
                if (!p.unit && r.unit) { p.unit = r.unit; }
            }
        });
        state.players.sort(function (a, b) { return a.id - b.id; });

        /* 名单补齐后重解析一次，这次能认出对手编号 */
        var res = ML.parseText(text, state.players);
        var rd = roundOf(curRound, true);

        var idSet = {};
        state.players.forEach(function (p) { idSet[p.id] = 1; });

        res.rows.forEach(function (r) {
            /* 第 1 轮开赛前人人 0 分，那唯一的一个数字其实是对手编号 */
            if (curRound === 1) {
                if (r.opp == null && r.pre != null && idSet[r.pre]) { r.opp = r.pre; }
                r.pre = null;
            }
            if (r.pre != null && curRound > 1) { rd.pre[r.id] = r.pre; }
            if (r.opp != null) { rd.opps[r.id] = r.opp; }
        });

        /* 一局只输一次：a 写了对手 b，b 那边空着就补上 a */
        res.rows.forEach(function (r) {
            if (r.opp == null || r.opp === 'bye') { return; }
            var b = r.opp;
            if (rd.opps[b] == null || rd.opps[b] === '') { rd.opps[b] = r.id; }
        });

        $('#paste-hint').textContent = '填入 ' + res.rows.length + ' 人' +
            (added ? '，新增名单 ' + added + ' 人' : '');

        save();
        renderTabs(); syncSetup(); renderEntry(); refreshAll();
    }

    $('#btn-apply-paste').addEventListener('click', applyPaste);

    /* ---------------- 清空本轮 ---------------- */

    var flashEl = null, flashTimer = 0;
    function flash(msg) {
        if (!flashEl) {
            flashEl = document.createElement('div');
            flashEl.className = 'ml-flash';
            document.body.appendChild(flashEl);
        }
        flashEl.textContent = msg;
        flashEl.classList.add('is-on');
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () { flashEl.classList.remove('is-on'); }, 1800);
    }

    /* 把表格里所有能输入的东西按格子清空，不依赖重新渲染的结果 */
    function blankEntryInputs() {
        $$('#entry-host input[data-pre]').forEach(function (i) { i.value = ''; });
        $$('#entry-host input[data-opp]').forEach(function (i) { i.value = ''; });
        $$('#entry-host input[data-ff]').forEach(function (i) { i.checked = false; });
        $$('#entry-host [data-delta]').forEach(function (t) {
            t.textContent = '';
            t.className = 'c-delta';
        });
    }

    $('#btn-clear').addEventListener('click', function () {
        var ask = curRound === 1
            ? '清空第 1 轮的所有输入？名单、姓名、单位、对手都会清掉。'
            : '清空第 ' + curRound + ' 轮的所有输入？';
        if (!confirm(ask)) { return; }

        var rd = roundOf(curRound);
        if (rd) { rd.pre = {}; rd.opps = {}; rd.ff = []; }

        /* 清空的轮次直接从存档里去掉，别留空壳影响页签圆点与推算 */
        state.rounds = state.rounds.filter(function (x) {
            if (x.r !== curRound) { return true; }
            return Object.keys(x.pre || {}).length ||
                   Object.keys(x.opps || {}).length ||
                   (x.ff || []).length;
        });

        /* 第 1 轮连带名单一起清：姓名、单位都是粘贴时带进来的输入 */
        if (curRound === 1) {
            var rest = state.rounds.some(function (x) {
                return Object.keys(x.pre || {}).length ||
                       Object.keys(x.opps || {}).length ||
                       (x.ff || []).length;
            });
            if (!rest) { state.players = []; }
        }

        /* 立刻落盘，不等 220ms 防抖，马上刷新页面也不会复活 */
        clearTimeout(saveTimer);
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}

        /* 粘贴草稿一并清掉，免得再点「填入本轮」把刚清的数据贴回来 */
        $('#paste-text').value = '';
        $('#paste-hint').textContent = '';
        $('#paste-box').hidden = true;

        renderTabs(); syncSetup(); renderEntry(); renderStandings(); renderSolveSelect();
        blankEntryInputs();
        resetSolve();
        flash('已清空第 ' + curRound + ' 轮' + (curRound === 1 ? '，名单也一并清空' : ''));
    });

    /* ---------------- 名次表 ---------------- */

    var standTimer = 0;
    function scheduleStand() {
        clearTimeout(standTimer);
        standTimer = setTimeout(function () { renderSolveSelect(); }, 180);
    }

    function currentState() {
        return {
            totalRounds: state.totalRounds,
            players: state.players,
            rounds: state.rounds,
            withdrawn: state.withdrawn,
            tiebreaks: state.tiebreaks
        };
    }

    function renderStandings() {
        /* 名次表不再单独展示，只维护推算用的选手下拉 */
        renderSolveSelect();
    }

    /* ---------------- 推算 ---------------- */

    var solveKey = '';

    function syncSolveSelect(st) {
        var sel = $('#f-target');
        var keep = sel.value;
        st = st || ML.standings(currentState());
        var opts = st.rows.map(function (r) {
            return '<option value="' + r.id + '">' + r.id + '　' + esc(nameOf(r)) +
                '（' + fmt(r.pts) + ' 分）</option>';
        }).join('');
        sel.innerHTML = opts;
        if (keep && st.rows.some(function (r) { return String(r.id) === keep; })) {
            sel.value = keep;
        }
    }

    function renderSolveSelect() {
        if (!state.players.length) {
            $('#f-target').innerHTML = '<option value="">—</option>';
            return;
        }
        syncSolveSelect();
    }

    function condText(t) {
        var names = {};
        state.players.forEach(function (p) { names[p.id] = nameOf(p); });
        function nm(id) { return names[id] || (id + ' 号'); }
        if (t.code === '1-0') { return nm(t.a) + ' 胜 ' + nm(t.b); }
        if (t.code === '0-1') { return nm(t.a) + ' 负 ' + nm(t.b); }
        return nm(t.a) + ' 平 ' + nm(t.b);
    }

    /* 一组条件统一写成：甲 胜 乙，丙 平 丁；无条件即稳进 */
    function condSentence(parts, rank) {
        if (!parts || !parts.length) { return '一定进前 ' + rank; }
        return parts.map(condText).join('，');
    }

    function runSolve() {
        var host = $('#solve-host');
        if (!state.players.length) {
            host.innerHTML = '<div class="ml-empty">先录名单和成绩。</div>';
            return;
        }
        var tId = Number($('#f-target').value);
        var rank = Math.max(1, Number($('#f-rank').value) || 1);
        if (!tId) {
            host.innerHTML = '<p class="ml-hint">先选一个选手。</p>';
            return;
        }

        var t0 = Date.now();
        var ans = ML.solve(currentState(), tId, rank, { maxGames: 10 });
        var ms = Date.now() - t0;

        if (ans.error) {
            host.innerHTML = '<div class="ml-banner is-no">' + esc(ans.error) + '</div>';
            return;
        }

        var self = esc(ans.target.name || ('#' + ans.target.id));
        var head = '<div class="ml-banner' + (ans.always ? ' is-ok' : (ans.never ? ' is-no' : '')) + '">';

        if (ans.always) {
            head += '<b>' + self + '</b> 一定进前 ' + rank + '。';
        } else if (ans.never) {
            head += '<b>' + self + '</b> 不可能进前 ' + rank + '。';
        } else {
            head += '<b>' + self + '</b> 目前 ' + fmt(ans.target.pts) + ' 分、第 ' +
                ans.target.rank + ' 名；末轮进第 ' + rank + ' 名，按 胜 · 平 · 负 三种情况。' +
                '<br><span style="color:var(--muted);font-size:12.5px">共比较 ' + ans.counts.all +
                ' 种末轮结果，其中 ' + ans.counts.ok + ' 种达成；' + ans.assumes + '。</span>';
        }
        head += '</div>';

        var label = { win: self + ' 胜', draw: self + ' 平', loss: self + ' 负' };
        var badge = { win: 'is-win', draw: 'is-draw', loss: 'is-loss' };
        var byOut = {};
        ans.groups.forEach(function (g) { byOut[g.tOutcome] = g; });

        /* 三段恒定：胜 / 平 / 负，句式统一 */
        var body = '';
        var hasMulti = false;
        if (!ans.always && !ans.never) {
            body = ['win', 'draw', 'loss'].map(function (k) {
                var g = byOut[k];
                var tag = '<span class="ml-badge ' + badge[k] + '">' + esc(label[k]) + '</span>';
                if (!g || !g.terms.length) {
                    return '<div class="ml-case is-empty"><div class="ml-case-head">' + tag +
                        '<span class="ml-case-line">不可能进前 ' + rank + '</span></div></div>';
                }
                if (g.terms.length === 1) {
                    return '<div class="ml-case"><div class="ml-case-head">' + tag +
                        '<span class="ml-case-line">' + condSentence(g.terms[0], rank) + '</span></div></div>';
                }
                var lis = g.terms.map(function (p) {
                    return '<li>' + condSentence(p, rank) + '</li>';
                }).join('');
                hasMulti = true;
                return '<div class="ml-case"><div class="ml-case-head">' + tag +
                    '<span class="ml-case-line">满足任一条件，共 ' + g.terms.length + ' 种：</span>' +
                    '</div><ul>' + lis + '</ul></div>';
            }).join('');
        }

        var tail = '耗时 ' + ms + ' ms，枚举 ' + ans.games + ' 场关键对局';
        if (hasMulti) { tail += '；同一段内多条条件满足任意一条即可'; }

        host.innerHTML = head + body + '<p class="ml-hint">' + tail + '。</p>';
    }

    $('#btn-solve').addEventListener('click', runSolve);
    $('#f-rank').addEventListener('keydown', function (e) { if (e.key === 'Enter') { runSolve(); } });

    /* ---------------- 导入导出 ---------------- */

    function download(name, text) {
        var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }

    $('#btn-export').addEventListener('click', function () {
        var name = '末轮计算器-' + new Date().toISOString().slice(0, 10) + '.json';
        download(name, JSON.stringify(state, null, 2));
    });

    $('#btn-import').addEventListener('click', function () {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.json,application/json';
        inp.addEventListener('change', function () {
            var f = inp.files && inp.files[0];
            if (!f) { return; }
            var fr = new FileReader();
            fr.onload = function () {
                try {
                    var s = JSON.parse(String(fr.result));
                    if (!s || !Array.isArray(s.players)) { throw new Error('格式不对'); }
                    state = s;
                    state.tiebreaks = ML.normalizeTiebreaks(state.tiebreaks);
                    if (!state.tiebreaks.length) { state.tiebreaks = ML.DEFAULT_TIEBREAK.slice(); }
                    ML.CFG.byePoint = state.byePoint || 1;
                    curRound = Math.min(state.totalRounds, Math.max(1, lastPlayed() + 1));
                    save();
                    syncSetup(); renderTiebreak(); renderTabs(); renderEntry();
                    renderStandings(); renderSolveSelect();
                } catch (e) {
                    alert('导入失败：' + e.message);
                }
            };
            fr.readAsText(f);
        });
        inp.click();
    });

    $('#btn-reset').addEventListener('click', function () {
        if (!confirm('清空全部名单与成绩？导出过的存档不受影响。')) { return; }
        state = blank();
        curRound = 1;
        localStorage.removeItem(LS_KEY);
        syncSetup(); renderTiebreak(); renderTabs(); renderEntry();
        renderStandings(); renderSolveSelect();
        $('#solve-host').innerHTML = '<p class="ml-hint">录完前几轮后，这里会列出末轮条件。</p>';
    });

    /* ---------------- 图片识别 ---------------- */

    /* 匿名免费视觉接口：OVHcloud AI Endpoints，不需要 key（每分钟 2 次） */
    var OCR_API = {
        base: 'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1/chat/completions',
        model: 'Qwen2.5-VL-72B-Instruct'
    };

    /* 只读表格数据行，不要解释文字 */
    var OCR_PROMPT = [
        '这是一张棋类比赛（瑞士制）的成绩单照片，请把表格逐行读出来。',
        '只输出数据行，一行一个选手，字段顺序固定：',
        '编号 姓名 单位 上轮积分 对手编号',
        '字段之间只用一个空格分隔。',
        '要求：',
        '1. 不要输出表头、序号、列名、说明、Markdown 代码块，只输出数据行。',
        '2. 编号、对手编号是整数；上轮积分是数字，可能带 .5，照抄，不要换算。',
        '3. 姓名照抄中文，不要翻译、不要改写；单位照抄，没有就写 -。',
        '4. 对手栏是“轮空”“bye”“BYE”或空白的，统一写 bye；其他看不清的写 -。',
        '5. 看不清的字符写 ?，不要猜。按编号从小到大排列。',
        '6. 一张图里有多张表时，只读最后一张（最后一轮）。'
    ].join('\n');

    /* 图片压缩到长边 maxSide，避免 base64 过大 */
    function fileToImage(f, maxSide) {
        return new Promise(function (res, rej) {
            var fr = new FileReader();
            fr.onerror = function () { rej(new Error('图片读不出来')); };
            fr.onload = function () {
                var raw = String(fr.result);
                var img = new Image();
                img.onerror = function () { rej(new Error('图片格式不支持')); };
                img.onload = function () {
                    var w = img.naturalWidth, h = img.naturalHeight;
                    var k = Math.min(1, maxSide / Math.max(w, h));
                    if (!w || !h) { return res({ url: raw, b64: raw.split(',')[1] || '', mime: f.type || 'image/jpeg' }); }
                    if (k > 0.999 && f.size < 1.6e6) {
                        return res({ url: raw, b64: raw.split(',')[1] || '', mime: f.type || 'image/jpeg' });
                    }
                    var cv = document.createElement('canvas');
                    cv.width = Math.max(1, Math.round(w * k));
                    cv.height = Math.max(1, Math.round(h * k));
                    var ctx = cv.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, cv.width, cv.height);
                    ctx.drawImage(img, 0, 0, cv.width, cv.height);
                    var out = cv.toDataURL('image/jpeg', 0.92);
                    res({ url: out, b64: out.split(',')[1], mime: 'image/jpeg' });
                };
                img.src = raw;
            };
            fr.readAsDataURL(f);
        });
    }

    function readJson(r) {
        if (r.status === 429) { throw new Error('免费接口每分钟只放 2 次，等一分钟再试'); }
        return r.text().then(function (txt) {
            var j;
            try { j = JSON.parse(txt); } catch (e) { throw new Error('返回不是 JSON（' + txt.slice(0, 80) + '）'); }
            if (!r.ok) {
                var m = (j.error && (j.error.message || j.error.code)) || j.message || ('HTTP ' + r.status);
                throw new Error(String(m).slice(0, 160));
            }
            return j;
        });
    }

    /* 匿名免费接口，不带任何 key */
    function callVision(img) {
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 90000) : 0;

        var p = fetch(OCR_API.base, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: OCR_API.model,
                temperature: 0.1,
                messages: [{
                    role: 'user',
                    content: [
                        { type: 'image_url', image_url: { url: img.url } },
                        { type: 'text', text: OCR_PROMPT }
                    ]
                }]
            }),
            signal: ctrl ? ctrl.signal : undefined
        }).then(readJson).then(function (j) {
            var ch = (j.choices || [])[0] || {};
            return (ch.message && ch.message.content) || '';
        }).catch(function (err) {
            if (err && err.name === 'AbortError') { throw new Error('等了 90 秒没回应，换个网络或稍后再试'); }
            if (err instanceof TypeError) { throw new Error('连不上识别服务，可能是网络问题'); }
            throw err;
        });

        if (timer) { p = p.then(function (v) { clearTimeout(timer); return v; },
                                 function (e) { clearTimeout(timer); throw e; }); }
        return p;
    }

    /* 只留「编号 开头」的行，去掉表头、说明、代码块 */
    function cleanOcrText(text) {
        var raw = String(text || '').replace(/```[a-zA-Z]*\n?/g, '').split(/\r?\n/);
        var out = [];
        raw.forEach(function (l) {
            var s = l.replace(/[|│`*]/g, ' ').replace(/\s+/g, ' ').trim();
            if (!s) { return; }
            var m = s.match(/^(\d{1,4})[\s.、)．,，:：-]*(.*)$/);
            if (!m) { return; }
            out.push((m[1] + ' ' + m[2]).replace(/\s+$/, ''));
        });
        return out;
    }

    var pendingImage = null;

    function runVision() {
        if (!pendingImage) { $('#paste-hint').textContent = '先点「识别图片」选一张成绩单照片。'; return; }

        var btn = $('#btn-ocr');
        btn.disabled = true;
        $('#paste-hint').textContent = '正在压缩图片…';

        fileToImage(pendingImage, 1800).then(function (img) {
            $('#paste-hint').textContent = '识别中…（' + Math.round(img.b64.length / 1365) + ' KB，首次要等十几秒）';
            return callVision(img);
        }).then(function (text) {
            var lines = cleanOcrText(text);
            $('#paste-text').value = lines.length ? lines.join('\n') : String(text || '').trim();
            $('#paste-hint').textContent = lines.length
                ? '识别出 ' + lines.length + ' 行，请核对编号、上轮积分与对手再填入'
                : '没读出可用的行，原文已放进输入框，请手动整理';
        }).catch(function (err) {
            $('#paste-hint').textContent = '识别失败：' + err.message + '。';
        }).then(function () { btn.disabled = false; });
    }

    $('#btn-ocr').addEventListener('click', function () {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.addEventListener('change', function () {
            var f = inp.files && inp.files[0];
            if (!f) { return; }
            pendingImage = f;
            openPaste('');
            runVision();
        });
        inp.click();
    });

    /* ---------------- 启动 ---------------- */

    /* 数据一改，上一轮的推算结论就作废，直接收掉，免得看着像没反应 */
    function resetSolve() {
        var h = $('#solve-host');
        if (h) { h.innerHTML = ''; }
    }

    function refreshAll() {
        renderStandings();
        renderSolveSelect();
        syncSetup();
        resetSolve();
    }

    ML.CFG.byePoint = state.byePoint || 1;
    syncSetup();
    renderTiebreak();
    renderTabs();
    renderEntry();
    renderStandings();
    syncSolveSelect();
    if (!state.players.length) {
        $('#solve-host').innerHTML = '<p class="ml-hint">录完前几轮后，这里会列出末轮条件。</p>';
    }
})();
</script>
